EED SCALE INDICATES THE SPEED VALUE THAT WILL BE ATTAINED IN _____ SECONDS IF THE ACCELERATION REMAINS CONSTANT.","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"B","confidence":"h","explanation":"La flecha de tendencia indica la velocidad en 10 s.","fcomRef":"DSC-31"},{"id":"indicating-12","n":12,"q":"THE SYSTEM DISPLAY (SD) HAS 12 DIFFERENT SYSTEM PAGES THAT CAN BE DISPLAYED:","options":[{"key":"A","text":"AUTOMATICALLY."},{"key":"B","text":"ON CREW DEMAND."},{"key":"C","text":"BOTH A AND B."}],"answer":"C","confidence":"h","explanation":"Las páginas SD se muestran automáticamente o a pedido.","fcomRef":"DSC-31"},{"id":"indicating-13","n":13,"q":"THE THREE DISPLAY MANAGEMENT COMPUTERS (DMCS) ACQUIRE:","options":[{"key":"A","text":"A PROCESS ALL INPUT FROM AIRPLANE SENSORS AND COMPUTERS TO GENERATE THE DISPLAY IMAGES."},{"key":"B","text":"DATA FOR THE DISPLAY OF ALERT MESSAGES, AURAL ALERTS, AND VOICE MESSAGES."},{"key":"C","text":"DATA FOR ACARS MESSAGES."}],"answer":"A","confidence":"h","explanation":"Las DMC procesan los datos de sensores y computadoras para generar las imágenes.","fcomRef":"DSC-31"},{"id":"indicating-14","n":14,"q":"WEATHER RADAR CAN BE DISPLAYED IN WHAT MODES ON THE ND?","options":[{"key":"A","text":"ARC AND ROSE NAV MODES ONLY."},{"key":"B","text":"ALL MODES EXCEPT PLAN."},{"key":"C","text":"ROSE VOR AND ROSE ILS MODES."},{"key":"D","text":"ROSE NAV MODE ONLY."}],"answer":"B","confidence":"h","explanation":"Radar en todos los modos excepto PLAN.","fcomRef":"DSC-34"},{"id":"indicating-15","n":15,"q":"WHEN THE TO CONFIG KEY IS PUSHED IT:","options":[{"key":"A","text":"SIMULATES TAKEOFF POWER APPLICATION."},{"key":"B","text":"TRIGGERS A WARNING IF THE AIRPLANE IS NOT PROPERLY CONFIGURED."},{"key":"C","text":"DISPLAYS TO CONFIG NORMAL IF AIRPLANE PROPERLY CONFIGURED."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"D","confidence":"h","explanation":"T.O CONFIG simula potencia de despegue, alerta si hay mala configuración y muestra T.O CONFIG NORMAL si está bien.","fcomRef":"DSC-31"}]},{"id":"apu","name":"APU AND POWER PLANTS","nameEs":"APU y plantas de poder","questions":[{"id":"apu-1","n":1,"q":"A/THR ENGAGEMENT IS CONFIRMED WHEN \"A/THR\" IS DISPLAYED IN _______ IN THE RIGHT COLUMN OF THE FMA.","options":[{"key":"A","text":"GREEN."},{"key":"B","text":"BLUE."},{"key":"C","text":"WHITE."}],"answer":"C","confidence":"h","explanation":"A/THR blanco en el FMA = enganchado y activo (azul = armado).","fcomRef":"DSC-22_40"},{"id":"apu-2","n":2,"q":"BAT 1 AND 2 PUSH BUTTONS DO NOT NEED TO BE SELECTED ON IF EXTERNAL POWER IS AVAILABLE.","options":[{"key":"A","text":"IT IS NORMALLY LEFT IN THE LIGHTS OUT POSITION."},{"key":"B","text":"WHEN SELECTED OFF, THE APU GENERATOR IS DE-ENERGIZED."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"m","explanation":"Pregunta con redacción mezclada: el APU GEN pb normalmente queda sin luces (ON) y en OFF desenergiza el generador.","fcomRef":"DSC-24"},{"id":"apu-3","n":3,"q":"CAN THE APU BE USED WITH WING ANTI-ICE ON?","options":[{"key":"A","text":"NO."},{"key":"B","text":"YES, BUT ONLY FOR ELECTRICAL POWER. THE APU BLEED VALVE SHOULD NOT BE OPENED WHILE USING WING ANTI-ICE."},{"key":"C","text":"YES, EXCEPT DURING APPROACH AND GO-AROUND."},{"key":"D","text":"YES, BUT THE ALTITUDE OF UTILIZATION IS LIMITED TO 15,000 FT."}],"answer":"B","confidence":"h","explanation":"Limitación: no usar APU bleed para wing anti-ice; el APU puede usarse para electricidad.","fcomRef":"LIM-49"},{"id":"apu-4","n":4,"q":"CONTINUOUS IGNITION IS AUTOMATICALLY PROVIDED DURING THE FOLLOWING:","options":[{"key":"A","text":"FLEX OR TO/GA THRUST IS SELECTED ON THE GROUND."},{"key":"B","text":"ENG ANTICE SWITCH IS ON."},{"key":"C","text":"ENGINE APPROACH IDLE SELECTED."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Ignición continua automática: TO/FLX en tierra, ENG ANTI ICE ON, approach idle, etc.","fcomRef":"DSC-70"},{"id":"apu-5","n":5,"q":"DURING AN AUTOMATIC START SEQUENCE, SELECTING THE ENG MASTER SWITCH TO ON:","options":[{"key":"A","text":"CLOSES THE PACK VALVES."},{"key":"B","text":"INITIATES THE START SEQUENCE."},{"key":"C","text":"DISPLAYS THE ECAM ENGINE PAGE."},{"key":"D","text":"BOTH A AND B."}],"answer":"D","confidence":"m","explanation":"MASTER ON en arranque automático: inicia la secuencia y (con IGN/START) cierra las pack valves.","fcomRef":"DSC-70"},{"id":"apu-6","n":6,"q":"FIRE ON GROUND OR IN FLIGHT WILL CAUSE THE APU MASTER SW PUSHBUTTON FAULT LIGHT TO COME ON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"m","explanation":"Falso: FAULT indica un auto-shutdown; en vuelo el fuego del APU no produce apagado automático.","fcomRef":"DSC-49"},{"id":"apu-7","n":7,"q":"FIRE ON GROUND OR IN FLIGHT WILL CAUSE THE APU MASTER SW PUSHBUTTON FAULT LIGHT TO COME ON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"m","explanation":"Falso: FAULT indica auto-shutdown; en vuelo el fuego no apaga el APU automáticamente.","fcomRef":"DSC-49"},{"id":"apu-8","n":8,"q":"HOW MANY THRUST LEVER POSITIONS ARE THERE, AND HOW ARE THEY LABELLED?","options":[{"key":"A","text":"SIX, TO/GA, MCT, FLEX, CL, IDLE AND REV IDLE."},{"key":"B","text":"SIX, TO/GA, FLX/MCT, CL, IDLE, REV IDLE AND MREV."},{"key":"C","text":"FOUR, TO/GA, FLX/MCT, CL, IDLE."},{"key":"D","text":"FIVE, TO/GA, FLX/MCT, CT, IDLE AND REV IDLE."}],"answer":"B","confidence":"h","explanation":"Seis posiciones: TOGA, FLX/MCT, CL, IDLE, REV IDLE y MAX REV.","fcomRef":"DSC-70"},{"id":"apu-9","n":9,"q":"IF AN INSTINCTIVE DISCONNECT PB. IS PUSHED AND HELD FOR MORE THAN ______, THE A/THR SYSTEM IS DISCONNECTED FOR THE REMAINDER OF THE FLIGHT, INCLUDING THE ALPHA FLOOR PROTECTION.","options":[{"key":"A","text":"30 SECONDS."},{"key":"B","text":"15 SECONDS."},{"key":"C","text":"40 SECONDS."}],"answer":"B","confidence":"h","explanation":"Instinctive disconnect > 15 s: A/THR desconectado el resto del vuelo, incluido alpha floor.","fcomRef":"DSC-22_40"},{"id":"apu-10","n":10,"q":"MAXIMUM ALTITUDE FOR APU BLEED OPERATION IS:","options":[{"key":"A","text":"15,000 FT."},{"key":"B","text":"18,000 FT."},{"key":"C","text":"20,000 FT."},{"key":"D","text":"22,000 FT."}],"answer":"C","confidence":"m","explanation":"APU bleed: hasta 20.000 ft (según la versión/APU puede ser 22.500 ft).","fcomRef":"LIM-49"},{"id":"apu-11","n":11,"q":"ON GROUND, THE NO BREAK POWER TRANSFER FUNCTION IS INHIBITED IN CASE OF APU SHUTDOWN GENERATED BY WHICH OF THE FOLLOWING CONDITIONS?","options":[{"key":"A","text":"AUTOMATIC APU SHUT DOWN TRIGGERED BY THE ECB."},{"key":"B","text":"APU SHUT DOWN FROM THE REFUEL/DEFUEL PANEL OR FROM THE APU FIRE PUSHBUTTON."},{"key":"C","text":"APU SHUT DOWN FROM EMERGENCY CONTROL PROVIDED ON THE EXTERNAL POWER PANEL."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"m","explanation":"La no-break power transfer se inhibe con cualquier apagado de emergencia del APU.","fcomRef":"DSC-49"},{"id":"apu-12","n":12,"q":"THE APU BLEED VALVE IS AUTOMATICALLY CLOSED ABOVE ____ FEET DESCENDING BY THE ECB.","options":[{"key":"A","text":"23,000 FEET."},{"key":"B","text":"26,000 FEET."},{"key":"C","text":"28,000 FEET."},{"key":"D","text":"29,000 FEET."}],"answer":"A","confidence":"l","explanation":"Altitud de cierre automático del APU bleed por la ECB — baja certeza, verificar FCOM.","fcomRef":"DSC-49"},{"id":"apu-13","n":13,"q":"THE APU CANNOT BE SHUT DOWN FROM OUTSIDE THE AIRCRAFT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."},{"key":"C","text":"APU SHUT OFF PUSHBUTTON ON EXTERNAL POWER PANEL."}],"answer":"C","confidence":"h","explanation":"Puede apagarse desde afuera con el APU SHUT OFF pb del panel de potencia externa.","fcomRef":"DSC-49"},{"id":"apu-14","n":14,"q":"THE APU HAS AN INTEGRAL INDEPENDENT LUBRICATION SYSTEM FOR LUBRICATION AND COOLING.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: el APU tiene sistema de lubricación propio.","fcomRef":"DSC-49"},{"id":"apu-15","n":15,"q":"THE APU IS SUPPLIED FROM THE:","options":[{"key":"A","text":"LEFT FUEL FEED LINE."},{"key":"B","text":"RIGHT FUEL FEED LINE."}],"answer":"A","confidence":"h","explanation":"El APU se alimenta de la línea izquierda de combustible.","fcomRef":"DSC-49"},{"id":"apu-16","n":16,"q":"THE APU MASTER SW FAULT LIGHT WILL ILLUMINATE:","options":[{"key":"A","text":"WHEN APU LOW OIL PRESSURE IS DETECTED."},{"key":"B","text":"WHEN AN AUTOMATIC SHUTDOWN OF THE APU OCCURS."},{"key":"C","text":"FOR AN APU OVERHEAT OR APU FIRE."},{"key":"D","text":"IF THE BATTERIES ARE SELECTED OFF WHILE THE APU IS OPERATING."}],"answer":"B","confidence":"h","explanation":"APU MASTER FAULT: apagado automático del APU.","fcomRef":"DSC-49"},{"id":"apu-17","n":17,"q":"THE APU MAY BE STARTED UP TO WHAT ALTITUDE?","options":[{"key":"A","text":"THE APU CAN BE STARTED AT ANY ALTITUDE USING NORMAL AIRCRAFT ELECTRICAL POWER."},{"key":"B","text":"THE APU CAN BE STARTED UP TO 35,000 FEET USING ONLY THE AIRCRAFT BATTERIES."},{"key":"C","text":"THE APU CAN BE STARTED UP TO 30,000 FEET USING ONLY THE AIRCRAFT BATTERIES."},{"key":"D","text":"THE APU CAN BE STARTED UP TO 25,000 FEET USING ONLY THE AIRCRAFT BATTERIES."}],"answer":"D","confidence":"m","explanation":"Con sólo baterías, el arranque del APU está garantizado hasta 25.000 ft.","fcomRef":"LIM-49"},{"id":"apu-18","n":18,"q":"THE APU MAY OBTAIN POWER FOR STARTING FROM:","options":[{"key":"A","text":"GROUND SERVICES."},{"key":"B","text":"NORMAL AIRCRAFT SUPPLY."},{"key":"C","text":"THE AIRCRAFT'S BATTERIES OR IN COMBINATION WITH THE EXTERNAL POWER."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Arranque con baterías, red normal o potencia externa.","fcomRef":"DSC-49"},{"id":"apu-19","n":19,"q":"THE APU MAY OBTAIN POWER FOR STARTING FROM:","options":[{"key":"A","text":"GROUND SERVICES."},{"key":"B","text":"NORMAL AIRCRAFT SUPPLY."},{"key":"C","text":"THE AIRCRAFT/’S BATTERIES OR IN COMBINATION WITH THE EXTERNAL POWER."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Arranque con baterías, red normal o potencia externa.","fcomRef":"DSC-49"},{"id":"apu-20","n":20,"q":"THE A/THR IS ARMED ON THE GROUND PROVIDED AT LEAST ONE FD IS ON BY:","options":[{"key":"A","text":"SETTING THE THROTTLES TO TO/GA."},{"key":"B","text":"AUTOMATICALLY AT ENGINE START."},{"key":"C","text":"WITH ENGINES RUNNING, PRESSING THE A/THR P/B MANUALLY."}],"answer":"A","confidence":"h","explanation":"A/THR se arma en tierra al poner TOGA/FLX con al menos un FD ON.","fcomRef":"DSC-22_40"},{"id":"apu-21","n":21,"q":"THE BASIC ELEMENT OF THE APU IS A SINGLE SHAFT GAS TURBINE WHICH DELIVERS ______ POWER FOR DRIVING THE ACCESSORY GEARBOX (ELECTRICAL GENERATOR) AND PRODUCES BLEED AIR (ENGINE STARTING AND PNEUMATIC SUPPLY).","options":[{"key":"A","text":"2ND STAGE COMPRESSOR"},{"key":"B","text":"3RD STAGE TURBINE"},{"key":"C","text":"2ND STAGE TURBINE."},{"key":"D","text":"MECHANICAL SHAFT"}],"answer":"D","confidence":"h","explanation":"La turbina de un eje entrega potencia mecánica al gearbox y aire de sangrado.","fcomRef":"DSC-49"},{"id":"apu-22","n":22,"q":"THE BASIC ELEMENT OF THE APU IS A SINGLE SHAFT GAS TURBINE WHICH DELIVERS ______ POWER FOR DRIVING THE ACCESSORY GEARBOX (ELECTRICAL GENERATOR) AND PRODUCES BLEED AIR (ENGINE STARTING AND PNEUMATIC SUPPLY).","options":[{"key":"A","text":"2ND. STAGE COMPRESSOR."},{"key":"B","text":"3RD. STAGE TURBINE."},{"key":"C","text":"2ND. STAGE TURBINE."},{"key":"D","text":"MECHANICAL SHAFT."}],"answer":"D","confidence":"h","explanation":"Potencia mecánica en el eje.","fcomRef":"DSC-49"},{"id":"apu-23","n":23,"q":"THE ECB (ELECTRONIC CONTROL BOX) CONTROLS THE ELECTRIC STARTER","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE"}],"answer":"A","confidence":"h","explanation":"Verdadero: la ECB controla el arrancador.","fcomRef":"DSC-49"},{"id":"apu-24","n":24,"q":"THE ECB (ELECTRONIC CONTROL BOX) CONTROLS THE FUEL FLOW.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: la ECB controla el flujo de combustible.","fcomRef":"DSC-49"},{"id":"apu-25","n":25,"q":"THE ELECTRONIC CONTROL BOX (ECB) IS PRIMARILY A FULL AUTHORITY DIGITAL ELECTRONIC CONTROLLER THAT PERFORMS THE APU SYSTEM LOGIC FOR ALL MODES OF APU OPERATION SUCH AS:","options":[{"key":"A","text":"SEQUENCE AND MONITORING OF START."},{"key":"B","text":"SPEED AND TEMPERATURE MONITORING."},{"key":"C","text":"MONITORING OF BLEED AIR AND SHUT DOWN."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"La ECB hace todo: secuencia de arranque, velocidad, temperatura, bleed y apagado.","fcomRef":"DSC-49"},{"id":"apu-26","n":26,"q":"THE ELECTRONIC CONTROL BOX (ECB) IS PRIMARILY A FULL AUTHORITY DIGITAL ELECTRONIC CONTROLLER THAT PERFORMS THE APU SYSTEM LOGIC FOR ALL MODES OF APU OPERATION SUCH AS:","options":[{"key":"A","text":"SEQUENCE AND MONITORING OF START."},{"key":"B","text":"SPEED AND TEMPERATURE MONITORING"},{"key":"C","text":"MONITORING OF BLEED AIR AND SHUT DOWN."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Todas las anteriores.","fcomRef":"DSC-49"},{"id":"apu-27","n":27,"q":"THE FADEC HAS CONTROL DURING A MANUAL ENGINE START SEQUENCE EXCEPT FOR:","options":[{"key":"A","text":"THE HIGH PRESSURE FUEL VALVE."},{"key":"B","text":"THE START VALVE."},{"key":"C","text":"AN AUTOMATIC ABORT."}],"answer":"C","confidence":"h","explanation":"En arranque manual el FADEC no hace auto-abort.","fcomRef":"DSC-70"},{"id":"apu-28","n":28,"q":"THE FADEC IS NORMALLY POWERED BY:","options":[{"key":"A","text":"THE RAT."},{"key":"B","text":"IT'S OWN MAGNETIC ALTERNATOR."},{"key":"C","text":"THE NORMAL AIRCRAFT ELECTRICAL SYSTEM."}],"answer":"B","confidence":"h","explanation":"El FADEC se alimenta normalmente de su propio alternador magnético.","fcomRef":"DSC-70"},{"id":"apu-29","n":29,"q":"THE FADEC WILL AUTOMATICALLY ABORT AN ABNORMAL START THEREBY PROVIDING ENGINE LIMIT PROTECTION, BUT WILL THE FADEC ALSO AUTOMATICALLY DRY CRANK THE ENGINE?","options":[{"key":"A","text":"NO, THAT IS WHY THERE IS A CRANK SELECTION ON THE ENG MODE SELECTOR."},{"key":"B","text":"YES, EVEN IF THE CREW INTERRUPTS THE START BY PLACING THE ENG MASTER SWITCH TO OFF."},{"key":"C","text":"YES, AL LONG AS THE ENG MASTER SWITCH REMAINS IN THE ON POSITION."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"C","confidence":"h","explanation":"Sí: hace dry crank automático mientras el MASTER siga en ON.","fcomRef":"DSC-70"},{"id":"apu-30","n":30,"q":"THE FULL AUTHORITY DIGITAL ENGINE CONTROL (FADEC) CONTROLS WHICH OF THE FOLLOWING FUNCTIONS:","options":[{"key":"A","text":"FUEL METERING"},{"key":"B","text":"ENGINE LIMITS"},{"key":"C","text":"AUTOMATIC AND MANUAL STARTING"},{"key":"D","text":"ALL OF THE ABOVE"}],"answer":"D","confidence":"h","explanation":"FADEC: dosificación de combustible, límites, arranque automático y manual.","fcomRef":"DSC-70"},{"id":"apu-31","n":31,"q":"THE NORMAL MODE TO SET THRUST IS:","options":[{"key":"A","text":"EPR."},{"key":"B","text":"N1."},{"key":"C","text":"N2."}],"answer":"B","confidence":"m","explanation":"Depende del motor: N1 en CFM56, EPR en IAE V2500. Verificar qué motor usa tu operador.","fcomRef":"DSC-70"},{"id":"apu-32","n":32,"q":"THE STARTER ENGAGES IF THE AIR INTAKE IS CLOSED AND THE MASTER SW AND THE START PUSHBUTTONS ARE ON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: el arrancador no engancha hasta que la toma de aire esté abierta.","fcomRef":"DSC-49"},{"id":"apu-33","n":33,"q":"THE STARTER ENGAGES IF THE AIR INTAKE IS CLOSED AND THE MASTER SW AND THE START PUSHBUTTONS ARE ON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: requiere la air intake flap abierta.","fcomRef":"DSC-49"},{"id":"apu-34","n":34,"q":"TO START THE APU THE:","options":[{"key":"A","text":"BAT 1 AND 2 PUSH BUTTONS MUST BE SELECTED TO ON."},{"key":"B","text":"BAR 1 AND 2 PUSH BUTTONS DO NOT NEED TO BE SELECTED ON IF EXTERNAL POWER IS AVAILABLE."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"A","confidence":"h","explanation":"Para arrancar el APU, BAT 1 y 2 deben estar en ON.","fcomRef":"DSC-49"},{"id":"apu-35","n":35,"q":"WHAT ARE SOME OF THE CAUSES FOR AN APU AUTOMATIC SHUTDOWN?","options":[{"key":"A","text":"FIRE (ON GROUND ONLY), EGT OVERTEMPERATURE, NO ACCELERATION, LOW OIL PRESSURE."},{"key":"B","text":"FIRE (ON GROUND ONLY), EGT OVERTEMPERATURE, UNDERSPEED, OVERSPEED, LOW OIL PRESSURE, HIGH OIL PRESSURE."},{"key":"C","text":"FIRE (ON GROUND ONLY), EGT OVERTEMPERATURE, REVERSE FLOW, OVERSPEED, LOW OIL PRESSURE, HIGH OIL PRESSURE."},{"key":"D","text":"FIRE (ON GROUND ONLY), UNDERSPEED, OVERSPEED, EGT OVERTEMPERATURE, REVERSE FLOW, LOW OIL PRESSURE, DC POWER LOSS. I. FIRE (ON GROUND ONLY), UNDERSPEED AND OVERSPEED, EGT OVERTEMPERATURE, REVERSE FLOW, LOW OIL PRESSURE, DC POWER LOSS, NO ACCELERATION, HIGH OIL TEMPERATURE, ECB FAILURE, SLOW START, LOSS OF OVERSPEED PROTECTION."}],"answer":"D","confidence":"h","explanation":"Causas de auto-shutdown: fuego (tierra), under/overspeed, EGT, reverse flow, baja presión de aceite, pérdida de DC, etc.","fcomRef":"DSC-49"},{"id":"apu-36","n":36,"q":"WHAT ARE SOME OF THE CAUSES FOR AN APU AUTOMATIC SHUTDOWN?","options":[{"key":"A","text":"FIRE (ON GROUND ONLY), EGT OVERTEMPERATURE, NO ACCELERATION, LOW OIL PRESSURE."},{"key":"B","text":"FIRE (ON GROUND ONLY), EGT OVERTEMPERATURE, UNDERSPEED, OVERSPEED, LOW OIL PRESSURE, HIGH OIL PRESSURE"},{"key":"C","text":"FIRE (ON GROUND ONLY), EGT OVERTEMPERATURE, REVERSE FLOW, OVERSPEED, LOW OIL PRESSURE, HIGH OIL PRESSURE"},{"key":"D","text":"FIRE (ON GROUND ONLY), UNDERSPEED, OVERSPEED, EGT OVERTEMPERATURE, REVERSE FLOW, LOW OIL PRESSURE, DC POWER LOSS. I. FIRE (ON GROUND ONLY), - UNDERSPEED AND OVERSPEED, - EGT OVERTEMPERATURE, - REVERSE FLOW, - LOW OIL PRESSURE, - DC POWER LOSS,- NO ACCELERATION,- HIGH OIL TEMPERATURE,- ECB FAILURE,- SLOW START,- LOSS OF OVERSPEED PROTECTION"}],"answer":"D","confidence":"h","explanation":"Lista completa de causas de auto-shutdown.","fcomRef":"DSC-49"},{"id":"apu-37","n":37,"q":"WHAT DOES THE FLEX REPRESENT IN THE FLX/MCT DETENT?","options":[{"key":"A","text":"THIS IS A REDUCED THRUST SETTING USED FOR TAKEOFF."},{"key":"B","text":"THIS IS THE THRUST SETTING THAT SHOULD BE CHOSEN IN THE CASE OF A SINGLE- ENGINE GO-AROUND."},{"key":"C","text":"NONE OF THE ABOVE."}],"answer":"A","confidence":"h","explanation":"FLEX = empuje reducido para el despegue.","fcomRef":"DSC-70"},{"id":"apu-38","n":38,"q":"WHAT IS REQUIRED FOR THE FADEC TO COMPUTE A REDUCED THRUST SETTING?","options":[{"key":"A","text":"A FLEX TEMPERATURE MUST BE ENTERED ON THE INIT PAGE OF THE MCDU."},{"key":"B","text":"NOTHING, IT IS AN AUTOMATIC FUNCTION OF THE FADEC."},{"key":"C","text":"A FLEX TEMPERATURE MUST BE ENTERED ON THE TAKE OFF PERF PAGE OF THE MCDU."},{"key":"D","text":"A OR C ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Se ingresa FLEX TEMP en la página PERF TAKE OFF.","fcomRef":"DSC-22_20"},{"id":"apu-39","n":39,"q":"WHAT IS THE MAXIMUM ALTITUDE AT WHICH THE APU MAY BE STARTED USING THE BATTERIES ONLY?","options":[{"key":"A","text":"15, 000 FT."},{"key":"B","text":"20, 000 FT."},{"key":"C","text":"25, 000 FT."},{"key":"D","text":"39, 000 FT"}],"answer":"C","confidence":"h","explanation":"Arranque del APU sólo con baterías: hasta 25.000 ft.","fcomRef":"LIM-49"},{"id":"apu-40","n":40,"q":"WHAT IS THE MAXIMUM ALTITUDE AT WHICH THE APU MAY BE STARTED USING THE BATTERIES ONLY?","options":[{"key":"A","text":"15,000 FT."},{"key":"B","text":"20,000 FT."},{"key":"C","text":"25,000 FT."},{"key":"D","text":"39,000 FT."}],"answer":"C","confidence":"h","explanation":"Arranque del APU sólo con baterías: hasta 25.000 ft.","fcomRef":"LIM-49"},{"id":"apu-41","n":41,"q":"WHEN SELECTED ON, THE APU START PUSH BUTTON, WILL:","options":[{"key":"A","text":"CONNECT THE APU GENERATOR TO THE AIRCRAFT ELECTRICAL SYSTEM."},{"key":"B","text":"START THE APU IF THE APU MASTER SW WAS PREVIOUSLY SELECTED ON."},{"key":"C","text":"OPEN THE AIR INTAKE FLAP AND SUPPLY FUEL PRESSURE."}],"answer":"B","confidence":"h","explanation":"START arranca el APU si el MASTER SW ya está en ON.","fcomRef":"DSC-49"},{"id":"apu-42","n":42,"q":"WHEN THE APU IS RUNNING, THE APU FUEL PUMP:","options":[{"key":"A","text":"RUNS WHEN TANK PUMPS PRESSURE IS NOT SUFFICIENT."},{"key":"B","text":"RUNS ALL TIME."},{"key":"C","text":"RUNS ONLY IN FLIGHT."},{"key":"D","text":"RUNS WHEN THE APU FUEL PUMP IS SELECTED ON."}],"answer":"A","confidence":"h","explanation":"La bomba del APU funciona si la presión de las bombas de tanque es insuficiente.","fcomRef":"DSC-49"},{"id":"apu-43","n":43,"q":"WHEN THE APU MASTER SW IS SELECTED ON:","options":[{"key":"A","text":"THE APU COMPUTER AUTOMATICALLY COMPLETES A SELF-TEST, OPENS THE AIR INTAKE FLAP AND SUPPLIES FUEL PRESSURE."},{"key":"B","text":"THE APU COMPUTER AUTOMATICALLY STARTS THE APU."},{"key":"C","text":"CONNECTS THE APU GENERATOR TO THE AIRCRAFT ELECTRICAL SYSTEM."},{"key":"D","text":"THE APU DOOR OPENS."}],"answer":"A","confidence":"h","explanation":"MASTER SW ON: autotest, abre la air intake flap y da presión de combustible.","fcomRef":"DSC-49"},{"id":"apu-44","n":44,"q":"WHEN THE APU MASTER SWITCH IS RELEASED, A NORMAL APU SHUTDOWN OCCURS:","options":[{"key":"A","text":"WITHOUT DELAY IN ALL CASES."},{"key":"B","text":"WITHOUT A DELAY, IN ALL CASES."},{"key":"C","text":"WITH A DELAY IF THE BLEED AIR WAS IN USE."}],"answer":"C","confidence":"h","explanation":"Apagado con retardo (enfriamiento) si se usaba bleed.","fcomRef":"DSC-49"},{"id":"apu-45","n":45,"q":"WHEN THE A/THR SYSTEM IS IN USE:","options":[{"key":"A","text":"THE THROTTLES MOVE AUTOMATICALLY ACCORDING TO FADEC COMMANDS."},{"key":"B","text":"THE THROTTLES CAN ONLY BE MOVED MANUALLY."},{"key":"C","text":"THE THROTTLES WILL MOVE WHEN THE A/THR P/B IS USED."}],"answer":"B","confidence":"h","explanation":"En el A320 las palancas no se mueven con A/THR.","fcomRef":"DSC-22_40"},{"id":"apu-46","n":46,"q":"WHICH IGNITION SYSTEMS ARE USED DURING A MANUAL START?","options":[{"key":"A","text":"A."},{"key":"B","text":"B."},{"key":"C","text":"BOTH A AND B."}],"answer":"C","confidence":"h","explanation":"Arranque manual: ambas igniciones A y B.","fcomRef":"DSC-70"},{"id":"apu-47","n":47,"q":"WITH BATTERY POWER, WHAT WOULD AN APU FIRE TEST LOOK LIKE?","options":[{"key":"A","text":"APU FIRE PUSHBUTTON ILLUMINATED."},{"key":"B","text":"SQUIB AND DISCH LIGHTS ILLUMINATED"},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Con baterías: pb APU FIRE iluminado y luces SQUIB/DISC.","fcomRef":"DSC-26"},{"id":"apu-48","n":48,"q":"WITH BATTERY POWER, WHAT WOULD AN APU FIRE TEST LOOK LIKE?","options":[{"key":"A","text":"APU FIRE PUSHBUTTON ILLUMINATED."},{"key":"B","text":"SQUIB AND DISCH LIGHTS ILLUMINATED."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Con baterías: pb APU FIRE iluminado y luces SQUIB/DISC.","fcomRef":"DSC-26"},{"id":"apu-49","n":49,"q":"WITH NOBODY IN THE COCKPIT, IF YOU HAVE AN APU FIRE, WHICH STATEMENT IS CORRECT?","options":[{"key":"A","text":"ON THE GROUND, AN APU EMER SHUT DOWN WILL OCCUR AND THE APU FIRE BOTTLE WILL BE DISCHARGED AUTOMATICALLY."},{"key":"B","text":"ON THE GROUND, YOU HAVE TO PERFORM THE ECAM ACTIONS TO SHUT DOWN THE APU AND EXTINGUISH THE FIRE FROM THE COCKPIT."},{"key":"C","text":"ON THE GROUND AN APU AUTO SHUT DOWN WILL OCCUR BUT YOU HAVE TO DISCHARGE THE APU FIRE BOTTLE MANUALLY."},{"key":"D","text":"IN THE AIR, AN APU EMER SHUT DOWN WILL OCCUR AND THE APU FIRE BOTTLE WILL BE DISCHARGED AUTOMATICALLY."}],"answer":"A","confidence":"h","explanation":"En tierra: apagado de emergencia y descarga automática.","fcomRef":"DSC-26"},{"id":"apu-50","n":50,"q":"WITH NOBODY IN THE COCKPIT, IF YOU HAVE AN APU FIRE, WHICH STATEMENT IS CORRECT?","options":[{"key":"A","text":"ON THE GROUND, AN APU EMER SHUT DOWN WILL OCCUR AND THE APU FIRE BOTTLE WILL BE DISCHARGED AUTOMATICALLY."},{"key":"B","text":"ON THE GROUND, YOU HAVE TO PERFORM THE ECAM ACTIONS TO SHUT DOWN THE APU AND EXTINGUISH THE FIRE FROM THE COCKPIT."},{"key":"C","text":"ON THE GROUND AN APU AUTO SHUT DOWN WILL OCCUR BUT YOU HAVE TO DISCHARGE THE APU FIRE BOTTLE MANUALLY."},{"key":"D","text":"IN THE AIR, AN APU EMER SHUT DOWN WILL OCCUR AND THE APU FIRE BOTTLE WILL BE DISCHARGED AUTOMATICALLY."}],"answer":"A","confidence":"h","explanation":"En tierra: apagado de emergencia y descarga automática.","fcomRef":"DSC-26"},{"id":"apu-51","n":51,"q":"WITH THE ENGINES OFF, IF THE AVAIL LIGHT IS ILLUMINATED ON BOTH THE APU START PUSH BUTTON AND THE EXT PWR PUSH BUTTON, WHAT IS THE SOURCE OF ELECTRICAL POWER FOR THE AIRCRAFT BUSSES?","options":[{"key":"A","text":"IT IS NOT POSSIBLE TO DETERMINE WITHOUT CHECKING THE ECAM."},{"key":"B","text":"THE AIRCRAFT BATTERIES."},{"key":"C","text":"THE APU."},{"key":"D","text":"EXTERNAL POWER."}],"answer":"C","confidence":"h","explanation":"Si EXT PWR muestra sólo AVAIL (no ON), alimenta el APU.","fcomRef":"DSC-24"},{"id":"apu-52","n":52,"q":"YOU SWITCH OFF THE APU BUT CURIOUSLY YOU STILL HAVE THE APU AVAIL INDICATIONS.","options":[{"key":"A","text":"THERE IS A FAULT WITH THE APU MASTER SWITCH."},{"key":"B","text":"THE APU WILL RUN FOR A COOLING PERIOD OF 60 TO 120 SECONDS BECAUSE YOU HAVE BEEN USING THE APU BLEED."},{"key":"C","text":"YOU HAVE TO PUSH THE START SW TO INITIATE THE SHUT DOWN SEQUENCE."}],"answer":"B","confidence":"h","explanation":"Cooling: el APU sigue 60–120 s si se usó bleed.","fcomRef":"DSC-49"}]},{"id":"fctl","name":"FLIGHT CONTROL","nameEs":"Controles de vuelo","questions":[{"id":"fctl-1","n":1,"q":"AILERON DROOP MAY BEST BE CONFIRMED BY CHECKING WHICH OF THE FOLLOWING?","options":[{"key":"A","text":"THE POSITION OF THE AILERONS ON THE EXTERIOR PREFLIGHT INSPECTION."},{"key":"B","text":"THE LOWER ECAM FLT/CTL PAGE."},{"key":"C","text":"THE POSITION OF THE FLAP HANDLE."}],"answer":"B","confidence":"h","explanation":"El droop de alerones se confirma en la página F/CTL del ECAM.","fcomRef":"DSC-27"},{"id":"fctl-2","n":2,"q":"ARE THERE ANY CONTROL SURFACES WITH A MECHANICAL BACKUP?","options":[{"key":"A","text":"YES, THE AIRLERONS."},{"key":"B","text":"YES, THE SPOILERS."},{"key":"C","text":"YES, THE THS AND THE RUDDER."},{"key":"D","text":"NO, THERE ARE NO CONTROL SURFACES WITH MECHANICAL BACKUP."}],"answer":"C","confidence":"h","explanation":"Respaldo mecánico: THS y timón.","fcomRef":"DSC-27"},{"id":"fctl-3","n":3,"q":"AUTOMATIC PITCH TRIM IS INHIBITED WHEN:","options":[{"key":"A","text":"RADIO ALTITUDE IS BELOW 50 FEET (100 FEET WITH AUTOPILOT COUPLED)."},{"key":"B","text":"BANK ANGLE IS GREATER THAN 33 DEGREES."},{"key":"C","text":"LOAD FACTOR IS LESS THAN 1G."},{"key":"D","text":"BOTH A AND B."}],"answer":"D","confidence":"h","explanation":"Trim automático inhibido: RA < 50 ft (100 ft con AP) y bank > 33°, entre otros.","fcomRef":"DSC-27"},{"id":"fctl-4","n":4,"q":"CAN THE CREW MAKES A FLIGHT CONTROL INPUT THAT WILL OVER-STRESS THE AIRPLANE IN DIRECT LAW?","options":[{"key":"A","text":"NO. THE SYSTEM IS DESIGNED TO AVOID SUCH AN ATTEMPT."},{"key":"B","text":"YES, THERE ARE NO PROTECTIONS PROVIDED IN DIRECT LAW."}],"answer":"B","confidence":"h","explanation":"Sí: en direct law no hay protecciones.","fcomRef":"DSC-27"},{"id":"fctl-5","n":5,"q":"CAN THE RUDDERS BE MOVED WITH BOTH FAC'S INOPERATIVE?","options":[{"key":"A","text":"YES, IF BOTH FACS FAIL, MAXIMUM RUDDER DEFLECTION CAN BE OBTAINED WHEN THE SLATS ARE EXTENDED."},{"key":"B","text":"YES, IF BOTH FACS FAIL, MAXIMUM RUDDER DEFLECTION CAN BE OBTAINED."},{"key":"C","text":"YES, IF BOTH FACS FAIL, MAXIMUM RUDDER DEFLECTION CAN BE OBTAINED WHEN THE GEAR IS EXTENDED OR FLAPS EXTENDED AT 1 MINUMUM."},{"key":"D","text":"NO."}],"answer":"A","confidence":"h","explanation":"Con ambos FAC fallados el limitador se congela; deflexión máxima disponible con slats extendidos.","fcomRef":"DSC-27"},{"id":"fctl-6","n":6,"q":"CAN YOU MANUALLY TRIM THE RUDDER WITH THE AUTOPILOT ENGAGED?","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."}],"answer":"B","confidence":"h","explanation":"No: con AP enganchado el trim manual de timón está inhibido.","fcomRef":"DSC-27"},{"id":"fctl-7","n":7,"q":"FAC GENERATED SLAT AND FLAP EXTENSION, RETRACTION, AND LIMITING SPEEDS ARE VISUALLY DISPLAYED ON WHICH OF THE FOLLOWING?","options":[{"key":"A","text":"THE MCDU PERF PAGE."},{"key":"B","text":"THE LOWER ECAM F/CTL PAGE."},{"key":"C","text":"BOTH PILOT'S PFD AIRSPEED DISPLAYS."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"C","confidence":"h","explanation":"Las velocidades del FAC se muestran en la escala de velocidad de ambos PFD.","fcomRef":"DSC-27"},{"id":"fctl-8","n":8,"q":"FAILURE TO RETRACT THE FLAPS AFTER TAKEOFF WILL:","options":[{"key":"A","text":"ACTIVATE THE WING TIP BRAKES."},{"key":"B","text":"RESULT IN AUTOMATIC FLAP AND SLAT RETRACTION AT 210 KTS."},{"key":"C","text":"RESULT IN AUTOMATIC FLAP AND SLAT RETRACTION AT 220 KTS."},{"key":"D","text":"RESULT IN AUTOMATIC FLAP RETRACTION AT 210 KTS."}],"answer":"D","confidence":"h","explanation":"Auto retract: 1+F → 1 (flaps se retraen) a 210 kt.","fcomRef":"DSC-27"},{"id":"fctl-9","n":9,"q":"FOUR HYDRAULICALLY OPERATED WING TIP BRAKES ARE INSTALLED TO LOCK THE FLAPS OR SLATS IN CASE OF:","options":[{"key":"A","text":"ASYMMETRY AND OVERSPEED."},{"key":"B","text":"SYMMETRICAL RUNAWAY."},{"key":"C","text":"UNCOMMANDED MOVEMENT OF THE SURFACES."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"D","confidence":"h","explanation":"WTB: asimetría, overspeed, runaway simétrico y movimiento no comandado.","fcomRef":"DSC-27"},{"id":"fctl-10","n":10,"q":"HORIZONTAL STABILIZER TRIM AUTOMATICALLY RESETS TO ZERO DEGREES AFTER LANDING.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: el THS vuelve a 0° tras el aterrizaje.","fcomRef":"DSC-27"},{"id":"fctl-11","n":11,"q":"HOW MANY ACTUATORS ARE PROVIDED TO CONTROL THE AILERONS AND HOW MANY HYDRAULIC SOURCES SUPPLY THESE ACTUATORS?","options":[{"key":"A","text":"2 HYDRAULIC SOURCES WITH 4 ACTUATORS."},{"key":"B","text":"1 HYDRAULIC SOURCE WITH 2 ACTUATORS."},{"key":"C","text":"4 HYDRAULIC SOURCES WITH 4 ACTUATORS."},{"key":"D","text":"3 HYDRAULIC SOURCES WITH 4 ACTUATORS."}],"answer":"A","confidence":"h","explanation":"Alerones: 4 actuadores, 2 fuentes hidráulicas (verde y azul).","fcomRef":"DSC-27"},{"id":"fctl-12","n":12,"q":"IF ANGLE OF ATTACK PROTECTION IS ACTIVE OR FLAPS ARE IN THE CONFIGURATION FULL:","options":[{"key":"A","text":"SPEED BRAKE EXTENSION IS INHIBITED."},{"key":"B","text":"AILERON TRAVEL IS REDUCED."},{"key":"C","text":"SPEED BRAKE EXTENSION TRAVEL IS REDUCED."}],"answer":"A","confidence":"h","explanation":"Con protección AOA o CONF FULL la extensión de speedbrakes se inhibe.","fcomRef":"DSC-27"},{"id":"fctl-13","n":13,"q":"IF BOTH FAC'S FAIL, WHAT HAPPENS TO THE RUDDER LIMITER?","options":[{"key":"A","text":"IT IMMEDIATELY ASSUMES THE LOW SPEED POSITION."},{"key":"B","text":"IT FREEZES AT ITS PRESENT POSITION AND ASSUMES THE LOW SPEED POSITION WHEN FLAPS 1 ARE SELECTED."},{"key":"C","text":"MAXIMUM RUDDER DEFLECTION CAN BE OBTAINED AFTER SLATS EXTENDED."},{"key":"D","text":"MAXIMUM RUDDER DEFLECTION CAN BE OBTAINED AFTER FLAPS EXTENDED."}],"answer":"C","confidence":"h","explanation":"Ambos FAC fuera: deflexión máxima de timón disponible tras extender slats.","fcomRef":"DSC-27"},{"id":"fctl-14","n":14,"q":"IF ELECTRICAL POWER TO A SEC FAILS:","options":[{"key":"A","text":"THE AFFECTED SPOILERS AUTOMATICALLY RETRACTS."},{"key":"B","text":"ALL SPOILERS AUTOMATICALLY RETRACT."},{"key":"C","text":"THE AFFECTED SPOILERS REMAINS IN THE LAST COMMANDED POSITION."}],"answer":"A","confidence":"h","explanation":"Sin energía al SEC, los spoilers afectados se retraen.","fcomRef":"DSC-27"},{"id":"fctl-15","n":15,"q":"IN NORMAL LAW, IF ONE STICK IS RAPIDLY PULLED FULL BACK, CAN THE AIRCRAFT'S MAXIMUM ALLOWABLE G LOAD BE EXCEEDED?","options":[{"key":"A","text":"YES. RAPID SIDE STICK DEFLECTION MUST NEVER BE MADE."},{"key":"B","text":"YES, UNTIL MAXIMUM PITCH ATTITUDE IS REACHED ."},{"key":"C","text":"NO. AT MAXIMUM G LOAD, THE SIDE STICKS ARE DE-ACTIVATED FOR 5 SECONDS."},{"key":"D","text":"NO. THE LOAD FACTOR LIMITATION OVERRIDES SIDE STICK COMMANDS TO AVOID EXCESSIVE G LOADS."}],"answer":"D","confidence":"h","explanation":"No: la protección de factor de carga prevalece sobre el sidestick.","fcomRef":"DSC-27"},{"id":"fctl-16","n":16,"q":"IN NORMAL LAW, WHAT ARE THE LIMITS OF PITCH ATTITUDE PROTECTIONS WITH FLAPS FULL","options":[{"key":"A","text":"30° NOSE UP."},{"key":"B","text":"35° NOSE UP PROGRESSIVELY REDUCED TO 20°."},{"key":"C","text":"25° NOSE UP, PROGRESSIVELY REDUCED TO 20° AT LOW SPEED."},{"key":"D","text":"THERE IS NO LIMIT."}],"answer":"C","confidence":"h","explanation":"CONF FULL: 25° nariz arriba, reducido a 20° a baja velocidad.","fcomRef":"DSC-27"},{"id":"fctl-17","n":17,"q":"IN NORMAL LAW, WHAT IS THE MAXIMUM BANK ANGLE YOU CAN REACH WITH THE SIDE STICK FULLY DEFLECTED?","options":[{"key":"A","text":"33°."},{"key":"B","text":"49°."},{"key":"C","text":"67°."},{"key":"D","text":"70°."}],"answer":"C","confidence":"h","explanation":"Con sidestick a fondo: 67° de bank.","fcomRef":"DSC-27"},{"id":"fctl-18","n":18,"q":"IN PICH NORMAL LAW FLIGHT MODE, PITCH TRIM IS:","options":[{"key":"A","text":"MANUAL WITHOUT THE AUTOPILOT ENGAGED."},{"key":"B","text":"AUTOMATIC AS LONG AS THE AUTOPILOT IS ENGAGED."},{"key":"C","text":"AUTOMATIC WITH OR WITHOUT THE AUTOPILOT ENGAGED."}],"answer":"C","confidence":"h","explanation":"En normal law el trim es automático con o sin AP.","fcomRef":"DSC-27"},{"id":"fctl-19","n":19,"q":"IN PICH NORMAL LAW, THE ELEVATOR CONTROL CHANGES FROM THE NORMAL MODE TO A PROTECTION MODE WHEN THE ANGLE OF ATTACK IS GREATER THAN:","options":[{"key":"A","text":"ALPHA MAX."},{"key":"B","text":"ALPHA PROT."},{"key":"C","text":"ALPHA FLOOR."}],"answer":"B","confidence":"h","explanation":"Protección a partir de alpha prot.","fcomRef":"DSC-27"},{"id":"fctl-20","n":20,"q":"IN THE EVENT OF A COMPLETE LOSS OF ELECTRICAL FLIGHT CONTROL SIGNALS, THE AIRPLANE REVERTS TO A _________ MODE.","options":[{"key":"A","text":"MECHANICAL."},{"key":"B","text":"ALTERNATE LAW."},{"key":"C","text":"ABNORMAL ATTITUDE LAW."}],"answer":"A","confidence":"h","explanation":"Pérdida total de señales eléctricas: modo mecánico (backup).","fcomRef":"DSC-27"},{"id":"fctl-21","n":21,"q":"IS THERE ANY RUDDER PEDAL FEEDBACK FOR THE YAW DAMPING AND TURN COORDINATION FUNCTIONS?","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."}],"answer":"B","confidence":"h","explanation":"No: yaw damper y turn coordination no mueven los pedales.","fcomRef":"DSC-27"},{"id":"fctl-22","n":22,"q":"LET'S ASSUME THE F/O PRESSES HIS TAKEOVER PUSHBUTTON AND RELEASES IT AFTER MORE THAN 40 SECONDS.","options":[{"key":"A","text":"THE CAPTAIN'S SIDE STICK IS DE-ACTIVATED UNLESS HE PRESSES HIS TAKEOVER PUSHBUTTON."},{"key":"B","text":"THE CAPTAIN IS UNABLE TO RE-ACTIVATED HIS SIDE-STICK FOR THE REST OF THE FLIGHT."},{"key":"C","text":"BOTH STICKS ARE ACTIVE."},{"key":"D","text":"THE CAPTAIN'S SIDE STICK IS ACTIVE AS LONG AS THE F/O' SIDE STICK IS IN NEUTRAL POSITION."}],"answer":"A","confidence":"h","explanation":"> 40 s: prioridad enclavada; el sidestick del CPT queda desactivado hasta que presione su takeover.","fcomRef":"DSC-27"},{"id":"fctl-23","n":23,"q":"MECHANICALLY BACKUP CONTROL SURFACES:","options":[{"key":"A","text":"ARE MECHANICALLY CONNECTED TO THE COCKPIT CONTROLS AND DO NOT REQUIRE HYDRAULIC POWER."},{"key":"B","text":"REQUIRE HYDRAULIC POWER FOR ACTUATION."},{"key":"C","text":"NONE OF THE ABOVE."}],"answer":"B","confidence":"h","explanation":"El respaldo mecánico sigue requiriendo potencia hidráulica.","fcomRef":"DSC-27"},{"id":"fctl-24","n":24,"q":"ROLL CONTROL IN NORMAL LAW IS ACHIEVED WITH:","options":[{"key":"A","text":"AILERONS AND SPOILERS."},{"key":"B","text":"AILERONS, SPOILERS, AND RUDDER."},{"key":"C","text":"AILERONS, SPOILERS 2-5, AND RUDDER."}],"answer":"C","confidence":"h","explanation":"Roll normal law: alerones, spoilers 2–5 y timón.","fcomRef":"DSC-27"},{"id":"fctl-25","n":25,"q":"ROLL CONTROL IS ACHIEVED BY:","options":[{"key":"A","text":"AILERONS."},{"key":"B","text":"AILERONS AND RUDDER."},{"key":"C","text":"ONE AILERON AND FOUR SPOILERS ON EACH WING."}],"answer":"C","confidence":"h","explanation":"Un alerón y cuatro spoilers por ala.","fcomRef":"DSC-27"},{"id":"fctl-26","n":26,"q":"SELECTION OF FLAPS 1 IN FLIGHT WILL SELECT WHICH OF THE FOLLOWING CONFIGURATIONS?","options":[{"key":"A","text":"SLATS 1 AND FLAPS 1 (1+F)."},{"key":"B","text":"SLATS 0 AND FLAPS 1 (0+F)."},{"key":"C","text":"SLATS 1 AND FLAPS 0 (1)."},{"key":"D","text":"SLATS 1 AND FLAPS 5 (1+F)."}],"answer":"C","confidence":"h","explanation":"En vuelo, palanca 1 = CONF 1 (sólo slats).","fcomRef":"DSC-27"},{"id":"fctl-27","n":27,"q":"SELECTION OF FLAPS 1 IN FLIGHT WILL SELECT WHICH OF THE FOLLOWING CONFIGURATIONS?","options":[{"key":"A","text":"SLATS 1 AND FLAPS 1 (1+F)."},{"key":"B","text":"SLATS 0 AND FLAPS 1 (0+F)."},{"key":"C","text":"SLATS 1 AND FLAPS 0 (1)."},{"key":"D","text":"SLATS 1 AND FLAPS 5 (1+F)."}],"answer":"C","confidence":"h","explanation":"En vuelo, palanca 1 = CONF 1 (sólo slats).","fcomRef":"DSC-27"},{"id":"fctl-28","n":28,"q":"SELECTION OF FLAPS ONE PRIOR TO TAKEOFF WILL SELECT WHICH OF THE FOLLOWING?","options":[{"key":"A","text":"SLATS 1 AND FLAPS 1 (1+F)."},{"key":"B","text":"SLATS 0 AND FLAPS 1 (0+F)."},{"key":"C","text":"SLATS 1 AND FLAPS 0 (1)."},{"key":"D","text":"SLATS 1 AND FLAPS 5 (1)."}],"answer":"A","confidence":"h","explanation":"Antes del despegue, palanca 1 = CONF 1+F.","fcomRef":"DSC-27"},{"id":"fctl-29","n":29,"q":"SHOULD THE ACTIVE ELEVATOR ACTUATOR FAIL, ELEVATOR CONTROL IS:","options":[{"key":"A","text":"LOST."},{"key":"B","text":"MAINTAINED BY THE OTHER ACTUATOR."},{"key":"C","text":"REDUCED."}],"answer":"B","confidence":"h","explanation":"Falla del actuador activo: el otro toma el control.","fcomRef":"DSC-27"},{"id":"fctl-30","n":30,"q":"SIDESTICKS PROVIDE ELECTRICAL SIGNALS TO THE FLIGHT CONTROL COMPUTERS, IF BOTH SIDESTICKS ARE OPERATED:","options":[{"key":"A","text":"THE INPUTS CANCEL EACH OTHER."},{"key":"B","text":"BOTH INPUTS ARE ALGEBRAICALLY ADDED."},{"key":"C","text":"THE F/O INPUT IS OVERRIDDEN BY THE CAP INPUT."}],"answer":"B","confidence":"h","explanation":"Ambas entradas se suman algebraicamente.","fcomRef":"DSC-27"},{"id":"fctl-31","n":31,"q":"THE A-320 FLIGHT CONTROL SUFACES ARE _______ CONTROLLED AND _______ ACTUATED.","options":[{"key":"A","text":"ELECTRICALLY, HYDRAULICALLY."},{"key":"B","text":"MECHANICALLY, HYDRAULICALLY."},{"key":"C","text":"ELECTRICALLY, ELECTRICALLY."}],"answer":"A","confidence":"h","explanation":"Controladas eléctricamente, accionadas hidráulicamente.","fcomRef":"DSC-27"},{"id":"fctl-32","n":32,"q":"THE FAC'S PRIMARILY CONTROL WHICH CONTROL SURFACE?","options":[{"key":"A","text":"ELEVATOR."},{"key":"B","text":"RUDDER."},{"key":"C","text":"AILERON."},{"key":"D","text":"ELEVATOR AND AILERON."}],"answer":"B","confidence":"h","explanation":"Los FAC controlan principalmente el timón.","fcomRef":"DSC-27"},{"id":"fctl-33","n":33,"q":"THE FLAP LEVER SENDS SIGNAL TO SLAT FLAP CONTROL COMPUTER (SFCC) TO COMMAND MOVEMENT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: la palanca envía la señal a los SFCC.","fcomRef":"DSC-27"},{"id":"fctl-34","n":34,"q":"THE GROUND MODE IS DIFFERENT IN ALTERNATIVE LAW.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: el modo tierra es el mismo.","fcomRef":"DSC-27"},{"id":"fctl-35","n":35,"q":"THE MESSAGE WING TIP BRK ON APPEARS ON THE E/WD. WHAT DOES IT MEAN?","options":[{"key":"A","text":"A HYDRAULIC DEVICE LOCKS THE FLAPS IN THEIR PRESENT POSITION."},{"key":"B","text":"TO REDUCE STRUCTURAL STRESS, THE SLATS MOVEMENT IS BEING SLOWED DOWN THROUGH THE WING TIP BRAKES."},{"key":"C","text":"TO AVOID ASYMMETRY, THE OUTER STLATS ARE LOCKED IN THEIR PRESENT POSITION."},{"key":"D","text":"BECAUSE OF THE LOCKED FLAPS, THE WING TIP BRAKES ALSO LOCK THE SLATS."}],"answer":"A","confidence":"m","explanation":"WING TIP BRK ON: el freno hidráulico bloquea la superficie afectada (flaps) en su posición.","fcomRef":"DSC-27"},{"id":"fctl-36","n":36,"q":"THE SPOILER PANELS ARE THE ONLY FLIGHT CONTROL SURFACES WITH NO REDUNDANT CONTROL.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Verdadero: cada spoiler tiene un solo actuador, un hidráulico y una computadora.","fcomRef":"DSC-27"},{"id":"fctl-37","n":37,"q":"THE WING TIP BRAKES ARE:","options":[{"key":"A","text":"PNEUMATICALLY ACTUATED."},{"key":"B","text":"ELECTRIC BRAKES."},{"key":"C","text":"HYDRAULICALLY ACTUATED."},{"key":"D","text":"MECHANICALLY CONTROLLED, HYDRAULICALLY ACTUATED."}],"answer":"C","confidence":"h","explanation":"Los WTB son de accionamiento hidráulico.","fcomRef":"DSC-27"},{"id":"fctl-38","n":38,"q":"THE WING TIP BRAKES, ONCE ACTIVATED:","options":[{"key":"A","text":"LOCK BOTH THE SLATS AND FLAPS IN THEIR CURRENT POSITION."},{"key":"B","text":"LOCK ONLY THE FLAPS IN THEIR CURRENT POSITION."},{"key":"C","text":"LOCK ONLY THE SLATS IN THEIR CURRENT POSITION."},{"key":"D","text":"LOCK ONLY THE AFFECTED HIGH LIFT SYSTEM SURFACES WITH IN THEIR CURRENT POSITION."}],"answer":"D","confidence":"h","explanation":"Bloquean sólo las superficies del sistema afectado.","fcomRef":"DSC-27"},{"id":"fctl-39","n":39,"q":"TOGA THRUST IS PROVIDED REGARDLESS OF THROTTLE POSITION WHEN ________ ENGAGES THE A/THR SYSTEM.","options":[{"key":"A","text":"ALPHA MAX."},{"key":"B","text":"ALPHA PROT."},{"key":"C","text":"ALPHA FLOOR."}],"answer":"C","confidence":"h","explanation":"Alpha floor da TOGA sin importar la posición de las palancas.","fcomRef":"DSC-22_40"},{"id":"fctl-40","n":40,"q":"TO SELECT SPEED BRAKES INFLIGHT:","options":[{"key":"A","text":"PUSH DOWN ON THE SPEED BRAKE HANDLE AND MOVE IT FORWARD."},{"key":"B","text":"PUSH DOWN ON THE SPEED BRAKE HANDLE AND MOVE IT AFT."},{"key":"C","text":"PULL UP ON THE SPEED BRAKE HANDLE AND MOVE IT AFT."}],"answer":"B","confidence":"h","explanation":"Speedbrakes: presionar y mover hacia atrás.","fcomRef":"DSC-27"},{"id":"fctl-41","n":41,"q":"TURN COORDINATION IS AVAILABLE IN ALTERNATE LAW.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: en alternate law no hay turn coordination (sólo yaw damping).","fcomRef":"DSC-27"},{"id":"fctl-42","n":42,"q":"TWO CONTROL SURFACES THAT HAVE MECHANICAL BACKUP ARE:","options":[{"key":"A","text":"ELEVATOR AND RUDDER."},{"key":"B","text":"HORIZONTAL STABILIZER AND RUDDER."},{"key":"C","text":"SPEED BRAKES AND RUDDER."}],"answer":"B","confidence":"h","explanation":"Respaldo mecánico: THS y timón.","fcomRef":"DSC-27"},{"id":"fctl-43","n":43,"q":"WHAT ARE THE RUDDER TRIM RATES?","options":[{"key":"A","text":"A/P ON - 5 DEG/SEC, A/P OFF - 1 DEG/SEC."},{"key":"B","text":"A/P ON - 2 1/5 DEG/SEC, A/P OFF - 5 DEG/SEC."},{"key":"C","text":"A/P ON - 3 DEG/SEC, A/P OFF - 6 DEG/SEC."},{"key":"D","text":"A/P ON - 5 DEG/SEC, A/P OFF - 6 DEG/SEC."}],"answer":"A","confidence":"h","explanation":"Trim de timón: 5°/s con AP, 1°/s manual.","fcomRef":"DSC-27"},{"id":"fctl-44","n":44,"q":"WHAT COMPUTER NORMALLY COMMANDS THE OPERATION OF THE ELEVATORS AND HORIZONTAL STABILIZER?","options":[{"key":"A","text":"SEC 1."},{"key":"B","text":"FAC 1."},{"key":"C","text":"ELAC 2."}],"answer":"C","confidence":"h","explanation":"Normalmente ELAC2 comanda elevadores y THS.","fcomRef":"DSC-27"},{"id":"fctl-45","n":45,"q":"WHAT CONDITION WILL CAUSE AUTO FLAP RETRACTION?","options":[{"key":"A","text":"EXCEED 210 KTS AT FLAPS 1."},{"key":"B","text":"EXCEED 190 KT AT FLAPS 1."},{"key":"C","text":"EXCEED 195 KT AT FLAPS 1."},{"key":"D","text":"EXCEED 190 KT WITH FLAPS 1 WHITE EXTENDING THE SPEEDBRAKE LEVER."}],"answer":"A","confidence":"h","explanation":"Auto retract si se supera 210 kt en CONF 1+F.","fcomRef":"DSC-27"},{"id":"fctl-46","n":46,"q":"WHAT CONTROL SURFACES DO THE FACS CONTROL?","options":[{"key":"A","text":"THE ELEVATORS."},{"key":"B","text":"THE SPOILERS."},{"key":"C","text":"THE RUDDER."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"C","confidence":"h","explanation":"Los FAC controlan el timón.","fcomRef":"DSC-27"},{"id":"fctl-47","n":47,"q":"WHAT HAPPENS IF YOU RELEASE THE STICK AT 40 DEGREES OF BANK?","options":[{"key":"A","text":"THE BANK STAYS AT 40°."},{"key":"B","text":"THE AIRCRAFT ROLLS BACK TO 25°."},{"key":"C","text":"THE AIRCRAFT ROLLS BACK TO 33° AND RESUMES FLIGHT PATH STABILITY."},{"key":"D","text":"THE AIRCRAFT ROLLS BACK TO A BANK ANGLE LESS THAN 29°."}],"answer":"C","confidence":"h","explanation":"Al soltar: vuelve a 33° y mantiene la trayectoria.","fcomRef":"DSC-27"},{"id":"fctl-48","n":48,"q":"WHAT HAPPENS IN THE EVENT OF AN SINGLE ELAC FAILURE?","options":[{"key":"A","text":"ELAC FUNCTIONS ARE TRANSFERRED THE SEC'S."},{"key":"B","text":"ELAC FUNCTIONS ARE TRANSFERRED THE FAC'S."},{"key":"C","text":"SEC FUNCTIONS ARE TRANSFERRED THE ELAC'S."},{"key":"D","text":"THE FUNCTIONS OF THE FAILED ELAC WILL BE ASSUMED BY THE REMAINING ELAC."}],"answer":"D","confidence":"h","explanation":"El ELAC restante asume las funciones.","fcomRef":"DSC-27"},{"id":"fctl-49","n":49,"q":"WHAT HAPPENS TO HIGH SPEED (VMO/MMO) WHEN YOU ARE IN ALTERNATE LAW?","options":[{"key":"A","text":"VMO IS REDUCED TO 320 KT AND MMO MINUS 10 KT."},{"key":"B","text":"VMO IS REDUCED TO 330 KT AND MMO MINUS 10 KT."},{"key":"C","text":"VMO IS REDUCED TO 320 KT AND MMO DOES NOT CHANGE."},{"key":"D","text":"THERE IS NO CHANGE."}],"answer":"A","confidence":"h","explanation":"Alternate: VMO 320 kt, MMO 0,77.","fcomRef":"DSC-27"},{"id":"fctl-50","n":50,"q":"WHAT HAPPENS TO THE RUDDER LIMITS IF BOTH FAC'S FAULT?","options":[{"key":"A","text":"THE LIMIT FREEZES AT THE FAULT CONDITION UNTIL FLAPS 1 IS SELECTED."},{"key":"B","text":"THE LIMIT FREEZES AT THE FAULT CONDITION UNTIL FLAPS 5 IS SELECTED."},{"key":"C","text":"THE LIMIT FREEZES AT THE FAULT CONDITION UNTIL FLAPS 1 IS SELECTED. THEN RESETS TO THE LOW SPEED LIMITS FOR INCREASED CONTROL."}],"answer":"C","confidence":"m","explanation":"Se congela y vuelve al límite de baja velocidad al extender slats (FLAPS 1).","fcomRef":"DSC-27"},{"id":"fctl-51","n":51,"q":"WHEN DO YOU GET FLARE MODE IN ALTERNATE LAW?","options":[{"key":"A","text":"NEVER. IT GOES DIRECTLY FROM ALTERNATE LAW TO DIRECT LAW WHEN THE GEAR IS SELECTED DOWN."},{"key":"B","text":"WHEN SELECTING FLAPS 1."},{"key":"C","text":"AT GLIDE SLOPE INTERCEPTION."}],"answer":"A","confidence":"h","explanation":"Nunca: con tren abajo pasa a direct law.","fcomRef":"DSC-27"},{"id":"fctl-52","n":52,"q":"WHEN GROUND SPOILERS DEPLOY AUTOMATICALLY:","options":[{"key":"A","text":"ALL TEN-SPOILER PANELS FULLY DEPLOY."},{"key":"B","text":"FOUR SPOILER PANELS ON EACH WING DEPLOY."},{"key":"C","text":"ALL TEN-SPOILER PANELS DEPLOY HALF WAY."},{"key":"D","text":"SIX SPOILER PANELS ON EACH WING DEPLOY."}],"answer":"A","confidence":"h","explanation":"Ground spoilers: los 10 paneles se extienden por completo.","fcomRef":"DSC-27"},{"id":"fctl-53","n":53,"q":"WHEN IS ALPHA FLOOR NOT AVAILABLE?","options":[{"key":"A","text":"OUT OF NORMAL LAW."},{"key":"B","text":"BELOW 100 FEET RA IN LANDING CONFIGURATION."},{"key":"C","text":"IF THE A/THR IS DEACTIVATED OR UNAVAILABLE."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Alpha floor no disponible fuera de normal law, bajo 100 ft RA o sin A/THR.","fcomRef":"DSC-22_40"},{"id":"fctl-54","n":54,"q":"WHEN IS THE FLIGHT MODE ACTIVE?","options":[{"key":"A","text":"FROM TAKEOFF UNTIL LANDING."},{"key":"B","text":"FROM LITOFF UNTIL LANDING."},{"key":"C","text":"FROM LITOFF UNTIL FLARE MODE ENGAGES AT 50 FT RA."},{"key":"D","text":"FROM TAKEOFF UNTIL PASSING 50 KTS ON LANDING (MAIN SHOCK ABSORBERS DEPRESSED)."}],"answer":"B","confidence":"h","explanation":"Flight mode: desde el despegue hasta el aterrizaje.","fcomRef":"DSC-27"},{"id":"fctl-55","n":55,"q":"WHEN THE FLAPS ARE EXTENDED, THE AILERONS:","options":[{"key":"A","text":"GO TO THE CENTERING MODE."},{"key":"B","text":"PICH UP 5 DEGREES."},{"key":"C","text":"DROOP 5 DEGREES."}],"answer":"C","confidence":"h","explanation":"Droop de alerones de 5° con flaps extendidos.","fcomRef":"DSC-27"},{"id":"fctl-56","n":56,"q":"WHEN THE LANDING GEAR IS EXTENDED, PITCH ALTERNATE LAW:","options":[{"key":"A","text":"REMAINS THE SAME."},{"key":"B","text":"DEGRADES TO PITCH DIRECT LAW."},{"key":"C","text":"DEGRADES TO PITCH BACKUP LAW."}],"answer":"B","confidence":"h","explanation":"Con tren abajo pasa a pitch direct law.","fcomRef":"DSC-27"},{"id":"fctl-57","n":57,"q":"WHEN THE LANDING GEAR IS EXTENDED, PITCH ALTERNATE LAW:","options":[{"key":"A","text":"REMAINS THE SAME."},{"key":"B","text":"DEGRADES TO PITCH DIRECT LAW."},{"key":"C","text":"DEGRADES TO PITCH BACKUP LAW."}],"answer":"B","confidence":"h","explanation":"Con tren abajo pasa a pitch direct law.","fcomRef":"DSC-27"},{"id":"fctl-58","n":58,"q":"WHERE DO THE SFCCS OBTAIN AOA AND AIR DATA INFORMATION FROM?","options":[{"key":"A","text":"SEC."},{"key":"B","text":"ELAC."},{"key":"C","text":"ADIRU."},{"key":"D","text":"ADC."}],"answer":"C","confidence":"h","explanation":"Los SFCC reciben datos de las ADIRU.","fcomRef":"DSC-27"},{"id":"fctl-59","n":59,"q":"WHICH OF THE FOLLOWING CONTROLS AND MONITORS FLAPS AND SLATS?","options":[{"key":"A","text":"TWO ELAC'S."},{"key":"B","text":"WING TIP BRAKES."},{"key":"C","text":"ONE SLAT FLAP CONTROL COMPUTER (SFCC)."},{"key":"D","text":"TWO SLAT FLAP CONTROL COMPUTER (SFCC'S)."}],"answer":"D","confidence":"h","explanation":"Dos SFCC.","fcomRef":"DSC-27"},{"id":"fctl-60","n":60,"q":"WHICH OF THE FOLLOWING STATEMENTS ARE CORRECT CONCERNING THE SIDE STICK TAKEOVER PUSH BUTTON?","options":[{"key":"A","text":"THE LAST PILOT TO DEPRESS THE PUSH BUTTON HAS PRIORITY."},{"key":"B","text":"IF THE TAKEOVER PUSH BUTTON IS DEPRESSED FOR MORE THAN 40 SECONDS, THE ONSIDE SYSTEM WILL RETAIN PRIORITY AFTER THE PUSH BUTTON IS RELEASED."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Ambas: el último en presionar tiene prioridad; > 40 s queda enclavada.","fcomRef":"DSC-27"},{"id":"fctl-61","n":61,"q":"WHICH OF THE FOLLOWING STATEMENTS ARE CORRECT CONCERNING THE SIDE STICK TAKEOVER PUSH BUTTON?","options":[{"key":"A","text":"IF THE TAKEOVER PUSH BUTTON IS DEPRESSED FOR MORE THAN 40 SECONDS, THE ONSIDE SYSTEM WILL RETAIN PRIORITY AFTER THE PUSH BUTTON IS RELEASED."},{"key":"B","text":"THE LAST PILOT TO DEPRESS THE PUSH BUTTON HAS PRIORITY."},{"key":"C","text":"BOTH A AND B."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"C","confidence":"h","explanation":"Ambas son correctas.","fcomRef":"DSC-27"},{"id":"fctl-62","n":62,"q":"WHICH OF THE FOLLOWING STATEMENTS IS CORRECT CONCERNING THE ELEVATOR AILERON COMPUTERS (ELAC'S)?","options":[{"key":"A","text":"THREE COMPUTERS WHICH ACHIEVE NORMAL ELEVATOR, STABILIZER, AND AILERON CONTROL."},{"key":"B","text":"TWO COMPUTERS WHICH ACHIEVE NORMAL ELEVATOR AND AILERON CONTROL."},{"key":"C","text":"TWO COMPUTERS WHICH ACHIEVE NORMAL AND STANDBY CONTROL OF THE ELEVATORS, AILERONS, ANDS THS."}],"answer":"C","confidence":"h","explanation":"Dos ELAC: control normal y standby de elevadores, alerones y THS.","fcomRef":"DSC-27"},{"id":"fctl-63","n":63,"q":"WHICH OF THE FOLLOWING STATEMENTS IS CORRECT CONCERNING THE SPOILER ELEVATOR COMPUTERS (SEC'S)?","options":[{"key":"A","text":"TWO COMPUTERS WHICH ACHIEVE SPOILER CONTROL AND STANDBY ELEVATOR AND THS CONTROL."},{"key":"B","text":"THREE COMPUTERS WHICH ACHIEVE SPOILER CONTROL AND NORMAL ELEVATOR AND THS CONTROL."},{"key":"C","text":"THREE COMPUTERS WHICH ACHIEVE SPOILER CONTROL AND STANDBY ELEVATOR AND THS CONTROL."}],"answer":"C","confidence":"h","explanation":"Tres SEC: spoilers y control standby de elevadores y THS.","fcomRef":"DSC-27"},{"id":"fctl-64","n":64,"q":"WHICH OF THE FOLLOWING WILL AUTOMATICALLY RESET AFTER LANDING?","options":[{"key":"A","text":"THS."},{"key":"B","text":"RUDDER TRIM."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"A","confidence":"h","explanation":"El THS se resetea tras el aterrizaje.","fcomRef":"DSC-27"},{"id":"fctl-65","n":65,"q":"WHILE ON THE GROUND IN ROLL NORMAL LAW THERE IS A DIRECT RELATIONSHIP BETWEEN SIDESTICK DEFLECTION AND THE CORRESPONDING AILERON AND SPOILER DEFLECTION.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: en tierra hay relación directa.","fcomRef":"DSC-27"},{"id":"fctl-66","n":66,"q":"WICH CONTROLS ARE USED FOR THE MECHANICAL BACKUP?","options":[{"key":"A","text":"AILERONS AND RUDDER."},{"key":"B","text":"THS AND RUDDER."},{"key":"C","text":"ELEVATORS AND AIRLERONS."},{"key":"D","text":"THS AND ELEVATOR."}],"answer":"B","confidence":"h","explanation":"THS y timón.","fcomRef":"DSC-27"},{"id":"fctl-67","n":67,"q":"WITH THE AIRCRAFT IN PITCH ALTERNATE LAW, ROLL IS IN _______ LAW.","options":[{"key":"A","text":"DIRECT."},{"key":"B","text":"NORMAL."},{"key":"C","text":"ALTERNATE."}],"answer":"A","confidence":"h","explanation":"Con pitch alternate law, roll queda en direct law.","fcomRef":"DSC-27"}]},{"id":"ice","name":"ICE & RAIN PROTECTION","nameEs":"Protección hielo y lluvia","questions":[{"id":"ice-1","n":1,"q":"ANTI-ICE AND THE ICING PROTECTION IS PROVIDED FOR:","options":[{"key":"A","text":"THE ENGINE NACELLE\\'S AND THREE OUTBOARD WING SLATS."},{"key":"B","text":"THE ENGINE NACELLE\\'S THE HORIZONTAL STABILIZER, AND THREE OUTBOARD WING SLATS."},{"key":"C","text":"THE ENGINE NACELLE\\'S THE HORIZONTAL STABILIZER, THE VERTICAL STABILIZER AND THREE AOUTBOARD WING SLATS."}],"answer":"A","confidence":"h","explanation":"Anti-ice: nacelles de motores y tres slats exteriores de cada ala.","fcomRef":"DSC-30"},{"id":"ice-2","n":2,"q":"AT WHAT POWER LEVEL DOES WINDOW HEAT OPERATE WHILE AIRBORNE?","options":[{"key":"A","text":"HIGH POWER WHILE AIRBORNE."},{"key":"B","text":"SHIFTS FROM LOW TO HIGH AS WINDOW TEMPERATURE REQUIRES."},{"key":"C","text":"LOW POWER ABOVE 18,000 FT."},{"key":"D","text":"LOW POWER ABOVE 25,000 FT."}],"answer":"A","confidence":"h","explanation":"Window heat: baja potencia en tierra, alta en vuelo.","fcomRef":"DSC-30"},{"id":"ice-3","n":3,"q":"CAN THE WING ANTI-ICE BE TESTED ON THE GROUND?","options":[{"key":"A","text":"YES, WITH VALVES ONLY OPEN FOR 30 SECONDS."},{"key":"B","text":"YES, VALVES STAY OPEN TILL SELECTED OFF."},{"key":"C","text":"NO."}],"answer":"A","confidence":"h","explanation":"Sí, en tierra se abren sólo 30 s (test).","fcomRef":"DSC-30"},{"id":"ice-4","n":4,"q":"CAN THE WING ANTI-ICE IS TESTED ON THE GROUND?","options":[{"key":"A","text":"NO."},{"key":"B","text":"YES, VALVES ONLY OPEN FOR 30 SECONDS."},{"key":"C","text":"YES, VALVES STAY OPEN TILL SELECTED OFF."}],"answer":"B","confidence":"h","explanation":"Sí, en tierra se abren sólo 30 s (test).","fcomRef":"DSC-30"},{"id":"ice-5","n":5,"q":"IF ONE ENGINE ANTI-ICE SYSTEM FAILS, THE SECOND ONE TAKES OVER AND PROVIDES ANTI-ICING FOR BOTH ENGINES.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: cada motor tiene su propio sistema independiente.","fcomRef":"DSC-30"},{"id":"ice-6","n":6,"q":"INFLIGHT THE ____ ON EACH WING ARE ANTI-ICED WITH PNEUMATIC BLEED AIR.","options":[{"key":"A","text":"SLATS."},{"key":"B","text":"FLAPS."},{"key":"C","text":"THREE OUTBOARD SLATS."}],"answer":"C","confidence":"h","explanation":"En vuelo se protegen los tres slats exteriores de cada ala.","fcomRef":"DSC-30"},{"id":"ice-7","n":7,"q":"IN THE EVENT OF AN ELECTRICAL POWER LOSS:","options":[{"key":"A","text":"THE ENGINE ANTI-ICE VALVES WILL OPEN AUTOMATICALLY, ANTI-ICING IS ENSURED."},{"key":"B","text":"THE ENGINE ANTI-ICE VALVES WILL CLOSE AUTOMATICALLY, ANTI-ICING IS LOST."},{"key":"C","text":"THE ENGINE ANTI-ICE VALVES WILL BE CONTROLLED BY THE WING ANTI-ICE CONTROLS."},{"key":"D","text":"THE ENGINE ANTI-ICE VALVES REMAIN IN THE POSITION THEY WERE BEFORE."}],"answer":"A","confidence":"h","explanation":"Sin energía las válvulas de anti-ice de motor abren (fail open).","fcomRef":"DSC-30"},{"id":"ice-8","n":8,"q":"ON THE GROUND THE WING ANT-ICE VALVES WILL:","options":[{"key":"A","text":"OPEN DURING A TEST SEQUENCE (30 SECONDS); PROVIDED PNEUMATIC SUPPLY IS AVAILABLE."},{"key":"B","text":"NOT OPEN AT ANYTIME."},{"key":"C","text":"OPEN ANY TIME THE SWITCH IS PUSHED ON."}],"answer":"A","confidence":"h","explanation":"En tierra abren sólo durante el test de 30 s con presión neumática.","fcomRef":"DSC-30"},{"id":"ice-9","n":9,"q":"ON THE GROUND THE WING ANTI-ICE VALVES WILL:","options":[{"key":"A","text":"OPEN DURING A TEST SEQUENCE (30 SECONDS), PROVIDED PNEUMATIC SUPPLY IS AVAILABLE."},{"key":"B","text":"NOT OPEN AT ANYTIME."},{"key":"C","text":"OPEN ANY TIME THE SWITCH IS PUSHED \"ON\"."}],"answer":"A","confidence":"h","explanation":"En tierra abren sólo durante el test de 30 s con presión neumática.","fcomRef":"DSC-30"},{"id":"ice-10","n":10,"q":"PROBE HEAT COMES ON AUTOMATICALLY WHEN:","options":[{"key":"A","text":"THE AC ESS BUS IS POWERED."},{"key":"B","text":"ELECTRICAL POWER IS APPLIED TO THE AIRCRAFT."},{"key":"C","text":"WHEN AT LEAST ONE ENGINE IS RUNNING."}],"answer":"C","confidence":"h","explanation":"Probe heat automático con al menos un motor funcionando.","fcomRef":"DSC-30"},{"id":"ice-11","n":11,"q":"PROBE HEAT COMES ON AUTOMATICALLY WHEN:","options":[{"key":"A","text":"THE AC ESS BUS IS POWERED."},{"key":"B","text":"ELECTRICAL POWER IS APPLIED TO THE AIRCRAFT."},{"key":"C","text":"WHEN AT LEAST ONE ENGINE IS RUNNING."}],"answer":"C","confidence":"h","explanation":"Probe heat automático con al menos un motor funcionando.","fcomRef":"DSC-30"},{"id":"ice-12","n":12,"q":"RAIN PROTECTION IS PROVIDED BY:","options":[{"key":"A","text":"WARM BLEED AIR BLOWING ACROSS THE WINDSHIELD."},{"key":"B","text":"RAIN REPELLENT AND WINDSHIELD WIPERS."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"Protección contra lluvia: rain repellent y limpiaparabrisas.","fcomRef":"DSC-30"},{"id":"ice-13","n":13,"q":"TAT PROBES ARE HEATED ON THE GROUND.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: las TAT no se calientan en tierra.","fcomRef":"DSC-30"},{"id":"ice-14","n":14,"q":"THE ECAM WILL DISPLAY WING A. ICE WHEN THE WING ANTI-ICE SWITCH IS ON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: memo WING A.ICE.","fcomRef":"DSC-30"},{"id":"ice-15","n":15,"q":"THE FAULT LIGHT ON THE ENGINE ANTI-ICE SWITCHES INDICATES THE VALVE:","options":[{"key":"A","text":"IS CLOSED."},{"key":"B","text":"POSITION DISAGREES WITH POSITION."},{"key":"C","text":"IS OPEN."}],"answer":"B","confidence":"h","explanation":"FAULT en ENG ANTI ICE: posición de válvula en desacuerdo con la seleccionada.","fcomRef":"DSC-30"},{"id":"ice-16","n":16,"q":"THE FAULT LIGHT ON THE WING ANTI-ICE SWITCH INDICATES:","options":[{"key":"A","text":"ANTI-ICE VALVE POSITION DISAGREES WITH SELECTED POSITION."},{"key":"B","text":"LOW PRESSURE IS DETECTED."},{"key":"C","text":"EITHER A OR B."}],"answer":"C","confidence":"h","explanation":"FAULT en WING ANTI ICE: desacuerdo de posición o baja presión.","fcomRef":"DSC-30"},{"id":"ice-17","n":17,"q":"THE PROBE HEATERS CAN BE ACTIVATED MANUALLY PRIOR TO ENGINE START BY PLACING THE PROBE/WINDOW HEAT PUSHBUTTON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: con PROBE/WINDOW HEAT en ON antes del arranque.","fcomRef":"DSC-30"},{"id":"ice-18","n":18,"q":"THE RAIN RPLNT (RAIN REPELLENT) PUSHBUTTON IS INHIBITED ON THE GROUND WHEN THE ENGINES STOPPED.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: rain repellent inhibido en tierra con motores detenidos.","fcomRef":"DSC-30"},{"id":"ice-19","n":19,"q":"WHAT HAPPENS TO ENGINE RPM WHEN EITHER ENGINE ANTI-ICE VALVE IS OPEN?","options":[{"key":"A","text":"THERE IS A FIXED RPM INCREASE."},{"key":"B","text":"THE N 1 LIMIT FOR THAT ENGINE IS AUTOMATICALLY INCREASED."},{"key":"C","text":"THE N 1 LIMIT FOR THAT ENGINE IS AUTOMATICALLY REDUCED."},{"key":"D","text":"THERE IS A FIXED RPM INCREASE (3% OF NOMINAL N 1)."}],"answer":"C","confidence":"h","explanation":"Con anti-ice de motor, el límite de N1 se reduce automáticamente.","fcomRef":"DSC-30"},{"id":"ice-20","n":20,"q":"WHAT HAPPENS WHEN EITHER ENGINE ANTI-ICE IS OPEN?","options":[{"key":"A","text":"MAXIMUM N 1 IS LIMITED, CONTINUOUS IGNITION IS PROVIDED, MAXIMUM IDLE RPM IS INCREASED."},{"key":"B","text":"MAXIMUM N 1 IS LIMITED, CONTINUOUS IGNITION IS PROVIDED, MINIMUM RPM IS INCREASED."},{"key":"C","text":"MINIMUM N 1 IS LIMITED, CONTINUOUS IGNITION IS PROVIDED, MINIMUM IDLE RPM IS INCREASED."}],"answer":"B","confidence":"h","explanation":"N1 máximo limitado, ignición continua y aumento del idle mínimo.","fcomRef":"DSC-30"},{"id":"ice-21","n":21,"q":"WHAT IS THE DIFFERENCE BETWEEN THE ENGINE AND WING ANTI-ICE FAULT LIGHTS?","options":[{"key":"A","text":"BOTH INDICATE VALVE IN TRANSIT, OR VALVE POSITION DISAGREES WITH SELECTED POSITION. WING LIGHT ALSO COULD INDICATE LOW PRESSURE."},{"key":"B","text":"BOTH INDICATE LOW PRESSURE, OR VALVE POSITION DISAGREES WITH SELECTED POSITION. WING LIGHT MIGHT INDICATE VALVE IN TRANSIT."},{"key":"C","text":"BOTH INDICATE VALVE IN TRANSIT, OR LOW PRESSURE, WING LIGHT ALSO COULD INDICATE VALVE POSITION DISAGREES WITH SELECTED POSITION."},{"key":"D","text":"BOTH INDICATE VALVE IN TRANSIT, OR OVERHEAT."}],"answer":"A","confidence":"h","explanation":"Ambos: válvula en tránsito o desacuerdo; el de ala además baja presión.","fcomRef":"DSC-30"},{"id":"ice-22","n":22,"q":"WHAT IS THE SPEED LIMIT TO OPERATE THE WINDSCREEN WIPERS?","options":[{"key":"A","text":"185 KTS."},{"key":"B","text":"200 KTS."},{"key":"C","text":"230 KTS."},{"key":"D","text":"250 KTS."}],"answer":"C","confidence":"h","explanation":"Limpiaparabrisas: hasta 230 kt.","fcomRef":"LIM-30"},{"id":"ice-23","n":23,"q":"WHEN A PNEUMATIC LEAK IS DETECTED, THE WING ANTI-ICE VALVES:","options":[{"key":"A","text":"CLOSE AUTOMATICALLY."},{"key":"B","text":"OPEN AUTOMTICALLY."},{"key":"C","text":"REMAIN IN POSITION."}],"answer":"A","confidence":"h","explanation":"Con fuga neumática detectada las válvulas de wing anti-ice cierran.","fcomRef":"DSC-30"},{"id":"ice-24","n":24,"q":"WHEN EITHER ENGINE ANTI-ICE VALVE IS OPEN:","options":[{"key":"A","text":"MAXIMUM EPR IS INCREASED."},{"key":"B","text":"MINIMUM IDLE RPM IS INCREASED."},{"key":"C","text":"MINIMUM IDLE RPM IS REDUCED."}],"answer":"B","confidence":"h","explanation":"Con anti-ice de motor aumenta el idle mínimo.","fcomRef":"DSC-30"},{"id":"ice-25","n":25,"q":"WINDOW HEAT OPERATES AT WHAT POWER LEVEL IN FLIGHT?","options":[{"key":"A","text":"LOW."},{"key":"B","text":"HIGH."}],"answer":"B","confidence":"h","explanation":"En vuelo: alta potencia.","fcomRef":"DSC-30"},{"id":"ice-26","n":26,"q":"WINDOW HEAT OPERATION BEGINS:","options":[{"key":"A","text":"AUTOMATICALLY AFTER THE FIRST ENGINE START."},{"key":"B","text":"IF THE PROBE/WINDOW HEAT PUSH BUTTON IS SELECTED ON BY THE CREW PRIOR TO ENGINE START."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Automático tras el primer arranque o manual con el pb en ON.","fcomRef":"DSC-30"},{"id":"ice-27","n":27,"q":"WITH REFERENCE TO THE PROBE/WINDOW HEAT PUSHBUTTON, WHICH OF THE FOLLOWING IS TRUE?","options":[{"key":"A","text":"THE SYSTEM SHOULD ONLY BE SELECTED ON IN ICING CONDITIONS."},{"key":"B","text":"WHEN IN AUTO MODE, THE WINDOWS ARE HEATED ONLY WHEN NECESSARY."},{"key":"C","text":"THE SYSTEM SHOULD ONLY BE SELECTED ON AFTER FIRST ENGINE START."},{"key":"D","text":"WINDOW HEATING COMES ON AUTOMATICALLY AFTER FIRST ENGINE START."}],"answer":"D","confidence":"h","explanation":"Window heat se activa automáticamente tras el primer arranque.","fcomRef":"DSC-30"},{"id":"ice-28","n":28,"q":"WITH THE LOSS OF ELECTRICAL POWER THE ENGINE ANTI-ICE VALVES:","options":[{"key":"A","text":"FAIL IN THEIR CURRENT POSITION."},{"key":"B","text":"FAIL TO THE OPEN POSITION."},{"key":"C","text":"FAIL TO THE CLOSED POSITION."},{"key":"D","text":"FAIL TO THE MID POSITION."}],"answer":"B","confidence":"h","explanation":"Sin energía: abiertas.","fcomRef":"DSC-30"},{"id":"ice-29","n":29,"q":"WITH THE LOSS OF ELECTRICAL POWER THE ENGINE ANTI-ICE VALVES.","options":[{"key":"A","text":"FAIL IN THEIR CURRENT POSITION."},{"key":"B","text":"FAIL TO THE OPEN POSITION."},{"key":"C","text":"FAIL TO THE CLOSED POSITION."},{"key":"D","text":"FAIL TO THE MID POSITION."}],"answer":"B","confidence":"h","explanation":"Sin energía: abiertas.","fcomRef":"DSC-30"},{"id":"ice-30","n":30,"q":"WITH THE LOSS OF ELECTRICAL POWER THE WING ANTI-ICE VALVES.","options":[{"key":"A","text":"FAIL IN THEIR CURRENT POSITION."},{"key":"B","text":"FAIL TO THE OPEN POSITION."},{"key":"C","text":"FAIL TO THE CLOSED POSITION."}],"answer":"C","confidence":"h","explanation":"Wing anti-ice sin energía: cerradas.","fcomRef":"DSC-30"}]},{"id":"gear","name":"LANDING GEAR-LIGHT-DOORS","nameEs":"Tren, luces y puertas","questions":[{"id":"gear-1","n":1,"q":"ALL CABIN SIGNS COME ON AUTOMATICALLY WHEN THE CABIN ALTITUDE EXCEEDS_________ FEET, REGARDLESS OF THE RESPECTIVE SWITCH POSITION.","options":[{"key":"A","text":"9.550"},{"key":"B","text":"10.000"},{"key":"C","text":"11.300"}],"answer":"C","confidence":"h","explanation":"Los carteles de cabina se encienden automáticamente con altitud de cabina > 11.300 ft.","fcomRef":"DSC-33"},{"id":"gear-2","n":2,"q":"AS LONG AS THE LANDING GEAR LEVER IS UP A HYDRAULIC SAFETY VALVE CLOSES TO CUT OFF THE HYDRAULIC SUPPLY TO THE GEAR WHEN THE AIRSPEED IS:","options":[{"key":"A","text":"GREATER THAN 260 KIAS."},{"key":"B","text":"GREATER THAN 230 KIAS."},{"key":"C","text":"LESS THAN 260 KIAS."}],"answer":"A","confidence":"h","explanation":"Con gear lever UP la safety valve corta presión al tren sobre 260 kt.","fcomRef":"DSC-32"},{"id":"gear-3","n":3,"q":"AUTO BRAKE MAY BE ARMED WITH THE PARKING BRAKE ON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Verdadero — el armado del autobrake no depende del freno de parqueo.","fcomRef":"DSC-32"},{"id":"gear-4","n":4,"q":"AUTO BRAKES, IF SELECTED, WILL ONLY BE ACTIVATED BY:","options":[{"key":"A","text":"THE WHEELS SPINNING UP."},{"key":"B","text":"THE STRUTS BEING COMPRESSED."},{"key":"C","text":"THE BRAKE PEDALS BEING DEPRESSED."},{"key":"D","text":"THE GROUND SPOILER EXTENSION COMMAND."}],"answer":"D","confidence":"h","explanation":"El autobrake se activa con la orden de extensión de ground spoilers.","fcomRef":"DSC-32"},{"id":"gear-5","n":5,"q":"AUTOBRAKING IS INITIATED BY.","options":[{"key":"A","text":"STRUT COMPRESSION."},{"key":"B","text":"REVERSER ACTION."},{"key":"C","text":"GROUND SPOILER EXTENSION COMMAND."}],"answer":"C","confidence":"h","explanation":"El autobrake se inicia con la orden de ground spoilers.","fcomRef":"DSC-32"},{"id":"gear-6","n":6,"q":"CAN NORMAL LANDING GEAR OPERATION BE RESTORED AFTER A GRAVITY EXTENSION IF GREEN HYDRAULIC PRESSURE IS AVAILABLE?","options":[{"key":"A","text":"RESTORATION IS ALWAYS POSSIBLE."},{"key":"B","text":"IT MAY BE POSSIBLE IF THE GRAVITY EXTENSION WAS NOT CAUSED BY A FAILURE OF THE LANDING GEAR MECHANISM."},{"key":"C","text":"NO, ONLY MAINTENANCE CAN RESTORE NORMAL OPERATION."}],"answer":"B","confidence":"h","explanation":"Puede ser posible si la extensión por gravedad no se debió a una falla del mecanismo.","fcomRef":"DSC-32"},{"id":"gear-7","n":7,"q":"CAN THE FLIGHT COMPARTMENT SLIDING WINDOWS BE USED AS EMERGENCY EXITS?","options":[{"key":"A","text":"YES, IN THE COCKPIT COAT CLOSET IS A ROPE LADDER THAT CAN BE USED IN SUCH AN EVENT."},{"key":"B","text":"YES, THERE ARE ESCAPE ROPES MOUNTED ABOVE EACH WINDOW BEHIND AN ACCESS PANEL."},{"key":"C","text":"NO. THEY ARE NOT APPROVED EMERGENCY EXITS."},{"key":"D","text":"NO, THEY ARE TOO SMALL."}],"answer":"B","confidence":"h","explanation":"Sí: hay cuerdas de escape sobre cada ventana.","fcomRef":"DSC-52"},{"id":"gear-8","n":8,"q":"CAN THE GEAR BE EXTENDED ABOVE 260 KTS IF NECESSARY?","options":[{"key":"A","text":"NEVER."},{"key":"B","text":"YES, BUT MANUALLY ONLY."},{"key":"C","text":"YES, BUT THE ULTIMATE LIMIT IS 285 KT CAS."}],"answer":"B","confidence":"m","explanation":"Sobre 260 kt la safety valve impide la extensión normal; sólo por gravedad.","fcomRef":"DSC-32"},{"id":"gear-9","n":9,"q":"DURING PUSHBACK, YOU START ENGINE #2. YOU OBSERVE THE NW STRG DISC MEMO HAS CHANGED TO AMBER. WHY?","options":[{"key":"A","text":"THE NW STRG DISCONNECT MECHANISM HAS FAILED."},{"key":"B","text":"THE YELLOW HYDRAULIC SYSTEM IS NOW PRESSURIZED AND THE AMBER CAPTION IS A WARNING NOT TO MOVE THE HANDWHEEL."},{"key":"C","text":"THE NOSE WHEEL STEERING IS BEING RECONNECTED BY GROUND PERSONNEL. IT IS AMBER BECAUSE THE PIN IS REMOVED."},{"key":"D","text":"THE MEMO HAS BECOME AMBER BECAUSE ONE ENGINE IS RUNNING."}],"answer":"D","confidence":"h","explanation":"El memo NW STRG DISC se pone ámbar cuando hay un motor funcionando.","fcomRef":"DSC-32"},{"id":"gear-10","n":10,"q":"EACH MAIN WHEEL HAS AN ANTISKID BRAKE.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: cada rueda principal tiene freno con antiskid.","fcomRef":"DSC-32"},{"id":"gear-11","n":11,"q":"EACH PASSENGER DOOR HAS ONE CABIN PRESSURE WARNING LIGHT THAT:","options":[{"key":"A","text":"WARNS OF RESIDUAL PRESSURE IN THE CABIN."},{"key":"B","text":"SHOWS A POSSIBLE UNLOCKED DOOR."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"A","confidence":"h","explanation":"La luz de presión de cabina advierte presión residual.","fcomRef":"DSC-52"},{"id":"gear-12","n":12,"q":"ECAM: IF YOU SEE A GREEN ARC SHOWN OVER A WHEEL INDICATION.","options":[{"key":"A","text":"IT MARKS THE HOTTEST BRAKE WITH A TEMPERATURE OF MORE THAN 100ºC."},{"key":"B","text":"IT INDICATES AN ABNORMAL HIGH TEMPERATURE."},{"key":"C","text":"THE A/SKID SYSTEM IS AUTOMATICALLY RELEASING THE PRESSURE OF THAT BRAKE."},{"key":"D","text":"THEL/G CONTROL SYSTEM HAS DETECTED A LOW TIRE PROFILE."}],"answer":"A","confidence":"h","explanation":"El arco verde marca el freno más caliente con más de 100 °C.","fcomRef":"DSC-32"},{"id":"gear-13","n":13,"q":"HOW CAN THE BRAKE ACCUMULATOR BE RE-PRESSURIZED?","options":[{"key":"A","text":"WITH THE YELLOW ELECTRIC HYDRAULIC PUMP."},{"key":"B","text":"WITH THE BLUE ELECTRIC HYDRAULIC PUMP."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"A","confidence":"h","explanation":"El acumulador se repone con la bomba eléctrica amarilla.","fcomRef":"DSC-32"},{"id":"gear-14","n":14,"q":"HOW DO YOU MANUALLY EXTEND THE LANDING GEAR?","options":[{"key":"A","text":"LIFT THE RED HANDLE AND TURN ANTICLOCKWISE 4 TURNS."},{"key":"B","text":"LIFT THE RED HANDLE AND TURN ANTICLOCKWISE A MINIMUM OF 2 TURNS."},{"key":"C","text":"LIFT THE RED HANDLE AND TURN CLOCKWISE A MINIMUM OF 4 TURNS."},{"key":"D","text":"LIFT THE RED HANDLE AND TURN CLOCKWISE A 3 TUNS."}],"answer":"D","confidence":"h","explanation":"Levantar la manija roja y girar 3 vueltas en sentido horario.","fcomRef":"DSC-32"},{"id":"gear-15","n":15,"q":"HOW IS CREW OXYGEN PROVIDE?","options":[{"key":"A","text":"FROM A SINGLE BOTTLE."},{"key":"B","text":"THERE IS ONE BOTTLE PER CREW MEMBER EXCEPT FOR JUMP SEATS."},{"key":"C","text":"OXYGEN GENERATOR."},{"key":"D","text":"ONE OXYGEN BOTTLE WITH AN OXYGEN GENERATOR."}],"answer":"A","confidence":"h","explanation":"Oxígeno de tripulación: una sola botella.","fcomRef":"DSC-35"},{"id":"gear-16","n":16,"q":"HOW IS IT DETERMINED THAT THE COCKPIT SLIDING WINDOW IS CLOSED AND LOCKED?","options":[{"key":"A","text":"THE RED RING BELOW THE RELEASE BUTTON SHOULD NOT BE IN VIEW."},{"key":"B","text":"THE RED RING BELOW THE RELEASE BUTTON SHOULD BE IN VIEW."},{"key":"C","text":"THE LOCKING PIN WAS PLACED IN THE FORWARD POSITION WHEN THE WINDOW WAS CLOSED."},{"key":"D","text":"THE PIN IS ENGAGED."}],"answer":"A","confidence":"h","explanation":"Ventana cerrada y trabada: el anillo rojo no debe verse.","fcomRef":"DSC-52"},{"id":"gear-17","n":17,"q":"HOW MANY CABIN ENTRANCE, OVERWING EMERGENCY EXITS AND CARGO DOORS ARE ON THE A-320?","options":[{"key":"A","text":"FOUR CABIN, TWO OVERWINGS, AND TWO CARGO, PLUS THE BULK CARGO."},{"key":"B","text":"FOUR CABIN, FOUR OVERWINGS , AN TWO CARGO, PLUS THE BULK CARGO."},{"key":"C","text":"TWO CABIN, FOUR OVERWINGS, AND THREE CARGO, PLUS THE BULK CARGO."}],"answer":"B","confidence":"h","explanation":"Cuatro puertas de cabina, cuatro salidas sobre ala, dos de carga más la bulk.","fcomRef":"DSC-52"},{"id":"gear-18","n":18,"q":"HOW MANY TURNS ARE REQUIRED ON THE GRAVITY EXTENSION HAND CRANK TO EXTEND THE LANDING GEAR?","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":"B","confidence":"h","explanation":"Tres vueltas.","fcomRef":"DSC-32"},{"id":"gear-19","n":19,"q":"IF DOOR HANDLE IS LIFTED AND THE WHITE INDICATOR ILLUMINATES, WHAT DOES THIS MEAN?","options":[{"key":"A","text":"THE ESCAPE SLIDE IS ARMED AND IF YOU GO ON LIFTING THE HANDLE, DOOR OPENS AND SLIDE WILL DEPLOY."},{"key":"B","text":"PNEUMATIC ASSISTANCE OF THE DOOR HAS FAILED."},{"key":"C","text":"THE ESCAPE SLIDE IS IN DISARMED CONFIGURATION."},{"key":"D","text":"THE CABIN IS STILL PRESSURIZED."}],"answer":"A","confidence":"h","explanation":"Luz blanca al levantar la manija: el tobogán está armado.","fcomRef":"DSC-52"},{"id":"gear-20","n":20,"q":"IF NORMAL ELECTRICAL POWER IS LOST, ESSENTTIAL COCKPIT LIGHTING IS MAINTAINED FOR THE:","options":[{"key":"A","text":"CAPTAIN\\'S INSTRUMENT PANEL."},{"key":"B","text":"STANDBY COMPASS."},{"key":"C","text":"RIGHT DOME LIGHT (PROVIDED THE DOME SELECTOR IS NOT OFF)."},{"key":"D","text":"ALL OFF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Iluminación esencial: panel del CPT, brújula standby y dome light derecho.","fcomRef":"DSC-33"},{"id":"gear-21","n":21,"q":"IF THE ACCUMULATOR ON THE ALTERNATE BRAKE SYSTEM IS YOUR ONLY SOURCE PRESSURE, WHICH OF THE FOLLOWING WILL BE AVAILABLE?","options":[{"key":"A","text":"AUTO BRAKES AND ANTISKID."},{"key":"B","text":"ANTISKID."},{"key":"C","text":"SEVEN APPLICATIONS OF THE BRAKE PEDALS."},{"key":"D","text":"THREE APPLICATIONS OF THE BRAKE PEDALS."}],"answer":"C","confidence":"h","explanation":"Sólo acumulador: al menos 7 aplicaciones completas.","fcomRef":"DSC-32"},{"id":"gear-22","n":22,"q":"IF THE BRAKE SYSTEM AUTOMATICALLY TRANSITIONS TO ALTERNATE BRAKES WITH THE A/SKID & N/W STRG SWITCH IN THE ON POSITION, WHICH OF THE FOLLOWING WILL BE AVAILABLE?","options":[{"key":"A","text":"AUTO BRAKES AND ANTI-SKID."},{"key":"B","text":"ONLY AUTO BRAKES."},{"key":"C","text":"BRAKES, AUTO BRAKES, ANTI-SKID."},{"key":"D","text":"ANTI-SKID."}],"answer":"D","confidence":"h","explanation":"Transición automática a alternate: sigue disponible el antiskid (sin autobrake).","fcomRef":"DSC-32"},{"id":"gear-23","n":23,"q":"IF THE BSCU DETECTS A BRAKE SYSTEM MALFUNCTION IN FLIGHT WITH THE A/SKID & N/W STRG SWITCH IN THE ON POSITION.","options":[{"key":"A","text":"THE CREW WILL BE NOTIFIED WITH AN ECAM MESSAGE AFTER TOUCHDOWN IF THE BRAKE SYSTEM DOES MALFUNCITION."},{"key":"B","text":"THE CREW WILL BE NOTIFIED WITH AN ECAM MESSAGE."},{"key":"C","text":"THE CREW MUST MANUALLY SELECT ALTERNATE BRAKES."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"B","confidence":"m","explanation":"Se notifica con un mensaje ECAM y la transición a alternate es automática.","fcomRef":"DSC-32"},{"id":"gear-24","n":24,"q":"IF THE LANDING GEAR WAS GRAVITY EXTENDED USING THE HAND CRANK ON THE CENTER PEDESTAL, LANDING GEAR POSITION MUST BE VERIFIED THROUGH.","options":[{"key":"A","text":"THE LANDING GEAR VIEWERS."},{"key":"B","text":"THE LANDING GEAR INDICATIONS DEPICTED ON THE ECAM AND, IF AVAILABLE, THE CENTER PANEL LDG GEAR INDICATOR PANEL LIGHTS."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"Se verifica con las indicaciones ECAM y las luces del panel LDG GEAR.","fcomRef":"DSC-32"},{"id":"gear-25","n":25,"q":"IF THE LANDING GEAR WAS GRAVITY EXTENDED USING THE HAND CRANK ON THE CENTER PEDESTAL, WHAT OTHER SYSTEMS WILL BE INOPERATIVE?","options":[{"key":"A","text":"NOSE WHEEL STEERING AND AUTO BRAKING."},{"key":"B","text":"NOSE WHEEL STEERING ONLY."},{"key":"C","text":"ANTI-SKID AND AUTO BRAKING."},{"key":"D","text":"NOSE WHEEEL STEERING AND ANTI-SKID."}],"answer":"B","confidence":"h","explanation":"Tras la extensión por gravedad se pierde la dirección de nariz.","fcomRef":"DSC-32"},{"id":"gear-26","n":26,"q":"LANDING GEAR OPERATION IS INHIBITED AT SPEEDS:","options":[{"key":"A","text":"BELOW 100 KNOTS."},{"key":"B","text":"ABOVE 260 +/- 5 KNOTS."},{"key":"C","text":"BELOW 100 KNOTS AND ABOVE 260 KNOTS."},{"key":"D","text":"ABOVE 250 KNOTS."}],"answer":"B","confidence":"h","explanation":"Operación del tren inhibida sobre 260 kt (±5).","fcomRef":"DSC-32"},{"id":"gear-27","n":27,"q":"NOSE WHEELS AND MAIN WHEELS HAVE FUSIBLE PLUGS THAT PREVENT THE TIRES FROM BUSTING IF THEY OVERHEAT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: sólo las ruedas principales tienen tapones fusibles.","fcomRef":"DSC-32"},{"id":"gear-28","n":28,"q":"ON THE COCKPIT OVERHEAD PANEL THERE IS A THREE POSITION EMERGENCY EXIT LT SWITCH. WHAT LIGHTS ARE ASSOCIATED WITH THIS SWITCH?","options":[{"key":"A","text":"EXIT SIGNS, EMERGENCY LIGHTS, AND FLOOR PATH LIGHTS."},{"key":"B","text":"EXIT SIGNS, EMERGENCY LIGHTS, MAIN PANEL FLOOD LIGHTS, AND FLOOR PATH LIGHTS."},{"key":"C","text":"EXIT SIGNS, EMERGENCY LITHTS, DOME LIGHTS, MAIN PANEL FLOOD LIGHTS, AND THE STANDBY COMPASS LIGHT."},{"key":"D","text":"EXIT SIGNS, AND THE STANDBY COMPASS LIGHT."}],"answer":"A","confidence":"h","explanation":"EMER EXIT LT: exit signs, luces de emergencia y floor path.","fcomRef":"DSC-33"},{"id":"gear-29","n":29,"q":"ON THE ECAM DOOR/OXY PAGE, THE SLIDE INDICATION APPEARS ____ WHEN THE SLIDE IS NOT DISARMED.","options":[{"key":"A","text":"WHITE."},{"key":"B","text":"AMBER."},{"key":"C","text":"GREEN."},{"key":"D","text":"RED."}],"answer":"B","confidence":"h","explanation":"SLIDE ámbar cuando no está desarmado.","fcomRef":"DSC-52"},{"id":"gear-30","n":30,"q":"ON THE E/WD, YOU NOTICE THE NW STRG DISC MEMO. WHAT DOES IT MEAN?","options":[{"key":"A","text":"THE NOSE WHEEL STEERING HAS BEEN DISCONNNECTED BY GROUND PERSONNEL."},{"key":"B","text":"A FAILURE IN THE NOSE WHEEL STEERING SYSTEM HAS BEEN DETECTED."},{"key":"C","text":"THERE IS A DISCREPANCY BETWEEN THE TWO NOSE WHEEL STEERING HANDWHEEL POSITIONS."},{"key":"D","text":"THE NOSE WHEEL STERRING COMPUTER HAS FINISHED ITS SELF TEST."}],"answer":"A","confidence":"h","explanation":"NW STRG DISC: personal de tierra desconectó la dirección.","fcomRef":"DSC-32"},{"id":"gear-31","n":31,"q":"OPENING AN EME
