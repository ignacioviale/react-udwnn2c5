<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cockpit-panel two-column — system list (left) + question "display unit" (right); stacks on phone. */
:root {
  --bg: #0d1218;          /* panel black-blue */
  --surface: #151c25;     /* DU bezel */
  --surface-2: #1c2531;
  --line: #2a3542;
  --fg: #dfe6ee;
  --fg-dim: #8c9aab;
  --accent: #4ea3ff;      /* selected / managed blue */
  --accent-2: #8fd0ff;    /* ECAM cyan-blue for actions */
  --ok: #3ecf8e;
  --bad: #ff6b5e;
  --warn: #f0b44c;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding-block: 14px 12px; border-bottom: 1px solid var(--line); max-width: 1180px; margin: 0 auto;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.brand small { font-family: var(--font-mono); font-size: .72rem; color: var(--fg-dim); letter-spacing: .06em; text-transform: uppercase; }
.global { margin-left: auto; display: flex; gap: 18px; font-family: var(--font-mono); font-size: .8rem; color: var(--fg-dim); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.global b { color: var(--fg); font-weight: 500; }
.global .ok b { color: var(--ok); } .global .bad b { color: var(--bad); }

.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; padding-top: 20px; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* System list */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.label { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); }
.groups { display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 860px) {
  .groups { flex-direction: row; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .groups .g { flex: 0 0 220px; scroll-snap-align: start; }
}
.g {
  text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px;
  padding: 9px 12px; cursor: pointer; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px;
}
.g:hover { background: var(--surface); }
.g[aria-current="true"] { background: var(--surface-2); border-color: var(--line); }
.g .nm { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g[aria-current="true"] .nm { color: var(--accent-2); }
.g .ct { font-family: var(--font-mono); font-size: .75rem; color: var(--fg-dim); font-variant-numeric: tabular-nums; align-self: center; }
.g .en { grid-column: 1 / -1; font-family: var(--font-mono); font-size: .66rem; color: var(--fg-dim); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; display: flex; margin-top: 4px; }
.bar i { display: block; height: 100%; }
.bar .o { background: var(--ok); } .bar .x { background: var(--bad); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
  font-size: .82rem; cursor: pointer; color: var(--fg-dim);
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.chip:disabled { opacity: .45; cursor: default; }

/* Display unit */
.du { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px clamp(16px, 3vw, 30px) 24px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.du-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-family: var(--font-mono); font-size: .75rem; color: var(--fg-dim); letter-spacing: .05em; text-transform: uppercase; }
.du-head .pos { color: var(--accent-2); font-variant-numeric: tabular-nums; }
.du-head .spacer { flex: 1; }
.conf { border-radius: 4px; padding: 2px 7px; font-size: .68rem; letter-spacing: .06em; border: 1px solid currentColor; }
.conf.h { color: var(--fg-dim); } .conf.m { color: var(--warn); } .conf.l { color: var(--bad); }
.q { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 2.2vw, 1.45rem); line-height: 1.3; margin: 0; text-wrap: pretty; max-width: 62ch; }
.opts { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.opt {
  width: 100%; text-align: left; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; align-items: start;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-weight: 500; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--accent-2); font-size: .9rem; }
.opt .t { padding-top: 3px; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface-2)); }
.opt.correct .k { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface-2)); }
.opt.wrong .k { background: var(--bad); color: var(--bg); border-color: var(--bad); }
.opt.dim { opacity: .55; }

.verdict { border-radius: 8px; padding: 14px 16px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.verdict .v { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .03em; text-transform: uppercase; }
.verdict.ok .v { color: var(--ok); } .verdict.bad .v { color: var(--bad); }
.verdict p { margin: 0; max-width: 68ch; }
.verdict .ref { font-family: var(--font-mono); font-size: .76rem; color: var(--fg-dim); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.verdict .ref b { color: var(--accent-2); font-weight: 500; }
.verdict .note { font-size: .85rem; color: var(--warn); }

.nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #06111d; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg-dim); }
.nav .spacer { flex: 1; }
.kbd { font-family: var(--font-mono); font-size: .72rem; color: var(--fg-dim); }
@media (max-width: 560px) { .kbd { display: none; } }

.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dots button { width: 12px; height: 12px; padding: 0; border-radius: 3px; border: 0; background: var(--line); cursor: pointer; }
.dots button.o { background: var(--ok); } .dots button.x { background: var(--bad); }
.dots button.cur { outline: 2px solid var(--accent-2); outline-offset: 1px; }

.empty { color: var(--fg-dim); padding: 30px 0; text-align: center; }
.foot { max-width: 1180px; margin: 28px auto 0; font-size: .8rem; color: var(--fg-dim); border-top: 1px solid var(--line); padding-top: 14px; }
.foot p { margin: 0 0 6px; max-width: 90ch; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem; color: var(--warn); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const BANK = {"schema":"a320-dgac-qbank/v1","source":"DGAC Chile — Examen por materias, habilitación de tipo Airbus A320 (enero 2018)","generated":"2026-10-30","confidenceLegend":{"h":"alta — coincide con FCOM","m":"media — verificar con FCOM del operador","l":"baja — verificar obligatoriamente"},"verification":"Respuestas verificadas contra conocimiento del FCOM A320 (DSC). No se tuvo acceso a una copia del FCOM durante la generación.","groups":[{"id":"aircond","name":"AIR COND. & PNEUMATICS","nameEs":"Aire acondicionado y neumático","questions":[{"id":"aircond-1","n":1,"q":"AFT CARGO INDICATIONS MAY BE FOUND ON WHICH ECAM PAGE (S)?","options":[{"key":"A","text":"ONLY THE ECAM CRUISE PAGE."},{"key":"B","text":"ONLY THE BLEED PAGE."},{"key":"C","text":"ONLY THE CAB PRESS PAGE."},{"key":"D","text":"THE ECAM CRUISE PAGE AND THE COND PAGE."}],"answer":"D","confidence":"h","explanation":"La temperatura del compartimiento de carga AFT se muestra en la página COND y en la página CRUISE.","fcomRef":"DSC-21-30"},{"id":"aircond-2","n":2,"q":"AFT CARGO VENTILATION IS CONTROLLED BY:","options":[{"key":"A","text":"THE AFT CARGO ROTARY SELECTOR KNOB."},{"key":"B","text":"THE CARGO VENTILATION CONTROLLER."},{"key":"C","text":"THE ZONE CONTROLLER AND THE SDCU."},{"key":"D","text":"THE CARGO VENTILATION CONTROLLER & THE AFT CARGO ROTARY SELECTOR KNOB."}],"answer":"B","confidence":"m","explanation":"La ventilación del cargo AFT la gestiona el cargo ventilation controller (abre/cierra válvulas de aislación y extract fan). El selector rotativo controla la temperatura (calefacción), no la ventilación.","fcomRef":"DSC-21-30"},{"id":"aircond-3","n":3,"q":"AN AMBER FAULT LIGHT IN THE HOT AIR P/B INDICATES:","options":[{"key":"A","text":"VALVE POSITION DISAGREES WITH COMMANDED POSITION."},{"key":"B","text":"A DUCT OVERHEAT IS DETECTED."},{"key":"C","text":"EITHER A OR B."}],"answer":"B","confidence":"m","explanation":"HOT AIR FAULT: se ilumina cuando se detecta sobretemperatura en el ducto. Algunas versiones del FCOM agregan desacuerdo de posición de válvula — verificar con tu revisión.","fcomRef":"DSC-21-20"},{"id":"aircond-4","n":4,"q":"APU BLEED AIR, WHEN SELECTED.","options":[{"key":"A","text":"HAS PRIORITY OVER ENGINE BLEED AIR."},{"key":"B","text":"WILL SUPPLY BLEED AIR ONLY IF THE ENG BLEED PB´S ARE SELECTED OFF."},{"key":"C","text":"WILL SUPPLY AIR ONLY IF THE X BLEED SELECTOR IS SELECTED OPEN."},{"key":"D","text":"DOES NOT HAVE PRIORITY OVER ENGINE BLEED AIR."}],"answer":"A","confidence":"h","explanation":"Con APU BLEED ON (y válvula abierta) las válvulas de bleed de los motores cierran automáticamente: el APU tiene prioridad.","fcomRef":"DSC-36-10"},{"id":"aircond-5","n":5,"q":"AT WHAT CABIN ALTITUDE DO YOU GET AN ECAM WARNING?","options":[{"key":"A","text":"8,800 FEET."},{"key":"B","text":"9,000 FEET."},{"key":"C","text":"9,550 FEET."},{"key":"D","text":"14,000 FEET."}],"answer":"C","confidence":"h","explanation":"Warning CAB PR EXCESS CAB ALT cuando la altitud de cabina supera ~9.550 ft (±350 ft).","fcomRef":"DSC-21-40"},{"id":"aircond-6","n":6,"q":"AVIONICS VENTILATION SYSTEM INDICATIONS MAY BE FOUND ON WHICH ECAM PAGE(S)?","options":[{"key":"A","text":"ONLY THE CAB PRESS PAGE."},{"key":"B","text":"THE INFLIGHT ECAM CRUISE PAGE."},{"key":"C","text":"THE INFLIGHT ECAM CRUISE PAGE AND THE CAB PRESS PAGES."},{"key":"D","text":"ONLY THE BLEED PAGE."}],"answer":"A","confidence":"h","explanation":"Las válvulas inlet/extract de ventilación de aviónica se muestran en la página CAB PRESS.","fcomRef":"DSC-21-40"},{"id":"aircond-7","n":7,"q":"BLEED AIR NORMALLY COMES FROM THE ________ OF THE ENGINE.","options":[{"key":"A","text":"HIGH PRESSURE STAGE."},{"key":"B","text":"INTERMEDIATE STAGE."},{"key":"C","text":"LOW PRESSURE STAGE."}],"answer":"B","confidence":"h","explanation":"El bleed se toma normalmente de la etapa intermedia (IP); la etapa HP sólo con baja presión (bajo empuje).","fcomRef":"DSC-36-10"},{"id":"aircond-8","n":8,"q":"BLEED AIR SUPPLIED FROM THE APU (APU BLEED VALVE OPEN), THE PACK FLOW IS AUTOMATICALLY SELECTED:","options":[{"key":"A","text":"HIGH."},{"key":"B","text":"NORMAL."},{"key":"C","text":"LOW."},{"key":"D","text":"ECON. FLOW."}],"answer":"A","confidence":"h","explanation":"Con bleed del APU el flujo de los packs se selecciona automáticamente en HIGH.","fcomRef":"DSC-21-20"},{"id":"aircond-9","n":9,"q":"BOTH PRESSURIZATION AUTO CONTROLLERS ARE SET BY THE ACTIVE FLIGHT PLAN LOADED IN THE MCDU. THE QNH ENTRY ON THE MCDU APPROACH PERFORMANCE PAGE REFINES THE DEPRESSURIZATION SHEDULE FOR THE LANDING.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Los controladores usan datos del FMGS (plan activo, elevación de destino); el QNH ingresado en PERF APPR afina el programa de despresurización.","fcomRef":"DSC-21-40"},{"id":"aircond-10","n":10,"q":"DURING GROUND FUNCTION OPERATION, THE OUTFLOW VALVE IS:","options":[{"key":"A","text":"FULLY OPEN."},{"key":"B","text":"FULLY CLOSED."},{"key":"C","text":"POSITIONED ACCORDING TO FMGS DEMANDS."}],"answer":"A","confidence":"h","explanation":"En tierra (ground function) la outflow valve queda totalmente abierta.","fcomRef":"DSC-21-40"},{"id":"aircond-11","n":11,"q":"DURING NORMAL FLIGHT, THE AVIONICS VENTILATION SYSTEM CONTROLS THE TEMPERATURE OF THE COOLING AIR BY:","options":[{"key":"A","text":"ADDING AIR CONDITIONED AIR TO THE FLOW."},{"key":"B","text":"EXTRACTING AIR OVER BOARD."},{"key":"C","text":"ADDING A AVIONICS BAY AIR."},{"key":"D","text":"PASSING AIR THROUGH A SKIN HEAT EXCHANGER."}],"answer":"D","confidence":"h","explanation":"En vuelo (configuración cerrada) el aire de aviónica se enfría pasando por el skin heat exchanger.","fcomRef":"DSC-21-50"},{"id":"aircond-12","n":12,"q":"DURING THE EXTERIOR PREFLIGHT ON A WARM DAY, IN WHAT POSITION WOULD YOU EXPECT TO FIND THE AVIONICS VENTILATION SYSTEM INLET AND EXTRACT VALVES TO BE IN?","options":[{"key":"A","text":"OPEN."},{"key":"B","text":"INTERMEDIATE."},{"key":"C","text":"CLOSED."},{"key":"D","text":"FIRE."}],"answer":"A","confidence":"h","explanation":"En tierra con temperatura alta la ventilación de aviónica está en configuración ABIERTA (inlet y extract abiertas).","fcomRef":"DSC-21-50"},{"id":"aircond-13","n":13,"q":"ENGINE BLEED AIR TEMPERATURE IS CONTROLLED BY:","options":[{"key":"A","text":"ENGINE OIL."},{"key":"B","text":"A PRE-COOLER THAT USES FAN AIR."},{"key":"C","text":"CONDITIONED AIR FROM THE MIXING UNIT."}],"answer":"B","confidence":"h","explanation":"La temperatura del bleed se regula con el pre-cooler que usa aire del fan (FAV).","fcomRef":"DSC-36-10"},{"id":"aircond-14","n":14,"q":"ENGINE FLOW DEMAND, WHEN THE HEATING OR COOLING DEMAND IN ONE ZONE CANNOT BE SATISFIED.","options":[{"key":"A","text":"THE MINIMUM IDLE MUST BE INCREASED MANUALLY."},{"key":"B","text":"THE MINIMUM IDLE IS INCREASED AUTOMATICALLY."},{"key":"C","text":"IN ANY CASE, FLIGHT IDLE IS SUFFICIENT."},{"key":"D","text":"THE APU MUST BE USED TO SUPPLY ADDITIONAL AIR."}],"answer":"B","confidence":"h","explanation":"Si la demanda de calefacción/refrigeración no se satisface, el sistema pide aumento automático del idle mínimo (FADEC).","fcomRef":"DSC-21-20"},{"id":"aircond-15","n":15,"q":"HOT AIR FAUL LIGHT ILLUMINATES ON THE AIR CONDITIONING PANEL.","options":[{"key":"A","text":"THE HOT AIR PRESS. REG. VALVE OPENS AND THE TRIM AIR VALVES CLOSE."},{"key":"B","text":"THE HOT AIR PRESS. REG. VALVE CLOSES AND THE TRIM AIR VALVES OPEN."},{"key":"C","text":"THE HOT AIR PRESS. REG. VALVE CLOSES AND THE TRIM AIR VALVES CLOSE."},{"key":"D","text":"THE HOT AIR PRESS. REG. VALVE OPENS AND THE TRIM AIR VALVES OPEN."}],"answer":"C","confidence":"h","explanation":"HOT AIR FAULT: la hot air pressure regulating valve y las trim air valves cierran automáticamente.","fcomRef":"DSC-21-20"},{"id":"aircond-16","n":16,"q":"HOT AIR PRESS. REG. VALVE FAILED OPEN.","options":[{"key":"A","text":"OPTIMIZED REGULATION IS LOST."},{"key":"B","text":"THE TEMPERATURE STAYS AT THE VALUE SELECTED."},{"key":"C","text":"NO EFFECT."},{"key":"D","text":"CABIN TEMPERATURE WILL BE CONTROLLED AT THE UPPER LIMIT 30 DEG. C."}],"answer":"C","confidence":"m","explanation":"Hot air valve fallada abierta: sin efecto, la regulación continúa (fallada cerrada = se pierde la regulación optimizada).","fcomRef":"DSC-21-20"},{"id":"aircond-17","n":17,"q":"HOT AIR PRESSURE REGULATING VALVE:","options":[{"key":"A","text":"REGULATES THE PRESSURE OF HOT AIR TAPPED UPSTREAM OF THE PACKS."},{"key":"B","text":"IS SPRING LOADED OPEN IN THE ABSENCE OF AIR."},{"key":"C","text":"OPENS AUTOMATICALLY IN CASE OF DUCT OVERHEAT."},{"key":"D","text":"OPENS AUTOMATICALLY IF THE CABIN TRIM AIR VALVE FAILS."}],"answer":"A","confidence":"h","explanation":"Regula la presión del aire caliente tomado aguas arriba de los packs. Es spring-loaded CERRADA.","fcomRef":"DSC-21-20"},{"id":"aircond-18","n":18,"q":"HOW CAN YOU CHANGE PRESSURIZATION CONTROLLERS DURING FLIGHT?","options":[{"key":"A","text":"CYCLE THE LDG ELEV AUTO KNOB OUT OF THE AUTO POSITION THEN BACK TO AUTO."},{"key":"B","text":"CYCLE THE CABIN PRESS MODE SEL PUSHBUTTON TO THE MAN POSITION THEN BACK TO AUTO."},{"key":"C","text":"CYCLE THE CABIN PRESSURIZATION MAN V/S CTL SWITCH."}],"answer":"B","confidence":"h","explanation":"Llevar MODE SEL a MAN y volver a AUTO alterna el controlador activo.","fcomRef":"DSC-21-40"},{"id":"aircond-19","n":19,"q":"HOW MANY OUTFLOW VALVES ARE THERE?","options":[{"key":"A","text":"ONE VALVE WITH ONE DOOR."},{"key":"B","text":"ONE VALVE WITH TWO DOORS."},{"key":"C","text":"TWO VALVES WITH ONLY ONE DOOR VISIBLE."},{"key":"D","text":"TWO VALVES (ONE MAIN + ONE BACK-UP) WITH ONLY TWO DOORS VISIBLE."}],"answer":"B","confidence":"m","explanation":"Hay una sola outflow valve, del tipo de doble compuerta (dos puertas).","fcomRef":"DSC-21-40"},{"id":"aircond-20","n":20,"q":"HOW MANY TEMPERATURE SELECTORS ARE THERE ON THE A-320? HOW MANY TEMPERATURE ZONES ARE THERE?","options":[{"key":"A","text":"THREE ROTARY TEMPERATURE SELECTORS AND ONE ZONE."},{"key":"B","text":"THREE ROTARY TEMPRERATURE SELECTORS, ONE EACH FOR THE COCKPIT ZONE, THE FORWARD CABIN ZONE, AND THE AFT CABIN ZONE."},{"key":"C","text":"TWO ROTARY TEMPERATURE SELECTORS, ONE FOR THE COCKPIT AND FIRST CLASS ZONE AND ONE FOR THE AFT CABIN ZONE."},{"key":"D","text":"FOUR ROTARY TEMPERATURE SELECTORS AND FOUR ZONES."}],"answer":"B","confidence":"h","explanation":"Tres selectores y tres zonas: cockpit, FWD cabin y AFT cabin.","fcomRef":"DSC-21-20"},{"id":"aircond-21","n":21,"q":"HOW MANY TRIM AIR VALVES ARE THERE?","options":[{"key":"A","text":"ONE TRIM AIR VALVE."},{"key":"B","text":"THREE: ONE EACH FOR THE COCKPIT ZONE, THE FORWARD CABIN ZONE, AND THE AFT CABIN ZONE."},{"key":"C","text":"TWO: ONE FOR THE COCKPIT AND FIRST CLASS ZONE, AND ONE FOR THE CABIN ZONE."},{"key":"D","text":"FOUR: ONE EACH FOR THE COCKPIT ZONE, THE FIRST CLASS ZONE, AND TWO FOR THE AFT ZONE."}],"answer":"B","confidence":"h","explanation":"Tres trim air valves, una por zona (cockpit, FWD cabin, AFT cabin).","fcomRef":"DSC-21-20"},{"id":"aircond-22","n":22,"q":"IF A BMC FAILS:","options":[{"key":"A","text":"THE REMAINING BMC WILL AUTOMATICALLY ASSUME MOST OF THE FAILED BMC´S FUNCTIONS."},{"key":"B","text":"ALL SYSTEM ASOCIATED WITH THE FAILED BMC ALSO FAIL."},{"key":"C","text":"THE ASSOCIATED BLEED VALVES CLOSE."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"A","confidence":"h","explanation":"Si un BMC falla, el BMC adyacente asume la mayoría de sus funciones de monitoreo.","fcomRef":"DSC-36-10"},{"id":"aircond-23","n":23,"q":"IF BLEED AIR IS BEING SUPPLIED BY THE APU OR IF ONE PACK FAILS, PACK FLOW WILL GO TO WHAT RATE?","options":[{"key":"A","text":"LOW."},{"key":"B","text":"MEDIUM."},{"key":"C","text":"HIGH."}],"answer":"C","confidence":"h","explanation":"Con bleed de APU o falla de un pack, el flujo pasa automáticamente a HIGH.","fcomRef":"DSC-21-20"},{"id":"aircond-24","n":24,"q":"IF YOU SELECT A POSITION OTHER THAN THE AUTO DETENT ON THE LDG ELEV AUTO SELECTOR, HOW CAN YOU SEE TE ACTUAL LANDING ELEVATION VALUE?","options":[{"key":"A","text":"ON THE ECAM CRUISE."},{"key":"B","text":"ON THE PRESS PAGE."},{"key":"C","text":"ON THE ECAM CRUISE OR THE PRESS PAGE."}],"answer":"C","confidence":"m","explanation":"La elevación de aterrizaje (seleccionada o automática) se muestra en la página CRUISE y en CAB PRESS.","fcomRef":"DSC-21-40"},{"id":"aircond-25","n":25,"q":"IN FLIGHT IF THE AIR PRESSURE IS INSUFFICIENT EVEN WITH THE HP VALVE OPEN:","options":[{"key":"A","text":"THE ENGINE SPOOLS UP AUTOMATICALLY."},{"key":"B","text":"ENGINE POWER HAS TO BE INCREASED BY THE PILOT."},{"key":"C","text":"PUSH THE HIGH PRESSURE P/B ON THE OVERHEAD PANEL."}],"answer":"A","confidence":"m","explanation":"Si la presión es insuficiente aún con HP valve abierta, el sistema pide automáticamente aumento de idle (el motor acelera solo).","fcomRef":"DSC-36-10"},{"id":"aircond-26","n":26,"q":"IN NORMAL FLIGHT IN CLOSED CIRCUIT CONFIGURATION, THE AVIONICS VENTILATION SYSTEM CONTROLS THE TEMPERATURE OF THE COOLING AIR BY:","options":[{"key":"A","text":"ADDING AIR CONDITIONED AIR TO THE FLOW."},{"key":"B","text":"EXTRACTING AIR OVERBOARD."},{"key":"C","text":"ADDING AVIONICS BAY AIR."},{"key":"D","text":"PASSING AIR THROUGH A SKIN HEAT EXCHANGER."}],"answer":"D","confidence":"h","explanation":"Configuración cerrada en vuelo: el aire circula por el skin heat exchanger.","fcomRef":"DSC-21-50"},{"id":"aircond-27","n":27,"q":"IT IS PERMISSIBLE TO USE SIMULTANEOUSLY PACKS AND LP GROUND UNIT DURING LONG STOPS IN A HOT AIRFIELD.","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."}],"answer":"B","confidence":"h","explanation":"Limitación: no usar simultáneamente packs y unidad de aire acondicionado de tierra (LP ground unit).","fcomRef":"LIM-21"},{"id":"aircond-28","n":28,"q":"PACK CONTROLLER, PRIMARY AND SECONDARY CHANNEL FAILURE.","options":[{"key":"A","text":"PACK OUTLET TEMPERATURE IS CONTROLLED TO BETWEEN 5 AND 30 DEG. C BY THE ANTI-ICE VALVE."},{"key":"B","text":"THE PACK IS CLOSED."},{"key":"C","text":"THE PACKS DELIVER A FIXED TEMPERATURE OF 20 DEG. C."}],"answer":"A","confidence":"h","explanation":"Falla de ambos canales: la anti-ice valve regula la salida del pack entre 5 °C y 30 °C.","fcomRef":"DSC-21-20"},{"id":"aircond-29","n":29,"q":"PACK CONTROLLER, PRIMARY CHANNEL FAILURE.","options":[{"key":"A","text":"THE SECONDARY COMPUTER OPERATES AS A BACKUP MODE AND REGULATION IS NOT OPTIMIZED."},{"key":"B","text":"THE SECONDARY COMPUTER TAKES OVER (ALL FUNCTIONS AS NORMAL)"},{"key":"C","text":"PACK IS LOST."},{"key":"D","text":"PACK OUTLET TEMPERATURE IS CONTROLLED AT 15 DEG.C"}],"answer":"A","confidence":"h","explanation":"Falla del canal primario: el secundario actúa como backup, regulación no optimizada.","fcomRef":"DSC-21-20"},{"id":"aircond-30","n":30,"q":"PACK CONTROLLER, SECONDARY CHANNEL FAILURE.","options":[{"key":"A","text":"NO EFFECT ON PACK REGULATION BACKUP MODE IS LOST."},{"key":"B","text":"PACK IS LOST."},{"key":"C","text":"NO EFFECT (ALL MODES STILL AVAILABLE)."},{"key":"D","text":"PACK OUTLET TEMPERATURE IS CONTROLLED AT 15 DEG. C."}],"answer":"A","confidence":"h","explanation":"Falla del canal secundario: sin efecto en la regulación, se pierde el modo backup.","fcomRef":"DSC-21-20"},{"id":"aircond-31","n":31,"q":"PACK FLOW CONTROL VALVE:","options":[{"key":"A","text":"IS PNEUMATICALLY OPERATED AND ELECTRICALLY CONTROLLED."},{"key":"B","text":"ELECTRICALLY OPERATED AND PNEUMATICALLY CONTROLLED."},{"key":"C","text":"OPENS AUTOMATICALLY DURING ENGINE STARTING."},{"key":"D","text":"IS SPRING LOADED TO OPEN."}],"answer":"A","confidence":"h","explanation":"La pack flow control valve es neumáticamente operada y eléctricamente controlada.","fcomRef":"DSC-21-20"},{"id":"aircond-32","n":32,"q":"PLACING THE AVIONICS VENTILATION SYSTEM IN THE SMOKE CONFIGURATION:","options":[{"key":"A","text":"OPENS THE #1 GLC."},{"key":"B","text":"OPENS THE CARGO UNDER-FLOOR VALVE."},{"key":"C","text":"OPENS THE #2 GLC."},{"key":"D","text":"DE-ENERGIZES THE BLOWER FAN, EXTRACT FAN RUNS, AND OPENS THE AIR CONDITIONING EXTRACT VALVES."}],"answer":"D","confidence":"m","explanation":"Configuración SMOKE: blower fan se detiene, extract fan sigue, se agrega aire del aire acondicionado (válvulas extract parcialmente abiertas).","fcomRef":"DSC-21-50"},{"id":"aircond-33","n":33,"q":"PLACING THE BLOWER PUSH BUTTON TO OVERRIDE:","options":[{"key":"A","text":"INSURES THE BLOWER FAN WILL CONTINUE TO RUN."},{"key":"B","text":"PLACES THE AVIONICS VENTILATION SYSTEM IN THE OPEN CONFIGURATION."},{"key":"C","text":"DE-ENERGIZES THE BLOWER FAN."},{"key":"D","text":"PLACES THE AVIONICS VENTILATION SYSTEM IN THE CLOSED CONFIGURATION."}],"answer":"C","confidence":"m","explanation":"BLOWER en OVRD: el blower fan se des-energiza; el sistema pasa a configuración cerrada y se agrega aire acondicionado.","fcomRef":"DSC-21-50"},{"id":"aircond-34","n":34,"q":"PLACING THE EXTRACT PUSH BUTTON TO OVERRIDE:","options":[{"key":"A","text":"DE-ENERGIZES THE EXTRACT FAN."},{"key":"B","text":"PLACES THE AVIONICS VENTILATION SYSTEM IN THE CLOSED CONFIGURATION."},{"key":"C","text":"INSURES THE EXTRACT FAN WILL CONTINUE TO BE ENERGIZED."},{"key":"D","text":"PLACES THE AVIONICS VENTILATION SYSTEM IN THE OPEN CONFIGURATION."}],"answer":"C","confidence":"m","explanation":"EXTRACT en OVRD: el extract fan sigue energizado; configuración cerrada y se agrega aire acondicionado.","fcomRef":"DSC-21-50"},{"id":"aircond-35","n":35,"q":"PRESSURIZATION CONTROLLERS RECEIVE INPUTS FROM:","options":[{"key":"A","text":"LGCIU, ADIRU, FMGS, AND EIU."},{"key":"B","text":"LGCIU/'S AND THE MCDU."},{"key":"C","text":"LGCIU/'S AND PITOT STATIC SOURCES."},{"key":"D","text":"MCDU AND LGCIU/'S."}],"answer":"A","confidence":"h","explanation":"Los CPC reciben datos de LGCIU, ADIRU, FMGS y EIU.","fcomRef":"DSC-21-40"},{"id":"aircond-36","n":36,"q":"PRESSURIZATION INDICATIONS ARE FOUND WHICH ECAM PAGE(S)?","options":[{"key":"A","text":"ONLY ON THE CAB PRESS PAGE."},{"key":"B","text":"BLEED PAGE."},{"key":"C","text":"THE INFLIGHT ECAM CRUISE PAGE AND THE CAB PRESS PAGE."},{"key":"D","text":"BOTH A AND B."}],"answer":"C","confidence":"h","explanation":"La presurización se muestra en la página CAB PRESS y en la página CRUISE.","fcomRef":"DSC-21-40"},{"id":"aircond-37","n":37,"q":"PRESSURIZATION IS NORMALLY AUTOMATIC. CAN YOU INTERFERE WITH IT?","options":[{"key":"A","text":"YES, CABIN PRESS MODE SEL TO OVERRIDE AND MAN V/S CTL TOGGLE SWITCH."},{"key":"B","text":"YES, MANUALLY SET LANDING ELEVATION USING THE LND ELEV AUTO SELECTOR."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Se puede intervenir con MODE SEL MAN + MAN V/S CTL, o seleccionando LDG ELEV manualmente.","fcomRef":"DSC-21-40"},{"id":"aircond-38","n":38,"q":"RECIRCULATION FANS IN THE AIR CONDITIONING SYSTEM DIRECT FILTERED CABIN AIR TO WHICH AREA?","options":[{"key":"A","text":"THE PNEUMATIC DUCK, UPSTREAM OF THE PACKS."},{"key":"B","text":"THE AVIONICS COMPARTMENT."},{"key":"C","text":"THE MIXING UNIT."}],"answer":"C","confidence":"h","explanation":"Los recirculation fans envían aire filtrado de cabina a la mixing unit.","fcomRef":"DSC-21-20"},{"id":"aircond-39","n":39,"q":"TEMPERATURE REGULATION FOR THE A-320 IS CONTROLLED BY:","options":[{"key":"A","text":"ONE ZONE CONTROLLER AND TWO PACK CONTROLLERS."},{"key":"B","text":"TWO PACK CONTROLLER AND THE BMC'S."},{"key":"C","text":"THE BMC'S."}],"answer":"A","confidence":"h","explanation":"Un zone controller y dos pack controllers.","fcomRef":"DSC-21-20"},{"id":"aircond-40","n":40,"q":"THE AUTO POSITION OF THE X BLEED SELECTOR OPENS THE CROSSBLEED IF:","options":[{"key":"A","text":"AN ENGINE BLEED VALVE IS OPEN."},{"key":"B","text":"THE APU BLEED VALVE IS OPEN."},{"key":"C","text":"WHEN ENGINE START IS SELECTED."}],"answer":"B","confidence":"h","explanation":"X BLEED en AUTO: la crossbleed abre cuando la APU bleed valve está abierta.","fcomRef":"DSC-36-10"},{"id":"aircond-41","n":41,"q":"THE CREW MAY DIRECTLY CONTROL THE FOLLOWING BLEED VALVES:","options":[{"key":"A","text":"ENGINE, ENGINE HIGH PRESSURE, APU."},{"key":"B","text":"ENGINE, INTERMEDIATE PRESSURE, APU."},{"key":"C","text":"ENGINE, APU, CROSSBLEED."}],"answer":"C","confidence":"h","explanation":"La tripulación controla directamente: ENG BLEED, APU BLEED y X BLEED.","fcomRef":"DSC-36-10"},{"id":"aircond-42","n":42,"q":"THE HOT AIR VALVE PUSH BUTTON CONTROLS:","options":[{"key":"A","text":"THE TRIM AIR VALVE."},{"key":"B","text":"THE HOT AIR MANIFOLD."},{"key":"C","text":"THE ENGINE BLEED VALVES."},{"key":"D","text":"THE PACK FLOW CONTROL VALVES."}],"answer":"B","confidence":"m","explanation":"El pb HOT AIR controla la hot air pressure regulating valve, que alimenta el hot air manifold (trim air).","fcomRef":"DSC-21-20"},{"id":"aircond-43","n":43,"q":"THE LAVATORY/GALLEY EXTRACT FAN OPERATES:","options":[{"key":"A","text":"ONLY ON THE GROUND."},{"key":"B","text":"ONLY IN FLIGHT."},{"key":"C","text":"CONTINUOUSLY WHEN ELECTRICAL POWER IS AVAILABLE."}],"answer":"C","confidence":"h","explanation":"El extractor de lavatorios/galleys funciona continuamente con energía eléctrica disponible.","fcomRef":"DSC-21-20"},{"id":"aircond-44","n":44,"q":"THE OUTFLOW VALVE IS POWERED BY:","options":[{"key":"A","text":"ONE OF TWO ELECTRIC MOTORS."},{"key":"B","text":"ONE OF THREE ELECTRIC MOTORS."},{"key":"C","text":"THREE MECHANICALLY LINKED ELECTRIC MOTORS."}],"answer":"B","confidence":"h","explanation":"La outflow valve tiene tres motores eléctricos (2 auto + 1 manual); actúa uno a la vez.","fcomRef":"DSC-21-40"},{"id":"aircond-45","n":45,"q":"THE PURPOSE OF THE SAFETY VALVE IS TO AVOID:","options":[{"key":"A","text":"EXCESSIVE POSITIVE PRESSURE DIFFERENTIAL."},{"key":"B","text":"EXCESSIVE NEGATIVE DIFFERENTIAL."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Las safety valves evitan diferencial positivo excesivo (8,6 psi) y negativo excesivo.","fcomRef":"DSC-21-40"},{"id":"aircond-46","n":46,"q":"THE RAM AIR SWITCH SHOULD BE USED:","options":[{"key":"A","text":"AT ANY TIME."},{"key":"B","text":"ONLY WHEN DIFFERENTIAL PRESSURE IS LESS THAN 1 PSI."},{"key":"C","text":"WHEN DIFFERENTIAL PRESSURE IS MORE THAN 1 PSI."},{"key":"D","text":"ONLY AFTER OUTFLOW VALVE IS FULLY OPENED."}],"answer":"B","confidence":"h","explanation":"RAM AIR: la outflow abre (si está en auto) sólo si ΔP < 1 psi.","fcomRef":"DSC-21-60"},{"id":"aircond-47","n":47,"q":"THE RAM AIR VALVE:","options":[{"key":"A","text":"SHOULD BE OPENED FOR INCREASED VENTILATION WHILE ON THE GROUND."},{"key":"B","text":"WILL OPEN AUTOMATICALLY AFTER ENGINE START."},{"key":"C","text":"SHOULD BE OPENED FOR INCREASED VENTILATION WHILE IN FLIGHT."},{"key":"D","text":"MUST BE MANUALLY ACTIVATED."}],"answer":"D","confidence":"h","explanation":"La ram air valve se acciona manualmente con el pb RAM AIR.","fcomRef":"DSC-21-60"},{"id":"aircond-48","n":48,"q":"THE SAFETY VALVES ARE OPERATED:","options":[{"key":"A","text":"ELECTRICALLY."},{"key":"B","text":"HYDRAULICALLY."},{"key":"C","text":"PNEUMATICALLY."}],"answer":"C","confidence":"h","explanation":"Las safety valves son neumáticas.","fcomRef":"DSC-21-40"},{"id":"aircond-49","n":49,"q":"THE TEMPERATURE OF EACH AIRCRAFT ZONE IS OPTIMIZED BY MEANS OF?","options":[{"key":"A","text":"A HOT AIR PRESSURE REGULATING VALVE."},{"key":"B","text":"A ZONE CONTROL VALVE."},{"key":"C","text":"A TRIM AIR VALVE."},{"key":"D","text":"BOTH A AND B."}],"answer":"C","confidence":"h","explanation":"La temperatura de cada zona se optimiza con su trim air valve.","fcomRef":"DSC-21-20"},{"id":"aircond-50","n":50,"q":"THE THIRD MOTOR (MANUAL) IN THE PRESSURIZATION SYSTEM IS ACTIVATED:","options":[{"key":"A","text":"AUTOMATICALLY IF BOTH AUTOMATIC MOTORS FAIL."},{"key":"B","text":"IN SEQUENCE AFTER EACH LANDING."},{"key":"C","text":"WHEN THE CABIN PRESS MODE SEL SWITCH IS POSITIONED TO MAN."}],"answer":"C","confidence":"h","explanation":"El tercer motor (manual) se activa con MODE SEL en MAN.","fcomRef":"DSC-21-40"},{"id":"aircond-51","n":51,"q":"THE VENT FAN RUNS ANY TIME THERE IS A NORMAL SHIPS POWER AND THE ISOLATION VALVES ARE OPEN.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"El extract fan del cargo AFT funciona con energía normal y las válvulas de aislación abiertas.","fcomRef":"DSC-21-30"},{"id":"aircond-52","n":52,"q":"TO ENABLE RAM AIR TO THE MIXTER UNIT, THE RAM AIR SWITCH SHOULD BE USED:","options":[{"key":"A","text":"AT ANY TIME."},{"key":"B","text":"ONLY WHEN DIFFERENTIAL PRESSURE IS LESS THAN 1 PSI."},{"key":"C","text":"WHEN PRESSURE IS GREATER THAN 1 PSI DIFF."},{"key":"D","text":"ONLY AFTER OUTFLOW VALVE IS FULLY OPENED."}],"answer":"B","confidence":"h","explanation":"Ram air: usar sólo con ΔP < 1 psi.","fcomRef":"DSC-21-60"},{"id":"aircond-53","n":53,"q":"TRANSFER BETWEEN THE TWO CABIN PRESSURE CONTROLLERS IS:","options":[{"key":"A","text":"ACCOMPLISHED WITH A SWITCH OVERHEAD."},{"key":"B","text":"AUTOMATIC AFTER LANDING OR IN CASE THE OPERATING CONTROLLER FAILS."},{"key":"C","text":"AUTOMATICALLY AT EACH TAKEOFF."}],"answer":"B","confidence":"h","explanation":"Transferencia automática entre CPC 70 s después de cada aterrizaje o por falla del controlador activo.","fcomRef":"DSC-21-40"},{"id":"aircond-54","n":54,"q":"TRIM AIR VALVE, EACH ONE OPTIMIZES THE TEMPERATURE BY:","options":[{"key":"A","text":"ADDING HOT AIR."},{"key":"B","text":"ADDING FRESH AIR."},{"key":"C","text":"MODULATION OF PACK FLOW."},{"key":"D","text":"ADDING RECIRCULATED AIR."}],"answer":"A","confidence":"h","explanation":"Cada trim air valve optimiza la temperatura agregando aire caliente.","fcomRef":"DSC-21-20"},{"id":"aircond-55","n":55,"q":"TRIM AIR VALVES ARE MODULATED BY:","options":[{"key":"A","text":"THE ZONE CONTROLLER."},{"key":"B","text":"ANTI-ICE VALVE."},{"key":"C","text":"HOT AIR PRESSURE REGULATING VALVE."}],"answer":"A","confidence":"h","explanation":"Las trim air valves son moduladas por el zone controller.","fcomRef":"DSC-21-20"},{"id":"aircond-56","n":56,"q":"UNDER WHAT CONDITIONS SHOUD THE PACK FLOW CONTROLLER BE SET TO HIGH?","options":[{"key":"A","text":"IN COLD CONDITIONS TO ACHIEVE A HIGHER CABIN TEMPERATURE RANGE."},{"key":"B","text":"WITH A LOW PASSENGER LOAD TO INCREASE CABIN AIR FLOW."},{"key":"C","text":"WITH A HIGH PASSENGER LOAD IN HOT CONDITIONS IN ORDER TO HELP REDUCE THE CABIN TEMPERATURE."}],"answer":"C","confidence":"h","explanation":"HI: alta carga de pasajeros con clima cálido/húmedo (o smoke removal).","fcomRef":"DSC-21-20"},{"id":"aircond-57","n":57,"q":"UNDER WHAT CONDITIONS SHOULD THE PACK FLOW CONTROLLER BE SET TO LOW?","options":[{"key":"A","text":"WITH A LOW PASSENGER LOAD TO REDUCE BLEED AIR DEMAND AND IMPROVE FUEL EFFICIENCY."},{"key":"B","text":"WITH A HIGH PASSENGER LOAD TO REDUCE CABIN TEMPERATURE."},{"key":"C","text":"IN COLD CONDITIONS TO ACHIEVE A HIGHER CABIN TEMPERATURE RANGE."},{"key":"D","text":"WITH A LOW PASSENGER LOAD TO INCREASE CABIN TEMPERATURE."}],"answer":"A","confidence":"h","explanation":"LO: baja carga de pasajeros, reduce demanda de bleed y consumo.","fcomRef":"DSC-21-20"},{"id":"aircond-58","n":58,"q":"WHAT ARE THE DIFFERENT SOURCES OF AIR FOR AIR CONDITIONING AND PRESSURIZATION?","options":[{"key":"A","text":"ENGINE BLEED AIR."},{"key":"B","text":"ENGINE BLEED AIR AND RECIRCULATED AIR."},{"key":"C","text":"ENGINE BLEED AIR AND RECIRCULATED AIR, OR IF SELECTED, APU BLEED AIR AND RECIRCULATED AIR."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"C","confidence":"h","explanation":"Bleed de motores + aire recirculado, o bleed de APU + recirculado.","fcomRef":"DSC-21-10"},{"id":"aircond-59","n":59,"q":"WHAT HAPPENS TO THE OUTFLOW VALVE WHEN THE RAM AIR SWITCH IS SELECTED ON?","options":[{"key":"A","text":"THE OUTFLOW VALVE OPENS IMMEDIATELY."},{"key":"B","text":"THE OUTFLOW VALVE OPENS IF CABIN DIFFERENTIAL PRESSURE IS LESS THAN 1 PSI."},{"key":"C","text":"NORMAL OUTFLOW VALVE CONTROL IS MAINTAINED."}],"answer":"B","confidence":"h","explanation":"La outflow valve abre (en AUTO) sólo si ΔP < 1 psi.","fcomRef":"DSC-21-60"},{"id":"aircond-60","n":60,"q":"WHAT HAPPENS TO THE PACK FLOW CONTROL VALVES DURING ENGINE START?","options":[{"key":"A","text":"THEY MUST BE SELECTED OFF."},{"key":"B","text":"THEY MUST BE SELECTED OFF ON COLD DAYS ONLY."},{"key":"C","text":"THEY MUST BE SELECTED OFF ON HOT DAYS ONLY."},{"key":"D","text":"THEY AUTOMATICALLY CLOSE."}],"answer":"D","confidence":"h","explanation":"Las pack valves cierran automáticamente durante el arranque de motores.","fcomRef":"DSC-21-20"},{"id":"aircond-61","n":61,"q":"WHAT HAPPENS WHEN A TEMPERATURE SELECTOR ROTARY KNOB IS ADJUSTED?","options":[{"key":"A","text":"A SIGNAL IS SENT TO THE ZONE CONTROLLER REQUESTING A DIFFERENT TEMPERATURE."},{"key":"B","text":"NOTHING AS THERE IS NO RELATIONSHIP BETWEEN A TEMPERATURE SELECTOR KNOB AND THE TRIM AIR VALVE."},{"key":"C","text":"THE ASSOCIATED TRIM AIR VALVE IMMEDIATELY MOVES TO A DIFFERENT POSITION."}],"answer":"A","confidence":"h","explanation":"El selector envía una señal al zone controller pidiendo otra temperatura.","fcomRef":"DSC-21-20"},{"id":"aircond-62","n":62,"q":"WHAT IS THE FUNCTION OF THE PACK FLOW SELECTOR?","options":[{"key":"A","text":"ALLOWS THE PILOT TO INCREASE PACK FLOW BUT WILL NOT ALLOW A MANUAL DECREASE IN FLOW IF NEEDED BY THE AIRCRAFT DEMANDS."},{"key":"B","text":"ALWAYS ALLOWS HIGH FLOW REGARDLESS OF SWITCH POSITION WHEN THE APU IS USED FOR AIR CONDITIONING."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"m","explanation":"El selector permite aumentar flujo; el sistema puede pasar a HIGH automáticamente (APU, demanda) sin importar la posición.","fcomRef":"DSC-21-20"},{"id":"aircond-63","n":63,"q":"WHAT IS THE FUNCTION OF THE RAM AIR VALVE?","options":[{"key":"A","text":"VENTILATION WHILE ON THE GROUND."},{"key":"B","text":"EMERGENCY SMOKE REMOVAL AND VENTILATION IN THE EVENT LF DUAL PACK FAILURE."},{"key":"C","text":"AVIONICS COOLING."},{"key":"D","text":"CARGO VENTILATION & AVIONICS COOLING."}],"answer":"B","confidence":"h","explanation":"Ram air: ventilación de emergencia y evacuación de humo ante falla de ambos packs.","fcomRef":"DSC-21-60"},{"id":"aircond-64","n":64,"q":"WHAT IS THE MAXIMUN ALTITUDE ASSOCIATED WITH THE PRESSURIZATION SYSTEM?","options":[{"key":"A","text":"39.100 FEET."},{"key":"B","text":"39.800 FEET."},{"key":"C","text":"41.000 FEET."},{"key":"D","text":"41.100 FEET."}],"answer":"B","confidence":"h","explanation":"Altitud máxima operativa: 39.800 ft.","fcomRef":"LIM-21"},{"id":"aircond-65","n":65,"q":"WHAT IS THE MAX. NEGATIVE DIFF. PRESSURE FOR THE CABIN?","options":[{"key":"A","text":"0 PSI."},{"key":"B","text":"1 PSI."},{"key":"C","text":"2 PSI."},{"key":"D","text":"8.6 PSI."}],"answer":"B","confidence":"h","explanation":"Diferencial negativo máximo: −1 psi.","fcomRef":"LIM-21"},{"id":"aircond-66","n":66,"q":"WHAT IS THE NORM. MAX. CABIN ALTITUDE?","options":[{"key":"A","text":"8,000 FT."},{"key":"B","text":"9,550 FT +/-350 FT."},{"key":"C","text":"14,000 FT."},{"key":"D","text":"800 FT."}],"answer":"A","confidence":"h","explanation":"Altitud de cabina normal máxima: 8.000 ft.","fcomRef":"DSC-21-40"},{"id":"aircond-67","n":67,"q":"WHAT LIMITATION IS ASSOCIATED WITH THE RAM AIR VALVE?","options":[{"key":"A","text":"DO NOT OPEN IF CABIN PRESSURE IS GREATER THAN 1 PSI."},{"key":"B","text":"ONLY OPEN WHILE ON THE GROUND."},{"key":"C","text":"WILL NOT OPEN IF THE DITCHING SWITCH IS OFF."},{"key":"D","text":"OPERATION IS AUTOMATIC."}],"answer":"A","confidence":"h","explanation":"No abrir la ram air si el ΔP es mayor a 1 psi.","fcomRef":"DSC-21-60"},{"id":"aircond-68","n":68,"q":"WHAT POSITION DO THE PACK VALVES GO TO IN THE EVENT OF A LOSS OF THE BLEED SYSTEM PRESSURE?","options":[{"key":"A","text":"THEY REMAIN IN THEIR LAST POSITION."},{"key":"B","text":"FULL OPEN."},{"key":"C","text":"MID POSITION."},{"key":"D","text":"CLOSED."}],"answer":"D","confidence":"h","explanation":"Sin presión de bleed, las pack valves cierran (spring-loaded closed).","fcomRef":"DSC-21-20"},{"id":"aircond-69","n":69,"q":"WHEN ADDITIONA PNEUMATIC AIR IS REQUIRED FOR ANTI-ICE, ENGINE STARTING, OR AIR CONDITIONING:","options":[{"key":"A","text":"THE CREW MUST ADJUST A MINIMUN EPR SETTING."},{"key":"B","text":"ADITIONAL PNEUMATIC AIR WILL BE REQUESTED BY THE BMC TO THE FADEC´S OR THE APU."},{"key":"C","text":"BOTH A AND B ARE CORRECT."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"B","confidence":"h","explanation":"El BMC/sistema solicita más aire a los FADEC (aumento de idle) o al APU.","fcomRef":"DSC-36-10"},{"id":"aircond-70","n":70,"q":"WHEN APU IS SUPPLYING THE PACKS, THE PACK CONTROLLER SENDS A DEMAND SIGNAL TO INCREASE AIRFLOW WHEN A ZONE TEMPERATURE CANNOT BE SATISFIED. THIS SIGNAL IS SENT TO THE:","options":[{"key":"A","text":"PACK RAM AIR INLET FLAP."},{"key":"B","text":"APU ECB."},{"key":"C","text":"PACK OUTFLOW CONTROL VALVE."}],"answer":"B","confidence":"h","explanation":"Con APU, la demanda de mayor flujo se envía a la ECB del APU.","fcomRef":"DSC-21-20"},{"id":"aircond-71","n":71,"q":"WHEN DOES NORMAL DEPRESSURIZATION OCCUR?","options":[{"key":"A","text":"100 FEET AGL ABOVE TOUCHDOWN."},{"key":"B","text":"IT IS COMPLETE THREE MINUTES AFTER TOUCHDOWN."},{"key":"C","text":"AFTER FLAP RETRACTION."},{"key":"D","text":"ON LANDING TOUCHDOWN."}],"answer":"D","confidence":"m","explanation":"En el aterrizaje (touchdown) se libera la presión residual; la outflow abre totalmente tras el aterrizaje.","fcomRef":"DSC-21-40"},{"id":"aircond-72","n":72,"q":"WHEN DOES NORMAL PRESSURIZATION OCCUR?","options":[{"key":"A","text":"AFTER SECOND ENGINE START."},{"key":"B","text":"PRESSURIZATION OCCURS DURING TAXI."},{"key":"C","text":"PRESSURIZATION OCCURS DURING THE TAKEOFF ROLL."},{"key":"D","text":"AFTER RATATION."}],"answer":"C","confidence":"h","explanation":"Pre-presurización durante la carrera de despegue (modo TO).","fcomRef":"DSC-21-40"},{"id":"aircond-73","n":73,"q":"WHEN EITHER THE BLOWER OR EXTRACT SWITCHES ARE IN OVRD, AIR FROM THE AIR CONDITIONING SYSTEM IS ADDED TO VENTILATION AIR.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Con BLOWER o EXTRACT en OVRD se agrega aire del aire acondicionado al circuito de ventilación.","fcomRef":"DSC-21-50"},{"id":"aircond-74","n":74,"q":"WHEN LANDING ELEVATION IS SET TO AUTO, THE LANDING ELEVATION IS SENT TO THE CONTROLLER FROM:","options":[{"key":"A","text":"FMGS."},{"key":"B","text":"FCU."},{"key":"C","text":"ADIRS."}],"answer":"A","confidence":"h","explanation":"En AUTO la elevación de aterrizaje viene del FMGS.","fcomRef":"DSC-21-40"},{"id":"aircond-75","n":75,"q":"WHEN THE PACK FLOW CONTROL KNOB IS POSITIONED TO HI, AIR FLOW IS:","options":[{"key":"A","text":"80% OF NORMAL RATE."},{"key":"B","text":"100% OF NORMAL RATE."},{"key":"C","text":"120% OF NORMAL RATE."},{"key":"D","text":"150% OF NORMAL RATE."}],"answer":"C","confidence":"h","explanation":"HI = 120% del flujo normal.","fcomRef":"DSC-21-20"},{"id":"aircond-76","n":76,"q":"WHEN WOULD YOU SELECT PACK FLOW TO HI?","options":[{"key":"A","text":"SMOKE REMOVAL OR HOT/HUMID CONDITIONS."},{"key":"B","text":"WHEN PASSENGERS ARE COMPLAINING IT IS TOO COLD."},{"key":"C","text":"ABOVE FL 350."},{"key":"D","text":"ABOVE FL 250."}],"answer":"A","confidence":"h","explanation":"HI: evacuación de humo o condiciones calurosas/húmedas.","fcomRef":"DSC-21-20"},{"id":"aircond-77","n":77,"q":"WHEN WOULD YOU SELECT RAM AIR ON?","options":[{"key":"A","text":"IF ADDITIONAL COOLING IS REQUIRED ON THE GROUND."},{"key":"B","text":"DUAL PACKS FAILURE OR SMOKE REMOVAL."},{"key":"C","text":"WHEN PACK TEMPERATURES ARE TOO HIGH."},{"key":"D","text":"WHEN THERE IS SMOKE IN THE CABIN."}],"answer":"B","confidence":"h","explanation":"RAM AIR ON: falla de ambos packs o evacuación de humo.","fcomRef":"DSC-21-60"},{"id":"aircond-78","n":78,"q":"WHICH CONFIGURATION IS THE AVIONICS VENTILATION SYSTEM IN WHILE AIRBORNE WITH NO ABNORMALS PRESENT?","options":[{"key":"A","text":"OPEN."},{"key":"B","text":"SMOKE."},{"key":"C","text":"FIRE."},{"key":"D","text":"CLOSED."}],"answer":"D","confidence":"h","explanation":"En vuelo normal: configuración CERRADA.","fcomRef":"DSC-21-50"},{"id":"aircond-79","n":79,"q":"WHICH OF THE FOLLOWING STATEMENTS IS CORRECT CONCERNING CONDITIONED AIR?","options":[{"key":"A","text":"CONDITIONED AIR AND TRIM AIR ARE MIXED THEN DISTRIBUTED TO EACH ZONE."},{"key":"B","text":"RECIRCULATED AIR, CONDITIONED AND HOT TRIM ARE MIXED THEN DISTRIBUTED TO EACH ZONE."},{"key":"C","text":"HOT TRIM AIR IS ADDED TO THE MIXING UNIT BEFORE DISTRIBUCION TO EACH ZONE."},{"key":"D","text":"RECIRCULING FANS DRAW CABIN AIR TO A MIXING UNIT WHERE CONDITIONED AIR IS ADDED."}],"answer":"D","confidence":"h","explanation":"Los recirculation fans llevan aire de cabina a la mixing unit donde se mezcla con aire de los packs; el hot trim air se agrega aguas abajo por zona.","fcomRef":"DSC-21-20"},{"id":"aircond-80","n":80,"q":"WHICH STATEMENT IS CORRECT REGARDING ILLUMINATION OF THE AMBER AFT ISOL VALVE FAULT LIGHT?","options":[{"key":"A","text":"AUTOMATICALLY CLOSES THE AFT CARGO COMPARTMENT ISOLATION VALVES."},{"key":"B","text":"MEANS THAT EITHER THE INLET OR OUTLET ISOLATION VALVE(S) DISAGREES WITH THE SWITCH POSITION."},{"key":"C","text":"INDICATES THAT THE EXTRACT FAN HAS STOPPED."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"B","confidence":"h","explanation":"AFT ISOL VALVE FAULT: posición de válvula inlet u outlet en desacuerdo con el pb.","fcomRef":"DSC-21-30"},{"id":"aircond-81","n":81,"q":"WHICH STATEMENT IS TRUE CONCERNING THE CARGO COMPARTMENT VINTILATION?","options":[{"key":"A","text":"BOTH CARGO COMPARTMENTS ARE PRESSURIZED AND HEATED USING BOTH CABIN AIR AND HOT TRIM AIR."},{"key":"B","text":"RECIRCULATED AIR, CONDITIONED AIR, AND HOT TRIM AIR ARE MIXED THEN DISTRIBUTED TO EACH CARGO COMPARTMENT."},{"key":"C","text":"ONLY THE AFT CARGO COMPARTMENT IS HEATED AND VENTILATED. CABIN AMBIENT AIR IS MIXED WITH HOT TRIM AIR AND DRAWN THROUGH ISOLATION VALVES BY EXTRACTION FANS."}],"answer":"C","confidence":"h","explanation":"Sólo el cargo AFT es calefaccionado/ventilado: aire de cabina + hot trim air, aspirado por extract fan a través de válvulas de aislación.","fcomRef":"DSC-21-30"},{"id":"aircond-82","n":82,"q":"WHITH THE APU RUNNING, THE APU BLEED PUSH BUTTON SELECTED ON AND THE X BLEED SELECTOR TO AUTO, THE APU WILL:","options":[{"key":"A","text":"ONLY SUPPLY BLEED AIT TO LEFT SIDE."},{"key":"B","text":"SUPPLY PENEUMATIC AIR TO BOTH SIDES OF THE AIRCRAFT BECAUSE THE PNEUMATIC CROSSBLED VALVE AUTOMATICALLY OPENS."},{"key":"C","text":"WILL SUPPLY BLEED AIR ONLY TO THE LEFT SIDE UNLESS THE X BLEED SELECTOR IS SELECTED OPEN."},{"key":"D","text":"ONLY SUPPLY BLEED AIR TO THE RIGHT SIDE."}],"answer":"B","confidence":"h","explanation":"Con X BLEED en AUTO y APU bleed abierta, la crossbleed abre: el APU alimenta ambos lados.","fcomRef":"DSC-36-10"},{"id":"aircond-83","n":83,"q":"WITH APU BLEED ON AND ENGINE BLEED SWITCHES ON WITH ENGINES RUNNING. WHAT IS THE POSITION OF THE ENGINE BLEED VALVES?","options":[{"key":"A","text":"CLOSED."},{"key":"B","text":"OPEN."},{"key":"C","text":"DEPENDS ON THE CROSSBLEED SELECTOR."}],"answer":"A","confidence":"h","explanation":"Con APU bleed abierta, las engine bleed valves cierran automáticamente.","fcomRef":"DSC-36-10"},{"id":"aircond-84","n":84,"q":"WITH THE LOSS OF PNEUMATIC SYSTEM PRESSURE, THE ENGINE BLEED VALVE WILL:","options":[{"key":"A","text":"REMAIN IN IT'S CURRENT POSITION."},{"key":"B","text":"ASSUME THE CLOSED POSITION."},{"key":"C","text":"ASSUME THE OPEN POSITION."},{"key":"D","text":"ASSUME THE MID POSITION."}],"answer":"B","confidence":"h","explanation":"Sin presión, la engine bleed valve (spring-loaded) cierra.","fcomRef":"DSC-36-10"},{"id":"aircond-85","n":85,"q":"WITH THE PRESSURIZATION SYSTEM IN THE AUTOMATIC MODE, WHICH VALVES ARE CLOSED WHEN THE DITCHING PUSH BUTTON IS SELECTED ON?","options":[{"key":"A","text":"ALL VALVES BELOW THE WATER LINE."},{"key":"B","text":"APU INLET."},{"key":"C","text":"ONLY THE AVONICS COOLING VALVES."},{"key":"D","text":"THE ENGINE BLEED VALVES."}],"answer":"A","confidence":"h","explanation":"DITCHING cierra la outflow valve, ram air inlet, ventilación de aviónica y pack flow valves: todas las válvulas bajo la línea de flotación.","fcomRef":"DSC-21-40"}]},{"id":"autoflight","name":"AUTO FLIGHT & FMS NAV","nameEs":"Vuelo automático y FMS","questions":[{"id":"autoflight-1","n":1,"q":"ALL NAV AID ARE NORMALLY AUTO TUNED BY:.","options":[{"key":"A","text":"THE FMGC."},{"key":"B","text":"MCDU."},{"key":"C","text":"ADIRU."}],"answer":"A","confidence":"h","explanation":"Las radioayudas se sintonizan automáticamente por el FMGC (radio navigation function).","fcomRef":"DSC-22_20"},{"id":"autoflight-2","n":2,"q":"ALL NAVAIDS ARE NORMALLY AUTO TUNED BY:","options":[{"key":"A","text":"THE FMGC."},{"key":"B","text":"MCDU."},{"key":"C","text":"ADIRU."}],"answer":"A","confidence":"h","explanation":"Las radioayudas se sintonizan automáticamente por el FMGC.","fcomRef":"DSC-22_20"},{"id":"autoflight-3","n":3,"q":"ALL PFD DISPLAYS EXCEPT ATTITUDE; SPEED; HEADING; ALTITUDE; AND VERTICAL SPEED ARE REMOVED WHEN PITCH ATTITUDE EXCEEDS 25 DEGREES NOSE UP OR 13 DEGREES NOSE DOWN.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Con actitud anormal (pitch > 25° arriba o > 13° abajo, bank > 45°) el PFD se simplifica: sólo actitud, velocidad, rumbo, altitud y V/S.","fcomRef":"DSC-31-40"},{"id":"autoflight-4","n":4,"q":"AMBER BOX PROMTS ON THE MCDU INDICATE DATA:","options":[{"key":"A","text":"ENTRY IS OPTIONAL FOR FMGS OPERATION."},{"key":"B","text":"ENTRY IS REQUIRED FOR MINIMUM FMGS OPERATION."},{"key":"C","text":"WILL BE FILLED IN BY THE FMGS."}],"answer":"B","confidence":"h","explanation":"Cajas ámbar = dato obligatorio para la operación mínima del FMGS.","fcomRef":"DSC-22_20"},{"id":"autoflight-5","n":5,"q":"AN AMBER BOX ON THE MCDU SCREEN INDICATES:","options":[{"key":"A","text":"AN OPTIONAL DATA ENTRY."},{"key":"B","text":"A MANDATORY DATA ENTRY."},{"key":"C","text":"A COMPULSORY REPORTING POINT."},{"key":"D","text":"THE WAYPOINT INDICATED WILL BE OVER FLOWN."}],"answer":"B","confidence":"h","explanation":"Caja ámbar = entrada de dato obligatoria.","fcomRef":"DSC-22_20"},{"id":"autoflight-6","n":6,"q":"AN FMGS MESSAGE WHICH REQUIRES IMMEDIATE ATTENTION IS DISPLAYED IN:","options":[{"key":"A","text":"RED."},{"key":"B","text":"AMBER."},{"key":"C","text":"MAGENTA."}],"answer":"B","confidence":"h","explanation":"Mensajes ámbar = importantes, requieren atención inmediata; blancos = menor importancia.","fcomRef":"DSC-22_20"},{"id":"autoflight-7","n":7,"q":"APPR PB. IS USED TO ARM/ENGAGE THE GUIDANCE MODES RELATED TO THE APPROACH:","options":[{"key":"A","text":"SELECTED ON THE NAVIGATION RADIOS."},{"key":"B","text":"INSERTED INTO THE FLIGHT PLAN (ILS ONLY)."},{"key":"C","text":"INSERTED INTO THE FLIGHT PLAN (ILS OR NON ILS)."}],"answer":"C","confidence":"h","explanation":"APPR arma/engancha los modos de aproximación insertada en el plan de vuelo (ILS o no-ILS).","fcomRef":"DSC-22_30"},{"id":"autoflight-8","n":8,"q":"BOTH AUTOPILOTS CAN BE ENGAGED AND ACTIVE IN ANY PHASE OF FLIGHT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Ambos AP sólo pueden estar enganchados con LOC/APPR armado o enganchado, o en go-around.","fcomRef":"DSC-22_30"},{"id":"autoflight-9","n":9,"q":"BOX PROMPTS ON THE MCDU INDICATE DATA:","options":[{"key":"A","text":"ENTRY IS OPTIONAL FOR FMGS OPERATION."},{"key":"B","text":"ENTRY IS REQUIRED FOR MINIMUM FMGS OPERATION."},{"key":"C","text":"WILL BE FILLED IN BY THE FMGS."}],"answer":"B","confidence":"h","explanation":"Box prompts (cajas) = dato requerido para la operación mínima del FMGS.","fcomRef":"DSC-22_20"},{"id":"autoflight-10","n":10,"q":"CAN THE AUTOPILOT BE USED FOR A SINGLE ENGINE APPROACH AND AUTO LAND?","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."}],"answer":"A","confidence":"h","explanation":"Sí: autoland y aproximación monomotor están certificados.","fcomRef":"LIM-22"},{"id":"autoflight-11","n":11,"q":"CAN THE CREW DEPRESS THE RMP ON NAV PUSHBUTTON AND USE THE RMP FOR NAVIGATION SIMULTANEOUSLY WITH FMGC AUTO TUNING?","options":[{"key":"A","text":"YES, BECAUSE THE OPPOSITE FMGC WILL CONTINUE TO AUTO TUNE NAVAIDS."},{"key":"B","text":"NO, RMP BACKUP TUNING SUPERSEDES THE AUTO TUNING FUNCTION OF BOTH FMGC\\'S."}],"answer":"B","confidence":"h","explanation":"Con RMP en NAV (backup tuning) se inhibe la sintonía automática de ambos FMGC.","fcomRef":"DSC-23"},{"id":"autoflight-12","n":12,"q":"COST INDEX = 0 (ZERO) CORRESPONDS TO:","options":[{"key":"A","text":"MINIMUM FUEL CONSUMPTION (MAX RANGE)."},{"key":"B","text":"MINIMUM TIME."},{"key":"C","text":"BEST RATIO BETWEEN THE FLIGHT TIME COST AND THE FUEL COST."},{"key":"D","text":"LRC (LONG RANGE CRUISE)."}],"answer":"A","confidence":"h","explanation":"CI = 0: mínimo consumo de combustible (máximo alcance).","fcomRef":"DSC-22_20"},{"id":"autoflight-13","n":13,"q":"DASHES ON THE MCDU INDICATE DATA:","options":[{"key":"A","text":"ENTRY IS NOT ALLOWED."},{"key":"B","text":"IS BEING CALCULATED BY THE FMGS."},{"key":"C","text":"EITHER A OR B."}],"answer":"C","confidence":"m","explanation":"Guiones: el dato no puede ingresarse o todavía no fue calculado por el FMGS.","fcomRef":"DSC-22_20"},{"id":"autoflight-14","n":14,"q":"DURING A TURNAROUND, YOU NOTICE THAT THERE IS A RESIDUAL GROUND SPEED ON BOTH NDS. HOW DO YOU CORRECT THIS?","options":[{"key":"A","text":"AS THE ENGINES HAVE BEEN SHUT DOWN, IT IS NECESSARY TO CARRY OUT A FULL REALIGNMENT."},{"key":"B","text":"THERE IS NO CORRECTIVE ACTION POSSIBLE UNTIL THE AIRCRAFT IS COMPLETELY ELECTRICALLY SHUT DOWN."},{"key":"C","text":"IT IS POSSIBLE TO CARRY OUT A RAPID ALIGNMENT BY TURNING OFF ALL 3 ADIRS MOMENTARILY."}],"answer":"C","confidence":"h","explanation":"Velocidad residual en el ND: se corrige con alineación rápida (los 3 ADIRS en OFF y de nuevo a NAV en menos de 5 s).","fcomRef":"DSC-34"},{"id":"autoflight-15","n":15,"q":"DURING DESCENT, IF YOU PUSH THE EXPEDITE (EXPED) PUSH BUTTON, WHAT SPEED WILL THE AIRCRAFT TRY TO MAINTAIN?","options":[{"key":"A","text":"GREEN DOT."},{"key":"B","text":"340 KNOTS."},{"key":"C","text":"3.000 FPM VERTICAL SPEED."},{"key":"D","text":"STANDARD 3.0 DEGREES ANGLE OF DESCENT."}],"answer":"B","confidence":"h","explanation":"EXPED en descenso: objetivo de velocidad 340 kt / M .80.","fcomRef":"DSC-22_30"},{"id":"autoflight-16","n":16,"q":"FMGC 1 IS NOT WORKING. TO ENTER DATA INTO THE FMGC, WHICH MCDU WOULD YOU USE?","options":[{"key":"A","text":"MCDU 1 ON THE CAPTAIN\\'S SIDE."},{"key":"B","text":"MCDU 2 ON THE FIRST OFFICER\\'S SIDE."},{"key":"C","text":"EITHER MCDU 1 OR MCDU 2."}],"answer":"C","confidence":"m","explanation":"Con FMGC1 inoperativo ambos MCDU trabajan con el FMGC2 (modo single); se puede usar cualquiera de los dos.","fcomRef":"DSC-22_20"},{"id":"autoflight-17","n":17,"q":"FOR AUTOLAND, BOTH A/PS MUST BE CONNECTED.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: el autoland está aprobado con un solo AP (CAT II/CAT III single).","fcomRef":"LIM-22"},{"id":"autoflight-18","n":18,"q":"GPWS AURAL AND VISUAL WARNINGS CAN NOT BE INHIBITED.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: los avisos GPWS pueden inhibirse con los pb del panel GPWS.","fcomRef":"DSC-34"},{"id":"autoflight-19","n":19,"q":"HOW DOES THE FMGC COMPUTE RADIO POSITION?","options":[{"key":"A","text":"IRS ONLY."},{"key":"B","text":"IRS AND VOR/DME."},{"key":"C","text":"IRS, DME/DME."},{"key":"D","text":"VOR/DME AND DME/DME."}],"answer":"D","confidence":"m","explanation":"La posición radio se calcula con DME/DME o VOR/DME (luego se mezcla con IRS = MIX IRS).","fcomRef":"DSC-22_20"},{"id":"autoflight-20","n":20,"q":"IF ONE GPS RECEIVER FAILS, THE THREE ADIRUS AUTOMATICALLY SELECT THE ONLY OPERATIVE GPS RECEIVER.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Si un receptor GPS falla, las tres ADIRU seleccionan automáticamente el GPS operativo.","fcomRef":"DSC-34"},{"id":"autoflight-21","n":21,"q":"IF THE FLEX TEMP IS NOT ENTERED ON THE TAKEOFF PAGE OF THE MCDU:","options":[{"key":"A","text":"A FLEX TAKEOFF STILL AVAILABLE, SET POWER WITH THE THRUST LEVERS."},{"key":"B","text":"THE FMGS WILL ENTER IT FOR YOU BASED ON TAT."},{"key":"C","text":"A FLEX TAKEOFF IS NOT AVAILABLE."}],"answer":"C","confidence":"h","explanation":"Sin FLX TEMP ingresada no hay despegue FLEX disponible.","fcomRef":"DSC-22_30"},{"id":"autoflight-22","n":22,"q":"IF THE SPD/MACH KNOB ON THE FCU IS NOT PULLED WITHIN A PREDETERMINED TIME TO ENGAGE SELECTED SPEED:","options":[{"key":"A","text":"THE SELECTION CAN BE MADE AT ANY TIME."},{"key":"B","text":"THE SELECTION IS LOST AND DASHES ARE RE-DISPLAYED."},{"key":"C","text":"THE SELECTION IS LOST AND THE DISPLY GOES BLANK."}],"answer":"B","confidence":"h","explanation":"Si el knob no se tira en ~10 s, la selección se pierde y vuelven los guiones.","fcomRef":"DSC-22_30"},{"id":"autoflight-23","n":23,"q":"IF THE SPD/MACH KNOB ON THE FCU IS NOT PULLED WITHIN A PREDETERMINED TIME TO ENGAGE SELECTED SPEED.","options":[{"key":"A","text":"THE SELECTION CAN BE MADE AT ANY TIME."},{"key":"B","text":"THE SELECTION IS LOST AND DASHES ARE RE-DISPLAYED."},{"key":"C","text":"THE SELECTION IS LOST AND THE DISPLAY GOES BLANK."}],"answer":"B","confidence":"h","explanation":"Si el knob no se tira en ~10 s, la selección se pierde y vuelven los guiones.","fcomRef":"DSC-22_30"},{"id":"autoflight-24","n":24,"q":"IF YOU HAVE DEPRESSED THE EXPED PUSH BUTTON AND WANT TO CANCEL THIS FUNCTION, HOW COULD THIS BE ACCOMPLISHED?","options":[{"key":"A","text":"PUSH THE EXPED PUSH BUTTON AGAIN."},{"key":"B","text":"PULL THE ALTITUDE, VERTICAL SPEED, OR SPEED KNOB."},{"key":"C","text":"RETARD THE THRUST LEVERS TO IDLE."}],"answer":"B","confidence":"m","explanation":"EXPED se cancela enganchando otro modo vertical (tirando el knob de ALT, V/S o SPD).","fcomRef":"DSC-22_30"},{"id":"autoflight-25","n":25,"q":"ILS 1 INFORMATION IS DISPLAYED ON _______ WHEN OPERATING IN THE ROSE ILS MODE:","options":[{"key":"A","text":"PFD 2 & ND1."},{"key":"B","text":"PFD 1 & ND1."},{"key":"C","text":"PFD 1 & ND2."}],"answer":"C","confidence":"m","explanation":"En ROSE ILS el ND muestra el ILS del lado opuesto: ILS1 aparece en PFD1 y ND2.","fcomRef":"DSC-31-40"},{"id":"autoflight-26","n":26,"q":"IN FLIGHT, EITHER THE AP/FD PITCH CONTROL, OR AUTOTHRUST MAY ACQUIRE AND HOLD A TARGET SPEED OR MACH NUMBER, DEPENDING ON THE ENGAGED MODES. SPEED CONTROL IS \"MANAGED\" WHEN THE TARGET COMES FROM THE SPD/MACH FCU WINDOW.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: es \"managed\" cuando el objetivo viene del FMGS; desde la ventana del FCU es \"selected\".","fcomRef":"DSC-22_30"},{"id":"autoflight-27","n":27,"q":"IN THE EVENT OF FAILURE OF THE AIR DATA FUNCTION OF ADIRS 1 OR 2, THE AFFECTED DISPLAYS CAN BE MANUALLY SELECTED OVER TO ADR 3 BY THE:","options":[{"key":"A","text":"ECAM/ND TRANSFER SELECTOR."},{"key":"B","text":"AIR DATA SELECTOR."},{"key":"C","text":"ATT HDG SELECTOR."}],"answer":"B","confidence":"h","explanation":"El selector AIR DATA permite conmutar a ADR3.","fcomRef":"DSC-34"},{"id":"autoflight-28","n":28,"q":"IN THE EVENT OF FAILURE OF THE AIR DATA FUNCTION OF ADIRU 1 OR 2; THE AFFECTED DISPLAYS CAN BE MANUALLY SELECTED OVER TO ADR 3 BY THE:","options":[{"key":"A","text":"ECAM/ND TRANSFER SELECTOR."},{"key":"B","text":"AIR DATA SELECTOR."},{"key":"C","text":"ATT HDG SELECTOR."}],"answer":"B","confidence":"h","explanation":"El selector AIR DATA permite conmutar a ADR3.","fcomRef":"DSC-34"},{"id":"autoflight-29","n":29,"q":"MANAGED GUIDANCE IS ENGAGED BY:","options":[{"key":"A","text":"PULLING ON THE DESIRED FCU SELECTOR KNOB."},{"key":"B","text":"PUSHING ON THE DESIRED FCU SELECTOR KNOB."},{"key":"C","text":"ROTATING 90º THE DESIRED FCU SELECTOR KNOB."}],"answer":"B","confidence":"h","explanation":"Empujar el knob = guiado managed; tirar = selected.","fcomRef":"DSC-22_30"},{"id":"autoflight-30","n":30,"q":"ONE A/P CAN BE ENGAGED ON THE GROUND IF THE ENGINES ARE NOT RUNNING.","options":[{"key":"A","text":"THIS A/P WILL DISENGAGE WHEN BOTH ENGINES ARE STARTED."},{"key":"B","text":"THIS A/P WILL DISENGAGE WHEN ONE ENGINE IS STARTED."},{"key":"C","text":"THIS A/P WILL DISENGAGE WHEN SPEED IS SENSED AT > 10 KTS."}],"answer":"B","confidence":"m","explanation":"Un AP puede engancharse en tierra con motores detenidos; se desconecta al arrancar un motor.","fcomRef":"DSC-22_30"},{"id":"autoflight-31","n":31,"q":"OPEN CLIMB (OP CLB) IS A MANAGED MODE.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: OP CLB es un modo selected.","fcomRef":"DSC-22_30"},{"id":"autoflight-32","n":32,"q":"RADIO HEIGHT IS DISPLAYED ON THE PFD:","options":[{"key":"A","text":"BELOW 2500´"},{"key":"B","text":"WHEN THE LOC OR APP P/B IS PRESSED."},{"key":"C","text":"WHEN A DECISION HEIGHT IS SELECTED."}],"answer":"A","confidence":"h","explanation":"El radioaltímetro se muestra en el PFD por debajo de 2.500 ft.","fcomRef":"DSC-31-40"},{"id":"autoflight-33","n":33,"q":"SELECTION OF THE CORRECT TAKEOFF RUNWAY ON THE FMGC PRIOR TO EACH FLIGHT IS NECESSARY BECAUSE:","options":[{"key":"A","text":"THE FADEC NEEDS IT TO KNOW HOW MUCH TO REDUCE THE THRUST TO TAKEOFF."},{"key":"B","text":"SELECTION OF THE CORRECT RUNWAY INSURES PROPER PRESSURIZATION."},{"key":"C","text":"SELECTION OF THE CORRECT RUNWAY PERMITS THE FMGS TO UPDATE ITS POSITION AT TAKEOFF."}],"answer":"C","confidence":"h","explanation":"La pista correcta permite al FMGS actualizar su posición al despegue (TO thrust).","fcomRef":"DSC-22_20"},{"id":"autoflight-34","n":34,"q":"SIDESTICK POSITION AND MAX. SIDESTICK DEFLECTION ARE DISPLAYED ON THE GROUND ON THE PFD:","options":[{"key":"A","text":"CONTINUOSLY AFTER AIRCRAFT POWER IS APPLIED."},{"key":"B","text":"AFTER THE FIRST ENGINE START."},{"key":"C","text":"ON TAKEOFF ROLL WHEN POWER IS APPLIED."}],"answer":"B","confidence":"h","explanation":"El símbolo de posición del sidestick aparece en tierra después del arranque del primer motor.","fcomRef":"DSC-31-40"},{"id":"autoflight-35","n":35,"q":"THE A320 HAS ________ AIR DATA INERTIAL REFERENCE UNITS (ADIRS).","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"}],"answer":"B","confidence":"h","explanation":"Tres ADIRU.","fcomRef":"DSC-34"},{"id":"autoflight-36","n":36,"q":"THE AIRSPEED INDICATION ON THE PFD STARTS AT:","options":[{"key":"A","text":"100 KTS."},{"key":"B","text":"80 KTS."},{"key":"C","text":"50 KTS."},{"key":"D","text":"30 KTS."}],"answer":"D","confidence":"h","explanation":"La escala de velocidad comienza en 30 kt.","fcomRef":"DSC-31-40"},{"id":"autoflight-37","n":37,"q":"THE ARMED VERTICAL MODES ARE DISPLAYED ON THE FLIGHT MODE ANNUNCIATOR ON THE SECOND LINE IN:","options":[{"key":"A","text":"BLUE OR MAGENTA."},{"key":"B","text":"BLUE OR GREEN."},{"key":"C","text":"WHITE."}],"answer":"A","confidence":"h","explanation":"Modos armados: azul o magenta, en la segunda línea del FMA.","fcomRef":"DSC-22_30"},{"id":"autoflight-38","n":38,"q":"THE CAPTAIN\\'S FMA INDICATES - FD2 IN COLUMN FIVE, LINE TWO. WHAT DOES THIS MEAN?","options":[{"key":"A","text":"FMGC #1 HAS TIMED OUT AND FLIGHT GUIDANCE IS LOST."},{"key":"B","text":"THE FIRST OFFICER HAS PUSHED THE PRIORITY TAKE OVER PUSHBUTTON."},{"key":"C","text":"FMGC #1 HAS TIMED OUT AND FMGC #2 IS NOW PROVIDING FLIGHT GUIDANCE FOR BOTH PILOTS."},{"key":"D","text":"THE CAPTAIN\\'S FD PUSHBUTTON ON THE FCU HAS NOT BEEN SELECTED \"ON\" AND FD2 HAS AUTOMATICALLY CROSSED OVER."}],"answer":"C","confidence":"m","explanation":"\"-FD2\" (o FD2): el FD del comandante recibe guía del FMGC2 (FMGC1 fallado o FD1 no disponible).","fcomRef":"DSC-22_30"},{"id":"autoflight-39","n":39,"q":"THE ELECTRONIC FLIGHT INSTRUMENT SYSTEM (EFIS) CONSISTS OF ______ IDENTICAL DISPLAY UNITS.","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"8"}],"answer":"C","confidence":"h","explanation":"EFIS + ECAM: seis DU idénticas.","fcomRef":"DSC-31-10"},{"id":"autoflight-40","n":40,"q":"THE ENERGY CIRCLE IS A GREEN ARC, CENTERED ON THE AIRCRAFT'S POSITION AND ORIENTED TOWARDS THE CURRENT TRACK LINE. IT IS DISPLAYED ON THE NDS DURING DESCENT, WHEN HDG TO TRK MODE IS SELECTED.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"El energy circle se muestra en descenso cuando está seleccionado HDG o TRK (enunciado con errata \"to\").","fcomRef":"DSC-31-40"},{"id":"autoflight-41","n":41,"q":"THE ENGAGED VERTICAL MODES ARE DISPLAYED ON THE FLIGHT MODE ANNUNCIATOR ON THE FIRST LINE IN:","options":[{"key":"A","text":"GREEN OR BLUE."},{"key":"B","text":"GREEN OR MAGENTA."},{"key":"C","text":"BLUE."}],"answer":"B","confidence":"h","explanation":"Modos enganchados: verde (o magenta para altitud con restricción) en la primera línea.","fcomRef":"DSC-22_30"},{"id":"autoflight-42","n":42,"q":"THE ENGAGED VERTICAL MODES ARE DISPLAYED ON THE FLIGHT MODE ANNUNCIATOR ON THE FIRST LINE IN:","options":[{"key":"A","text":"GREEN OR BLUE."},{"key":"B","text":"GREEN OR MAGENTA."},{"key":"C","text":"BLUE."}],"answer":"B","confidence":"h","explanation":"Modos enganchados: verde o magenta, primera línea.","fcomRef":"DSC-22_30"},{"id":"autoflight-43","n":43,"q":"THE FMGC HAVE THREE FUNCTIONS.","options":[{"key":"A","text":"ECAM CONTROL, FLIGHT GUIDANCE, FLIHGT MANAGEMENT."},{"key":"B","text":"ECAM CONTROL, EIS CONTROL, FLIGHT MANAGEMENT."},{"key":"C","text":"FLIGHT GUIDANCE, FLIGHT AUGMENTATION, FLIGHT MANAGEMENT."}],"answer":"C","confidence":"h","explanation":"Funciones del FMGC: flight guidance, flight augmentation y flight management.","fcomRef":"DSC-22_10"},{"id":"autoflight-44","n":44,"q":"THE FMGS DATA BASE CONTAINS:","options":[{"key":"A","text":"PERFORMANCE INFORMATION, SUCH AS ENGINE FUEL FLOW, ENGINE THRUST, GREEN DOT DATA (L/D DATA), ETC."},{"key":"B","text":"NAVIGATION INFORMATION, SUCH AS NAVAIDS, WAYPOINTS, AIRWAYS, AIRPORTS, RUNWAYS, ETC."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"La base contiene datos de navegación y de performance.","fcomRef":"DSC-22_20"},{"id":"autoflight-45","n":45,"q":"THE IR ALIGNMENT COUNT DOWN STOPS ONE MINUTE PRIOR TO ACCOMPLISHMENT AND THE ALIGN LIGHTS ARE FLASHING. WHY DOES IT HAPPEN?","options":[{"key":"A","text":"IT IS AN INDICATION THAT THERE IS A DISAGREEMENT BETWEEN THE IRS AND THE ALIGNMENT MUST BE RESTARTED."},{"key":"B","text":"IT IS AN INDICATION THAT THE ALIGNMENT IS COMPLETE BUT MUST BE ACKNOWLEDGED."},{"key":"C","text":"IT IS AN INDICATION THAT ALIGNMENT HAS STOPPED AS THE PRESENT POSITION DATA HAS NOT BEEN ENTERED FROM THE FMGS."}],"answer":"C","confidence":"h","explanation":"La alineación se detiene si no se ingresó la posición actual (desde el FMGS INIT A).","fcomRef":"DSC-34"},{"id":"autoflight-46","n":46,"q":"THE LOC MODE DISENGAGES WHEN:","options":[{"key":"A","text":"ANOTHER LATERAL MODE IS ENGAGED."},{"key":"B","text":"THE PILOT PRESSES THE LOC PUSHBUTTON AGAIN (ENGAGING THE HDG/TRK MODE ON THE CURRENT HDG/TRK)."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"LOC se desengancha al enganchar otro modo lateral o al presionar LOC nuevamente.","fcomRef":"DSC-22_30"},{"id":"autoflight-47","n":47,"q":"THE MANAGED MODE OF FLIGHT GUIDANCE IS USED FOR:","options":[{"key":"A","text":"LATERAL, VERTICAL, AND SPEED COMMANDS AS SELECTED ON THE FCU."},{"key":"B","text":"LATERAL, VERTICAL, AND SPEED COMMANDS AS DETERMINED BY THE MCDU."},{"key":"C","text":"LATERAL, VERTICAL, AND SPEED PROFILES AS DETERMINED BY THE FMGS."}],"answer":"C","confidence":"h","explanation":"Managed: perfiles lateral, vertical y velocidad determinados por el FMGS.","fcomRef":"DSC-22_30"},{"id":"autoflight-48","n":48,"q":"THE ON BAT LIGHT ON THE ADIRS CDU ILLUMINATES:","options":[{"key":"A","text":"ONLY WHEN ALL ADIRS ARE ON BATTERY POWER."},{"key":"B","text":"WHEN AN ADIRS FAULT IS DETECTED."},{"key":"C","text":"WHEN ONE OR MORE ADIRS, ARE SUPPLIED BY AIRPLANE BATTERY ONLY."}],"answer":"C","confidence":"h","explanation":"ON BAT: una o más ADIRU alimentadas solamente por batería.","fcomRef":"DSC-34"},{"id":"autoflight-49","n":49,"q":"THE PILOT INTERFACES WITH THE FMGS USING THE:","options":[{"key":"A","text":"FCU."},{"key":"B","text":"THRUST LEVERS."},{"key":"C","text":"MCDU."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"m","explanation":"El piloto interactúa con el FMGS por FCU, MCDU y thrust levers.","fcomRef":"DSC-22_10"},{"id":"autoflight-50","n":50,"q":"THE POSSIBLE MODES OF FMGC OPERATION ARE.","options":[{"key":"A","text":"DUAL."},{"key":"B","text":"INDEPENDENT."},{"key":"C","text":"SINGLE."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Modos de operación: dual, independiente y single.","fcomRef":"DSC-22_10"},{"id":"autoflight-51","n":51,"q":"THE SELECTED DATABASE DATE HAS EXPIRED. WHEN MUST THE ACTIVE DATA BASE BE CHANGED?","options":[{"key":"A","text":"PRIOR TO ENTERING THE PREFLIGHT DATA."},{"key":"B","text":"ANYTIME PRIOR TO TAKEOFF."},{"key":"C","text":"THE FOLLOWING CALENDAR DAY."}],"answer":"A","confidence":"h","explanation":"La base vencida debe cambiarse antes de ingresar los datos preflight.","fcomRef":"DSC-22_20"},{"id":"autoflight-52","n":52,"q":"THE SPEED TREND ARROW ON THE PFD AIRSPEED SCALE INDICATES THE SPEED VALUE THAT WILL BE ATTAINED IN ___ SECONDS IF THE ACCELERATION REMAINS CONSTANT.","options":[{"key":"A","text":"5"},{"key":"B","text":"8"},{"key":"C","text":"10"},{"key":"D","text":"15"}],"answer":"C","confidence":"h","explanation":"La flecha de tendencia indica la velocidad alcanzada en 10 s.","fcomRef":"DSC-31-40"},{"id":"autoflight-53","n":53,"q":"THE STANDBY ATTITUDE INDICATION WILL REMAIN AVAILABLE FOR _____ MINUTES AFTER TOTAL ELECTRICAL FAILURE.","options":[{"key":"A","text":"5"},{"key":"B","text":"7"},{"key":"C","text":"10"},{"key":"D","text":"22"}],"answer":"A","confidence":"m","explanation":"El horizonte standby queda disponible ~5 min tras la falla eléctrica total (versión analógica). Verificar según tu configuración (ISIS).","fcomRef":"DSC-34"},{"id":"autoflight-54","n":54,"q":"THE THREE DISPLAY MANAGEMENT COMPUTERS (DMCS) ACQUIRE AND PROCESS ALL INPUT FROM AIRPLANE SENSORS AND COMPUTERS TO GENERATE THE DISPLAY IMAGES.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: las tres DMC adquieren y procesan los datos para generar las imágenes.","fcomRef":"DSC-31-10"},{"id":"autoflight-55","n":55,"q":"THE TWO BASIC MODES OF FLIGHT GUIDANCE ON THE A-320 ARE:","options":[{"key":"A","text":"SLAVED AND COUPLED."},{"key":"B","text":"MANAGED AND SELECTED."},{"key":"C","text":"MANUAL AND COUPLED."}],"answer":"B","confidence":"h","explanation":"Managed y selected.","fcomRef":"DSC-22_30"},{"id":"autoflight-56","n":56,"q":"THE WEATHER RADAR IMAGE CAN BE DISPLAYED ON WHICH MODES OF THE ND?","options":[{"key":"A","text":"ROSE NAV OR VOR."},{"key":"B","text":"ROSE VOR OR ROSE ILS."},{"key":"C","text":"ROSE NAV OR ARC."},{"key":"D","text":"ALL MODES EXCEPT PLAN."}],"answer":"D","confidence":"h","explanation":"El radar meteorológico se muestra en todos los modos excepto PLAN.","fcomRef":"DSC-31-40"},{"id":"autoflight-57","n":57,"q":"THE WIND SHEAR FUNCTION OF THE FAC\\'S IS INDEPENDENT OF THE FLIGHT DIRECTOR ON/OFF SWITCH.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: el aviso de windshear del FAC es independiente del FD.","fcomRef":"DSC-22_40"},{"id":"autoflight-58","n":58,"q":"VOR DATA CAN BE DISPLAYED ON :","options":[{"key":"A","text":"BOTH NDS."},{"key":"B","text":"THE DDRMI."},{"key":"C","text":"BOTH A AND B."}],"answer":"C","confidence":"h","explanation":"Datos VOR en ambos ND y en el DDRMI.","fcomRef":"DSC-34"},{"id":"autoflight-59","n":59,"q":"WHAT ARE THE DIFFERENT TYPES OF FLIGHT GUIDANCE?","options":[{"key":"A","text":"SLAVED AND MANAGED."},{"key":"B","text":"AUTOMATIC AND MANUAL."},{"key":"C","text":"MANAGED AND SELECTED."},{"key":"D","text":"MANAGED AND MANUAL."}],"answer":"C","confidence":"h","explanation":"Managed y selected.","fcomRef":"DSC-22_30"},{"id":"autoflight-60","n":60,"q":"WHAT DOES PUSHING THE APPR PUSH BUTTON DO?","options":[{"key":"A","text":"ARMS MANAGED NAVIGATION."},{"key":"B","text":"ARMS THE FLIGHT GUIDANCE SYSTEM TO CAPTURE A LOCALIZER AND GLIDE SLOPE IF THE INFORMATION HAS BEEN ENTERED INTO THE MCDU."},{"key":"C","text":"ALLOWS THE AIRCRAFT TO SLOW TO GREEN DOT SPPED."},{"key":"D","text":"ARMS MANAGED VERTICAL NAVIGATION."}],"answer":"B","confidence":"h","explanation":"APPR arma la captura de LOC y G/S (si fueron ingresados en el MCDU).","fcomRef":"DSC-22_30"},{"id":"autoflight-61","n":61,"q":"WHAT DO THE WHITE ROUND LIGHTS ON THE FCU DISPLAY MEAN?","options":[{"key":"A","text":"SELECTED GUIDANCE HAS BEEN ENGAGED."},{"key":"B","text":"AUTOMATIC GUIDANCE HAS BEEN ENGAGED."},{"key":"C","text":"MANAGED GUIDANCE HAS BEEN ARMED OR ENGAGED."}],"answer":"C","confidence":"h","explanation":"El punto blanco en la ventana del FCU indica guía managed armada o enganchada.","fcomRef":"DSC-22_30"},{"id":"autoflight-62","n":62,"q":"WHAT HAPPENS IF YOU PRESS THE EXPED PB?","options":[{"key":"A","text":"SPEED IS SET TO 340 KNOTS FOR CLIMB AND GREEN DOT FOR DESCENT."},{"key":"B","text":"SPEED IS SET TO GREEN DOT FOR CLIMB AND 340 KNITS FOR DESCENT."},{"key":"C","text":"DECELERATED SPEED APRROACH IS SELECTED."}],"answer":"B","confidence":"h","explanation":"EXPED: green dot en ascenso, 340 kt/M .80 en descenso.","fcomRef":"DSC-22_30"},{"id":"autoflight-63","n":63,"q":"WHAT HAPPENS IF YOU PUSH THE V/S KNOB?","options":[{"key":"A","text":"ENGAGE THE V/S MODE."},{"key":"B","text":"COMMAND A ZERO VERTICAL RATE (ALT HOLD)."},{"key":"C","text":"REVERTS TO MANAGED CLIMB."}],"answer":"B","confidence":"h","explanation":"Empujar V/S = V/S cero (nivelar).","fcomRef":"DSC-22_30"},{"id":"autoflight-64","n":64,"q":"WHAT IS MANAGED CLIMB SPEED ABOVE 10,000 FEET?","options":[{"key":"A","text":"GREEN DOT."},{"key":"B","text":"250 KNOTS."},{"key":"C","text":"280 KNOTS."},{"key":"D","text":"ECON CLIMB SPEED."}],"answer":"D","confidence":"h","explanation":"Sobre 10.000 ft: velocidad ECON CLB.","fcomRef":"DSC-22_20"},{"id":"autoflight-65","n":65,"q":"WHAT IS MANAGED CLIMB SPEED BELOW 10,000 FEET?","options":[{"key":"A","text":"GREEN DOT."},{"key":"B","text":"250 KNOTS."},{"key":"C","text":"280 KNOTS."},{"key":"D","text":"ECON CLIMB SPEED."}],"answer":"B","confidence":"h","explanation":"Bajo 10.000 ft: 250 kt (speed limit).","fcomRef":"DSC-22_20"},{"id":"autoflight-66","n":66,"q":"WHAT SPEED WILL THE FMGS USE IN AN EXPEDITE CLIMB?","options":[{"key":"A","text":"GREEN DOT SPEED."},{"key":"B","text":"ECON CLIMB SPEED."},{"key":"C","text":"250 KNOTS BELOW 10,000 FEET."},{"key":"D","text":"AMBER DOT SPEED."}],"answer":"A","confidence":"h","explanation":"EXPED CLB: green dot.","fcomRef":"DSC-22_30"},{"id":"autoflight-67","n":67,"q":"WHEN A DOUBLE ENTRY IS NEEDED ON THE MCDU (E.G. WIND DIRECTION/SPEED: 270/110) THE SEPARATING SLASH MUST BE USED. THE TRAILING ENTRY OF A PAIR MUST BE PRECEDED BY A
