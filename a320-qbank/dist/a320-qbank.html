"text":"THE CREW MUST DEPRESS THE MASK MAN ON PB IN ORDER TO DEPLOY THE MASKS."},{"key":"C","text":"ELECTRICAL POWER HAS BEEN SENT TO DEPLOY THE MASKS, EITHER MANUALLY OR AUTOMATICALLY."}],"answer":"C","confidence":"h","explanation":"SYS ON: se envió energía eléctrica para abrir las puertas de máscaras (manual o automático).","fcomRef":"DSC-35"},{"id":"comms-13","n":13,"q":"IN CASE OF RMP 2 FAILURE, VHF 2 IS LOST.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."},{"key":"C","text":"VHF 2 CAN STILL BE SELECTED ON RMP 1 OR RMP 3."}],"answer":"C","confidence":"h","explanation":"VHF2 puede seleccionarse desde RMP1 o RMP3.","fcomRef":"DSC-23"},{"id":"comms-14","n":14,"q":"NORMALLY HOW SHOULD YOU CALL A FLIGHT ATTENDANT","options":[{"key":"A","text":"BY HIS OR HER FIRST NAME."},{"key":"B","text":"USING THE ACP CAB PB."},{"key":"C","text":"USING AN OVERHEAD FWD OR AFT CALL PUSHBUTTON."},{"key":"D","text":"SELECTING THE ATTND ADV PUSHBUTTON ON."}],"answer":"C","confidence":"h","explanation":"Normalmente se llama con los pb FWD/AFT del panel CALLS (overhead).","fcomRef":"DSC-23"},{"id":"comms-15","n":15,"q":"ONE RMP (RADIO MANAGEMENT PANEL) GIVES THE FLIGHT CREW CONTROL OF ALL RADIO COMMUNICATION SYSTEMS AND THE OTHER RMP PROVIDES BACK UP TO FMGC'S FOR CONTROLLING RADIO NAVIGATION SYSTEMS.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: cada RMP controla todas las radios de comunicación y ambos sirven de backup de navegación.","fcomRef":"DSC-23"},{"id":"comms-16","n":16,"q":"ONLY THE LAST 60 MINUTES OF RECORDING ARE RETAINED BY THE CVR.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"m","explanation":"Falso (en la versión clásica el CVR retiene 30 min; los modernos 2 h).","fcomRef":"DSC-31"},{"id":"comms-17","n":17,"q":"ON THE GROUND, CVR IS STOPPED AUTOMATICALLY ________ AFTER THE LAST ENGINE SHUTDOWN","options":[{"key":"A","text":"INMEDIATELY."},{"key":"B","text":"1 MINUTE."},{"key":"C","text":"3 MINUTES."},{"key":"D","text":"5 MINUTES."}],"answer":"D","confidence":"h","explanation":"En tierra el CVR se detiene 5 min después de apagar el último motor.","fcomRef":"DSC-31"},{"id":"comms-18","n":18,"q":"ON THE GROUND, THE CREW CAN ENERGIZE THE CVR MANUALLY BY PRESSING THE GND CTL PUSHBUTTON.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: pb CVR GND CTL.","fcomRef":"DSC-31"},{"id":"comms-19","n":19,"q":"ON WHICH ECAM PAGE COULD THE FLIGHT CREW THE EXACT PRESSURE OF THE OXYGEN CYLINDER?","options":[{"key":"A","text":"THE PRESS PAGE."},{"key":"B","text":"THE DOORS PAGE."},{"key":"C","text":"THE COND PAGE."},{"key":"D","text":"THE STATUS PAGE."}],"answer":"B","confidence":"h","explanation":"Presión exacta de la botella: página DOOR (DOOR/OXY).","fcomRef":"DSC-35"},{"id":"comms-20","n":20,"q":"PASSENGER OXYGEN IS SUPPLIED BY:","options":[{"key":"A","text":"INDIVIDUAL HIGH PRESSURE BOTTLES AT EACH SEAT."},{"key":"B","text":"A SINGLE HIGH PRESSURE BOTTLE IN THE LOWER FUSELAGE."},{"key":"C","text":"A CHEMICAL GENERATOR SYSTEM."}],"answer":"C","confidence":"h","explanation":"Pasajeros: generadores químicos.","fcomRef":"DSC-35"},{"id":"comms-21","n":21,"q":"RMP #1 IS DEDICATED TO WHICH VHF RADIOS","options":[{"key":"A","text":"VHF 2 AND 3"},{"key":"B","text":"VHF 1 AND 3"},{"key":"C","text":"ALL RADIOS."}],"answer":"C","confidence":"m","explanation":"Cada RMP puede controlar todas las radios VHF/HF (RMP1 está asociado a VHF1).","fcomRef":"DSC-23"},{"id":"comms-22","n":22,"q":"THE AM PUSHBUTTON SWITCH, ON THE RADIO MANAGEMENT PANEL, IS ONLY OPERATIVE WHEN:","options":[{"key":"A","text":"A VHF TRANSCEIVER HAS BEEN SELECTED."},{"key":"B","text":"AN HF TRANCEIVER HAS BEEN SELECTED."}],"answer":"B","confidence":"h","explanation":"El pb AM sólo opera con un HF seleccionado.","fcomRef":"DSC-23"},{"id":"comms-23","n":23,"q":"THE AUDIO MANAGEMENT SYSTEM INCLUDES HOW MANY AUDIO CONTROL PANELS?","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"C","confidence":"h","explanation":"Tres ACP.","fcomRef":"DSC-23"},{"id":"comms-24","n":24,"q":"THE AUDIO SWITCHING ROTARY SELECTOR ALLOWS REPLACEMENT OF A FAILED #1 OR #2 ACP WITH ACP #3","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: AUDIO SWITCHING permite reemplazar ACP1 o ACP2 por ACP3.","fcomRef":"DSC-23"},{"id":"comms-25","n":25,"q":"THE BFO KEY ENABLES THE BEAT FREQUENCY OSCILLATOR FOR LISTENING TO THE ID SIGNAL.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: BFO para escuchar la identificación del ADF.","fcomRef":"DSC-23"},{"id":"comms-26","n":26,"q":"THE FLASHING AMBER MECH LIGHT INDICATES THAT THE INTERPHONE SYSTEM IS FAULTY.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: MECH ámbar intermitente = el mecánico está llamando.","fcomRef":"DSC-23"},{"id":"comms-27","n":27,"q":"THE OVERRIDE SWITCH FOR THE SERVICE INTERPHONE SYSTEM IS LOCATED ON THE ____ AND IS USED FOR MAINTENANCE PURPOSES ONLY.","options":[{"key":"A","text":"CENTER PEDESTAL."},{"key":"B","text":"OVERHEAD PANEL."},{"key":"C","text":"BCB BEHIND THE CAPTAIN\\'S SEAT."},{"key":"D","text":"GLARESHIELD."}],"answer":"B","confidence":"h","explanation":"SVCE INT OVRD está en el overhead.","fcomRef":"DSC-23"},{"id":"comms-28","n":28,"q":"THE PASSENGER OXYGEN MASK DOORS OPEN AUTOMATICALLY IF THE CABIN ALTITUDE EXCEEDS:","options":[{"key":"A","text":"9.550 FT."},{"key":"B","text":"10.000 FT."},{"key":"C","text":"14.000 FT."}],"answer":"C","confidence":"h","explanation":"Las puertas de máscaras abren automáticamente sobre 14.000 ft de cabina.","fcomRef":"DSC-35"},{"id":"comms-29","n":29,"q":"THERE ARE OXYGEN GENERATORS IN EACH AIRCRAFT'S GALLEY.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Verdadero: hay generadores químicos en las galleys, lavatorios y estaciones de TCP.","fcomRef":"DSC-35"},{"id":"comms-30","n":30,"q":"THERE ARE TWO SERVICE INTERPHONE JACKS IN THE HYDRAULIC COMPARTMENT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"l","explanation":"Hay jacks de interfono de servicio en diversos puntos del fuselaje (incluido compartimiento hidráulico). Verificar en FCOM.","fcomRef":"DSC-23"},{"id":"comms-31","n":31,"q":"THE SERVICE INTERPHONE HAS _____ INTERPHONE JACKS AND AN OVRD SWITCH LOCATED ON THE OVERHEAD PANEL.","options":[{"key":"A","text":"FIVE."},{"key":"B","text":"SEVEN."},{"key":"C","text":"EIGHT."},{"key":"D","text":"TEN."}],"answer":"B","confidence":"l","explanation":"Cantidad de jacks del interfono de servicio — dato de baja certeza, verificar en FCOM.","fcomRef":"DSC-23"},{"id":"comms-32","n":32,"q":"THE SERVICE INTERPHONE SYSTEM PROVIDES COMMUNICATION BETWEEN:","options":[{"key":"A","text":"THE FLIGHT CREW AND THE SERVICE INTERPHONE JACKS."},{"key":"B","text":"THE FLIGHT ATTENDANT STATIONS AND THE SERVICE INTERPHONE JACKS."},{"key":"C","text":"THE DIFFERENT SERVICE INTERPHONE JACKS."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Comunicación entre tripulación de vuelo, TCP y jacks de servicio: todas las anteriores.","fcomRef":"DSC-23"},{"id":"comms-33","n":33,"q":"TO MAKE A PA ANNOUNCEMENT:","options":[{"key":"A","text":"DEPRESS AND HOLD THE PA TRANSMISSION KEY PUSH BUTTON."},{"key":"B","text":"USE THE PEDESTAL MOUNTED HEADSET."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"PA: mantener presionada la tecla PA o usar el handset del pedestal.","fcomRef":"DSC-23"},{"id":"comms-34","n":34,"q":"WHAT DOES AN AMBER OXY ON THE ECAM DOORS MEAN?","options":[{"key":"A","text":"THE CREW SUPPLY SWITCH IS TURNED OFF AND/OR OXYGEN PRESSURE IS LESS THAN 400 PSI."},{"key":"B","text":"THE CREW SUPPLY SWITCH IS TURNED OFF."},{"key":"C","text":"OXYGEN PRESSURE IS LESS THAN 650 PSI."},{"key":"D","text":"OXYGEN PRESSURE IS LESS THAN 300 PSI."}],"answer":"A","confidence":"h","explanation":"OXY ámbar: CREW SUPPLY en OFF y/o presión < 400 psi.","fcomRef":"DSC-35"},{"id":"comms-35","n":35,"q":"WHAT HAPPENS WHEN THE MASK IS USED WITH THE SELECTION AT 100% POSITION?","options":[{"key":"A","text":"MASK IS SUPPLIED WITH DILUTED OXYGEN ON DEMAND."},{"key":"B","text":"MASK IS SUPPLIED WITH UNDILUTED OXYGEN ON DEMAND."},{"key":"C","text":"MASK IS SUPPLIED WITH UNDILUTED OXYGEN CONTINUOUS FLOW."},{"key":"D","text":"MASK IS SUPPLIED WITH DILUTED OXYGEN ON DEMAND."}],"answer":"B","confidence":"h","explanation":"100%: oxígeno puro (no diluido) a demanda.","fcomRef":"DSC-35"},{"id":"comms-36","n":36,"q":"WHAT IS INDICATED BY A MISSING GREEN THERMAL PLUG DURING AN EXTERIOR PREFLIGHT?","options":[{"key":"A","text":"AN OXYGEN SYSTEM OVERPRESSURE OR THERMAL DISCHARGE."},{"key":"B","text":"THIS IS NORMAL INDICATION, THE GREEN THERMAL PLUG ONLY APPEARS IF THE OXYGEN CYLINDER IS LOW."},{"key":"C","text":"THE CREW OXYGEN BOTTLE IS EMPTY."},{"key":"D","text":"AN EXTERNAL FIRE DISCHARGE HAS BEEN ACTIVATED."}],"answer":"A","confidence":"h","explanation":"Falta del disco verde: descarga por sobrepresión/térmica.","fcomRef":"DSC-35"},{"id":"comms-37","n":37,"q":"WHAT IS THE FUNCTION OF THE GUARDED EMER PUSH BUTTON ON THE OVERHEAD PANEL?","options":[{"key":"A","text":"TO ALERT ATC OF AN IN-FLIGHT EMERGENCY."},{"key":"B","text":"TO ALERT THE AFT FLIGHT ATTENDANTS OF A ROUTINE NEED TO SPEAK TO THEM."},{"key":"C","text":"TO ALERT ALL FLIGHT ATTENDANTS OF A PENDING URGENT NEED TO SPEAK TO THEM."}],"answer":"C","confidence":"h","explanation":"EMER: alerta a todas las TCP de una necesidad urgente.","fcomRef":"DSC-23"},{"id":"comms-38","n":38,"q":"WHAT IS THE MAIN DIFFERENCE BETWEEN THE CREW AND THE PASSENGER OXYGEN SYSTEM? THERE IS NO DIFFERENCE: BOTH ARE SERVED BY OXYGEN CYLINDERS.","options":[{"key":"A","text":"CREW IS SUPPLIED FROM AN OXYGEN CYLINDER; PASSENGERS ARE SUPPLIED BY CHEMICAL OXYGEN GENERATORS."},{"key":"B","text":"BOTH THE CREW AND PASSENGERS ARE SUPPLIED WITH OXYGEN FROM CHEMICAL OXYGEN GENERATORS."},{"key":"C","text":"THE CREW HAS AN OXYGEN BOTTLE FOR AN EMERGENCY BACK-UP SUPPLY."}],"answer":"A","confidence":"h","explanation":"Tripulación: botella; pasajeros: generadores químicos.","fcomRef":"DSC-35"},{"id":"comms-39","n":39,"q":"WHAT IS THE PURPOSE OF THE CREW SUPPLY PUSH BUTTON?","options":[{"key":"A","text":"WHEN SELECTED ON, IT SUPPLIES OXYGEN TO THE THIRD AND FOURTH OCCUPANT MASK IN THE COCKPIT."},{"key":"B","text":"WHEN SELECTED TO ON, IT SUPPLIES OXYGEN TO THE THIRD AND FOURTH OCCUPANT WHEN SELECTED TO ON, IT ALLOW THE FLOW OF LOW PRESSURE OXYGEN TO THE CREW\\'S MASK IN THE COCKPIT."},{"key":"C","text":"IN CASE OF LOW CYLINDER PRESSURE IT ALLOWS THE CREW TO TAP INTO THE PASSENGER OXYGEN SYSTEM."}],"answer":"B","confidence":"h","explanation":"CREW SUPPLY ON: abre la válvula y permite el flujo de oxígeno a baja presión a las máscaras de la cabina de mando.","fcomRef":"DSC-35"},{"id":"comms-40","n":40,"q":"WHAT WILL DEPRESSING THE GUARDED MASK MAN ON PB ACCOMPLISH?","options":[{"key":"A","text":"A SIGNAL IS SENT TO THE CHEMICAL OXYGEN GENERATORS TO START THE FLOW OF OXYGEN TO THE MASKS."},{"key":"B","text":"IT MANUALLY SENDS A SIGNAL TO OPEN THE OXYGEN MASK DOORS."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"MASK MAN ON envía la señal eléctrica para abrir las puertas de las máscaras.","fcomRef":"DSC-35"},{"id":"comms-41","n":41,"q":"WHEN DOES PASSENGER OXYGEN FLOW START?","options":[{"key":"A","text":"WHEN THE MASK IS PULLED TOWARD THE SEAT."},{"key":"B","text":"WHEN THE OXYGEN DOORS OPEN."},{"key":"C","text":"WHEN CABIN ALTITUDE EXCEEDS 14.000 FT."},{"key":"D","text":"WHEN THE OXYGEN BUTTON IS PUSHED."}],"answer":"A","confidence":"h","explanation":"El flujo empieza al tirar la máscara hacia el asiento.","fcomRef":"DSC-35"},{"id":"comms-42","n":42,"q":"WHEN LOOKING AT EITHER RMP, HOW IS IT POSSIBLE TO DETERMINE IF AN RMP IS SELECTED TO A VHR SYSTEM IT IS NOT DEDICATED TO?","options":[{"key":"A","text":"THE WHITE SEL LIGHT WILL BE ILLUMINATED ON BOTH ARMP'S. THIS IS A NORMAL OCCURRENCE IN-FLIGHT."},{"key":"B","text":"THE WHITE SEL LIGHT IS ILLUMINATED ON THE OFFSIDE RMP."},{"key":"C","text":"THE WHITE SEL LIGHT IS ILLUMINATED ON THE ONSIDE RMP."}],"answer":"A","confidence":"m","explanation":"SEL blanca se enciende en ambos RMP cuando uno sintoniza un transceptor no asignado.","fcomRef":"DSC-23"},{"id":"comms-43","n":43,"q":"WHEN RMP1 (RADIO MANAGEMENT PANEL) OR RMP2 IS OFF, RPM3 IS STILL ABLE TO CONTROL VHF/HF TRANSCEIVERS THROUGH THEM.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Verdadero: RMP3 puede controlar los transceptores aun con RMP1 o RMP2 en OFF.","fcomRef":"DSC-23"},{"id":"comms-44","n":44,"q":"WHEN SELECTING THE GUARDED RMP NAV KEY:","options":[{"key":"A","text":"MANUAL TUNING VIA THE MCDU RAD NAV PAGE IS STILL POSSIBLE."},{"key":"B","text":"MANUAL TUNING VIA THE MCDU RAD NAV PAGE IS ALWAYS POSSIBLE."},{"key":"C","text":"FMGC AUTO TUNING IS INHIBITED."},{"key":"D","text":"MANUAL TUNING VIA THE MCDU RAD NAV PAGE IS ONLY POSSIBLE ON THE OFFSIDE RADIO."}],"answer":"C","confidence":"h","explanation":"Con NAV del RMP se inhibe la autosintonía del FMGC.","fcomRef":"DSC-23"},{"id":"comms-45","n":45,"q":"WHEN THE AIRCRAFTT IS IN THE EMERGENCY ELECTRICAL CONFIGURATION","options":[{"key":"A","text":"RMP'S 1 AND 2, AND ACP' 1 AND 2 ARE BOTH OPERATIVE."},{"key":"B","text":"RMP 1 AND ACP'S 1 AND 2 ARE OPERATIVE."},{"key":"C","text":"RMP 1 AND ACP 1 ARE OPERATIVE."},{"key":"D","text":"RMP 2 AND ACP'S 1 AND 2 ARE OPERATIVE."}],"answer":"B","confidence":"h","explanation":"Configuración de emergencia: RMP1, ACP1 y ACP2 operativos.","fcomRef":"DSC-24"},{"id":"comms-46","n":46,"q":"WHERE ARE THE HF ANTENNAS LOCATED?","options":[{"key":"A","text":"FORWARD TOP FUSELAGE."},{"key":"B","text":"LEFT WING TIP."},{"key":"C","text":"UNDER THE FUSELAGE."},{"key":"D","text":"LEADING EDGE OF THE RUDDER."}],"answer":"D","confidence":"h","explanation":"La antena HF está en el borde de ataque del timón (deriva).","fcomRef":"DSC-23"},{"id":"comms-47","n":47,"q":"WHICH ACP SWITCH CONFIGURATION IS CORRECT FOR COMMUNICATION WITH OTHER COCKPIT CREW MEMBERS WHILE WEARING YOUR OXYGEN MASK?","options":[{"key":"A","text":"ACP INT/RAD SWITCH SELECTED TO INT, INT RECEPTION KNOB ON, LOUD SPEAKER VOLUME UP."},{"key":"B","text":"INT TRANSMISSION KEY TO ON, INT RECEPTION KNOB ON, USE THE SIDESTICK PUSH- TO TALK WHEN SPEAKING, LOUD SPEAKER VOLUME UP."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"m","explanation":"Ambos métodos permiten comunicarse con la máscara puesta.","fcomRef":"DSC-23"},{"id":"comms-48","n":48,"q":"WHICH ACP TRANSMISSION KEY WILL ILLUMINATED IF THE FLIGHT ATTENDANTS ARE CALLING THE COCKPIT?","options":[{"key":"A","text":"PA."},{"key":"B","text":"CAB."},{"key":"C","text":"ALERT."},{"key":"D","text":"VHF3."}],"answer":"B","confidence":"h","explanation":"Llamada de TCP: se ilumina la tecla CAB (ATT) del ACP.","fcomRef":"DSC-23"},{"id":"comms-49","n":49,"q":"WHICH STATEMENT IS CORRECT REGARDING THE COCKPIT VOICE RECORDER?","options":[{"key":"A","text":"IS AUTOMATICALLY ENERGIZED WHEN THE BATTERY PB/S ARE SELECTED ON."},{"key":"B","text":"IS ALWAYS ACTIVE AFTER DC ELECTRICAL POWER IS APPLIED TO THE AIRCRAFT."},{"key":"C","text":"IS AUTOMATICALLY ENERGIZED WHEN THE PARKING BRAKE IS SET."},{"key":"D","text":"IS AUTOMATICALLY ENERGIZED AFTER THE FIRST ENGINE START OR FIVE MINUTES AFTER AC ELECTRICAL POWER IS APPLIED TO THE AIRCRAFT."}],"answer":"D","confidence":"h","explanation":"CVR se energiza tras el primer arranque de motor o 5 min tras aplicar energía (en tierra).","fcomRef":"DSC-31"},{"id":"comms-50","n":50,"q":"WITH THE AUDIO SWITCHING KNOB IN THE CAPT3 POSITION, THE CAPTAIN USES HIS ACOUSTIC EQUIPMENT ON ACP3.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."},{"key":"C","text":"THE CAPTAIN HAS TO MAKE ALL THE SELECTIONS ON ACP3."}],"answer":"A","confidence":"h","explanation":"Verdadero: CAPT 3 = el comandante usa ACP3.","fcomRef":"DSC-23"},{"id":"comms-51","n":51,"q":"YOU CAN TUNE THE ILS RECEIVERS TO DIFFERENT CHANNELS","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."},{"key":"C","text":"THIS PROTECTS THE AUTO LAND MODE IF THE #1 AUTOPILOT FAILS AND THE #2 SYSTEM ASSUMES CONTROL."}],"answer":"B","confidence":"m","explanation":"No: ambos ILS se sintonizan en la misma frecuencia.","fcomRef":"DSC-22_20"}]},{"id":"elec","name":"ELECTRICAL SYSTEM","nameEs":"Sistema eléctrico","questions":[{"id":"elec-1","n":1,"q":"A BATTERY FAULT LIGHT WILL ILLUMINATE WHEN:","options":[{"key":"A","text":"THE BATTERIES HAVE AUTO DISCONNECTED DUE TO LOW VOLTAGE."},{"key":"B","text":"BATTERY VOLTAGE DROPS BELOW A PREDETERMINED LEVEL."},{"key":"C","text":"BATTERY CHARGING CURRENT INCREASES AT AN ABNORMAL RATE."}],"answer":"C","confidence":"h","explanation":"BAT FAULT: la corriente de carga aumenta de forma anormal (el contactor se abre).","fcomRef":"DSC-24"},{"id":"elec-2","n":2,"q":"A BATTERYFAULT LIGHT WILL ILLUMINATE WHEN:","options":[{"key":"A","text":"THE BATTERIES HAVE AUTO DISCONNECTED DUE TO LOW VOLTAGE"},{"key":"B","text":"BATTERY VOLTAGE DROPS BELOW A PREDETERMINED LEVEL."},{"key":"C","text":"BATTERY CHARGING CURRENT INCREASES AT AN ABNORMAL RATE."}],"answer":"C","confidence":"h","explanation":"BAT FAULT: la corriente de carga aumenta de forma anormal.","fcomRef":"DSC-24"},{"id":"elec-3","n":3,"q":"AFTER IDG DISCONNECTION WHY DO YOU GET A GALLEY SHED INDICATION ON THE SD?","options":[{"key":"A","text":"IT IS A REMINDER TO PUSH THE GALLEY PUSHBUTTON TO MANUALLY SHED THE MAIN GALLEY."},{"key":"B","text":"IT IS A REMINDER TO GET THE FLIGHT ATTENDANTS TO SWITCH OFF GALLEY EQUIPMENT TO DECREASE THE LOAD ON THE REMAINING GENERATOR."},{"key":"C","text":"IF IT IS A REMINDER THAT THE MAIN GALLEY HAS BEEN SHED AUTOMATICALLY FOLLOWING THE LOSS OF ONE GENERATOR."}],"answer":"C","confidence":"h","explanation":"GALLEY SHED: recordatorio de que la galley principal fue deslastrada automáticamente por pérdida de un generador.","fcomRef":"DSC-24"},{"id":"elec-4","n":4,"q":"AFTER LANDING, IN THE EMERGENCY ELECTRICAL CONFIGURATION: THE BATTERIES AUTOMATICALLY CONNECT TO THE DC BAT BUS WHEN SPEED DECREASES BELOW _____ KNOTS.","options":[{"key":"A","text":"50"},{"key":"B","text":"70"},{"key":"C","text":"90"},{"key":"D","text":"100"}],"answer":"D","confidence":"h","explanation":"Tras aterrizar en emergencia: las baterías se conectan al DC BAT BUS por debajo de 100 kt.","fcomRef":"DSC-24"},{"id":"elec-5","n":5,"q":"AN ACC ESSFEED SWITCH LOCATED ON THE OVERHEAD PANEL SHIFTS THE POWER SOURCE FOR THE AC ESS BUS FROM:","options":[{"key":"A","text":"AC BUS 1 TO AC BUS 2"},{"key":"B","text":"AC BUS 1 TO AC GRND/FIT BUS"},{"key":"C","text":"AC BUS 2 TO AC BUS 1"}],"answer":"A","confidence":"h","explanation":"AC ESS FEED: pasa la alimentación de AC ESS de AC BUS 1 a AC BUS 2.","fcomRef":"DSC-24"},{"id":"elec-6","n":6,"q":"AN AC ESS FEED SWITCH LOCATED ON THE OVERHEAD PANEL SHIFTS THE POWER SOURCE FOR THE AC ESS BUS FROM:","options":[{"key":"A","text":"AC BUS 1 TO AC BUS 2."},{"key":"B","text":"AC BUS 1 TO AC GRND/FIT BUS."},{"key":"C","text":"AC BUS 2 TO AC BUS 1."}],"answer":"A","confidence":"h","explanation":"AC ESS FEED: pasa de AC BUS 1 a AC BUS 2.","fcomRef":"DSC-24"},{"id":"elec-7","n":7,"q":"ARE THERE ANY LIMITATIONS ASSOCIATED WITH DISCONNECTING AN IDG?","options":[{"key":"A","text":"NEVER DISCONNECT AN IDG IN FLIGHT, OR PUSH THE IDG DISCONNECT PUSH BUTTON FOR MORE THEN 30 SECONDS."},{"key":"B","text":"THERE IS NO LIMITATIONS."},{"key":"C","text":"NEVER DISCONNECT AN IDG IN FLIGHT, OR PUSH THE IDG DISCONNECT PUSH BUTTON FOR MORE THEN 5 SECONDS."},{"key":"D","text":"NEVER DISCONNECT AN IDG UNLESS THE ENGINE IS RUNNING NOR PUSH THE IDG DISCONNECT PUSH BUTTON FOR MORE THEN 3 SECONDS."}],"answer":"D","confidence":"h","explanation":"No desconectar el IDG si el motor no está girando y no mantener el pb más de 3 s.","fcomRef":"LIM-24"},{"id":"elec-8","n":8,"q":"BOTH BATTERIES ARE CHARGED BY THE EXTERNAL POWER UNIT. APPROXIMATELY HOW LONG DOES THE CHARGING PROCESS TAKE?","options":[{"key":"A","text":"L0 MINUTES."},{"key":"B","text":"20 MINUTES."},{"key":"C","text":"30 MINUTES."},{"key":"D","text":"BETWEEN 30 & 45 MINUTES."}],"answer":"B","confidence":"h","explanation":"La carga de ambas baterías toma ~20 min.","fcomRef":"DSC-24"},{"id":"elec-9","n":9,"q":"CAN YOU RECONNECT AN IDG IN FLIGHT?","options":[{"key":"A","text":"YES, BUT ONLY AFTER CONTACTING MAINTENANCE CONTROL."},{"key":"B","text":"YES,PUSH AND HOLD THE IDG PB UNTIL THE GEN FAULT LIGHT IS NO LONGER ILLUMINATED."},{"key":"C","text":"NO."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"C","confidence":"h","explanation":"No: la reconexión del IDG sólo en tierra por mantenimiento.","fcomRef":"DSC-24"},{"id":"elec-10","n":10,"q":"DO NOT DEPRESS THE IDG DISCONNECT SWITCH FOR MORE THAN _____ TO PREVENT DAMAGE TO THE DISCONNECT MECHANISM.","options":[{"key":"A","text":"3 SECONDS."},{"key":"B","text":"10 SECONDS."},{"key":"C","text":"15 SECONDS."}],"answer":"A","confidence":"h","explanation":"No presionar el IDG disconnect más de 3 s.","fcomRef":"LIM-24"},{"id":"elec-11","n":11,"q":"DURING A ROUTINE FLIGHT, WICH OF THE FOLLOWING WOULD RESULT AFTER THE LOSS OF GEN #2 AND THE SUBSEQUEND START OF THE APU?","options":[{"key":"A","text":"THE APU WOULD NOW POWER BOTH SIDES OF THE ELECTRICAL SYSTEM."},{"key":"B","text":"ALL SYSTEMS RETURN TO NORMAL AND THE RAT MUST BE RESTORED."},{"key":"C","text":"ENG GEN #1 CONTINUES TO POWER AC BUS #1 AND DOWNSTREAM SYSTEMS. THE APU POWERS AC BUS #2 AND DOWNSTREAM SYSTEMS."}],"answer":"C","confidence":"h","explanation":"GEN1 sigue alimentando AC1; el APU GEN alimenta AC2.","fcomRef":"DSC-24"},{"id":"elec-12","n":12,"q":"DURING THE FIVE SECONDS IT TAKES FOR THE RAT TO EXTEND:","options":[{"key":"A","text":"THE BATTERIES POWER BOTH BATT HOT BUSSES, 3SS DC SHED, AND ESS AC SHFD THROUGH THE STATIC INVERTER."},{"key":"B","text":"THE BATTERIES POWER BOTH BATT HOT BUSSES, ESS DC, AND ESS AC THROUGH THE STATIC INVERTER."},{"key":"C","text":"THE STATIC INVERTER POWERS BOTH BATT HOT BUSSESO ESS DC, AND ESS AC THROUGH THE ESS AC SHED BUSSES."},{"key":"D","text":"THE BATTERIES POWER BOTH BATT HOT BUSSES."}],"answer":"B","confidence":"h","explanation":"Mientras la RAT se despliega (~8 s), las baterías alimentan hot buses, DC ESS y AC ESS (vía static inverter).","fcomRef":"DSC-24"},{"id":"elec-13","n":13,"q":"ENGINE #L HAS JUST BEEN STARTED AND THE APU IS INOPERATIVE. THE EXT PWR PUSH BUTTON BLUE ON LIGHT IS ILLUMINATED. WHICH OF THE STATEMENTS BELOW IS CORRECT?","options":[{"key":"A","text":"EXTERNAL POWER IS SUPPLYING AIL ELECTRICAL NEEDS."},{"key":"B","text":"ENGINE GEN #L IS SUPPLYING AC BUS #L AND THE DOWNSTREAM SYSTEMS, AND AC BUS #2 THROUGH THE BUS TIE CONTACTORS."},{"key":"C","text":"GEN #I SUPPLIES AC BUS #I AND (GENERALLY) THE DOWNSTREAM SYSTEMS; EXT POWER SUPPLIES AC BUS #2 ."}],"answer":"C","confidence":"h","explanation":"GEN1 alimenta AC1; la potencia externa alimenta AC2.","fcomRef":"DSC-24"},{"id":"elec-14","n":14,"q":"FOR THE A-320 THE EMERGENCY GENERATOR SUPPLIES POWER AS LOGN AS RAT IS DEPLOYED AND:","options":[{"key":"A","text":"THE LANDING GEAR IS DOWN."},{"key":"B","text":"IF THE RAT STALLS OR IF THE AIRCRAFT IS ON THE GROUND WITH THE SPEED BELOW 100 KTS."},{"key":"C","text":"THE LANDING GEAR IS UP."}],"answer":"C","confidence":"m","explanation":"En la versión clásica el EMER GEN alimenta mientras la RAT está desplegada y el tren arriba.","fcomRef":"DSC-24"},{"id":"elec-15","n":15,"q":"HAVING STARTING THE APU, HOW CAN YOU GET THE APU GENERATOR TO POWER THE ELECTRICAL SYSTEM?","options":[{"key":"A","text":"THE APU GENERATOR MUST BE SWITCH ON."},{"key":"B","text":"BY PUSHING THE EXT PWR PUSHBUTTON THUS DISCONNECTING THE EXTERNAL POWER."},{"key":"C","text":"BY PUSHING THE BUS TIE PUSHBUTTON"},{"key":"D","text":"YOU ARE UNABLE TO AS THE APU POWER OUTPUT IS OUTSIDE NORMAL PARAMETERS."}],"answer":"B","confidence":"h","explanation":"La EXT PWR tiene prioridad sobre APU: hay que desconectar EXT PWR.","fcomRef":"DSC-24"},{"id":"elec-16","n":16,"q":"HOW MANY TIMES CAN YOU RESET A CIRCUIT BREAKER?","options":[{"key":"A","text":"ONCE."},{"key":"B","text":"ONCE, IF AUTHORIZED BY THE PROCEDURES."},{"key":"C","text":"TWICE."},{"key":"D","text":"TWICE, IF AUTHORIZED BY THE PROCEDURES."}],"answer":"B","confidence":"h","explanation":"Un reset, si lo autorizan los procedimientos.","fcomRef":"PRO"},{"id":"elec-17","n":17,"q":"IF BATTERIES ARE THE ONLY SOURCE OF POWER IN FLIGHT, HOW LONG WILL BATTERY POWER BE AVAILABLE?","options":[{"key":"A","text":"BETWEEN 22 AND 30 MINUTES DEPENDING ON EQUIPMENT IN USE"},{"key":"B","text":"UNTIL THE APU IS STARTED"},{"key":"C","text":"TWO HOURS AND 30 MINUTES DEPENDENT ON EQUIPMENT IN USE."},{"key":"D","text":"45 MINUTES DEPENDENT ON EQUIPMENT IN USE"}],"answer":"A","confidence":"h","explanation":"Sólo baterías: aprox. 22–30 min.","fcomRef":"DSC-24"},{"id":"elec-18","n":18,"q":"IF BATTERIES ARE THE ONLY SOURCE OF POWER IN FLIGHT, HOW LONG WILL BATTERY POWER BE AVAILABLE?","options":[{"key":"A","text":"BETWEEN 22 AND 30 MINUTES DEPENDING ON EQUIPMENT IN USE."},{"key":"B","text":"UNTIL THE APU IS STARTED."},{"key":"C","text":"TWO HOURS AND 30 MINUTES DEPENDENT ON EQUIPMENT IN USE."},{"key":"D","text":"45 MINUTES DEPENDENT ON EQUIPMENT IN USE."}],"answer":"A","confidence":"h","explanation":"Sólo baterías: aprox. 22–30 min.","fcomRef":"DSC-24"},{"id":"elec-19","n":19,"q":"IF BOTH ENGINE GENERATORS ARE POWERING THE SYSTEM, AND ONE SUBSEQUENTLY FAILS ARE ANY BUSSES UNPOWERED?","options":[{"key":"A","text":"ONLY THE AC ESS SHED BUS"},{"key":"B","text":"NO, BUT SOME LOADS ARE SHED IN BOTH MAIN GALLEYS"},{"key":"C","text":"YES, THOSE ASSOCIATED WITH THE FAILED GENERATOR"}],"answer":"B","confidence":"h","explanation":"No se pierde ningún bus; el generador restante alimenta todo y se deslastra parte de la galley.","fcomRef":"DSC-24"},{"id":"elec-20","n":20,"q":"IF BOTH ENGINE GENERATORS ARE POWERING THE SYSTEM, AND ONE SUBSEQUENTLY FAILS. ARE ANY BUSSES UNPOWERED?","options":[{"key":"A","text":"ONLY THE AC ESS SHED BUS."},{"key":"B","text":"NO, BUT SOME LOADS ARE SHED IN BOTH MAIN GALLEYS."},{"key":"C","text":"YES, THOSE ASSOCIATED WITH THE FAILED GENERATOR."}],"answer":"B","confidence":"h","explanation":"No se pierde ningún bus; se deslastra parte de la galley.","fcomRef":"DSC-24"},{"id":"elec-21","n":21,"q":"IF DURING A NORMAL FLIGHT THE BUS TIE PUSH BUTTON IS DEPRESSED TO OFF, WHAT EFFECT WOULD THIS HAVE ON POWER TO THE BUSSES?","options":[{"key":"A","text":"NONE."},{"key":"B","text":"ALL POWER WOULD BE LOST AND THE AIRCRAFT WOULD BE POWERED BY THE BATTERIES UNTIL THE RAT WAS UP TO SPEED."},{"key":"C","text":"THE POWER TRANSFER WOULD SWITCH TO THE OPPOSITE BUS."},{"key":"D","text":"THIS IS NOT POSSIBLE AS THE BUS TIE CONTACTORS ARE LOCKED OUT DURING FLIGHT."}],"answer":"A","confidence":"h","explanation":"Con ambos generadores funcionando, BUS TIE OFF no tiene efecto (las barras ya están separadas).","fcomRef":"DSC-24"},{"id":"elec-22","n":22,"q":"IF EXTERNAL POWER IS AVAILABLE AND WITHIN LIMITS:","options":[{"key":"A","text":"IT WILL AUTOMATICALLY CLOSE THE BUS TIE CONTACTORS WHEN CONNECTED BY THE GROUND CREW."},{"key":"B","text":"THE GREEN AVAIL LIGHT WILL ILLUMINATE ON TEH EXT PWR PUSH BUTTON."},{"key":"C","text":"THE BUS TIE PUSH BUTTON ILLUMINATES."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"B","confidence":"h","explanation":"EXT PWR AVAIL verde cuando la potencia externa está conectada y en parámetros.","fcomRef":"DSC-24"},{"id":"elec-23","n":23,"q":"IF EXTERNAL POWER IS AVAILABLE AND WITHIN LIMITS:","options":[{"key":"A","text":"IT WILL AUTOMATICALLY CLOSE THE BUS TIE CONTACTORS WHEN CONNECTED BY THE GROUND CREW."},{"key":"B","text":"THE GREEN AVAIL LIGHT WILL ILLUMINATE ON THE EXT PWR PUSH BUTTON."},{"key":"C","text":"THE BUS TIE PUSH BUTTON ILLUMINATES."}],"answer":"B","confidence":"h","explanation":"EXT PWR AVAIL verde cuando la potencia externa está conectada y en parámetros.","fcomRef":"DSC-24"},{"id":"elec-24","n":24,"q":"IF NORMAL ELECTRICAL POWER IS LOST; ESSENTIAL COCKPIT LIGHTING IS MAINTANIRED FOR THE:","options":[{"key":"A","text":"CAPTAIN\\'S INSTRUMENT PANEL."},{"key":"B","text":"STANDBY COMPASS."},{"key":"C","text":"RIGHT DOME LIGHT (PROVIDED THE DOME SELECTOR IS NOT OFF)."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"D","confidence":"m","explanation":"Iluminación de emergencia: panel del comandante, brújula standby y dome light derecho.","fcomRef":"DSC-33"},{"id":"elec-25","n":25,"q":"IF THE BATTERY VOLTAGES ARE BELOW THE MINIMUM, HOW DO YOU CHARGE THEM?","options":[{"key":"A","text":"YOU HAVE TO CALL A MECHANIC BECAUSE THE BATTERIES CAN LONLY BE CHARGED BY MAINTENANCE."},{"key":"B","text":"I HAVE TO CHECK THAT THE BAT PUSHBUTTONS ARE ON AND SWITCH THE EXTERNAL POWER ON"}],"answer":"B","confidence":"h","explanation":"Verificar BAT en ON y conectar potencia externa (cargan los BCL).","fcomRef":"DSC-24"},{"id":"elec-26","n":26,"q":"IF THE BATTERY VOLTAGES ARE BELOW THE MINIMUM, HOW DO YOU CHARGE THEM?","options":[{"key":"A","text":"YOU HAVE TO CALL A MECHANIC BECAUSE THE BATTERIES CAN ONLY BE CHARGED BY MAINTENANCE."},{"key":"B","text":"I HAVE TO CHECK THAT THE BAT PUSHBUTTONS ARE ON AND SWITCH THE EXTERNAL POWER ON."}],"answer":"B","confidence":"h","explanation":"Verificar BAT en ON y conectar potencia externa.","fcomRef":"DSC-24"},{"id":"elec-27","n":27,"q":"IF THE SOURCE OF POWER FOR THE ESS AC BUS IS LOST, DOES ANOTHER SOURCE OF POWER AUTOMATICALLY POWER THE BUS?","options":[{"key":"A","text":"YES, TRANSFER IS AUTOMATIC."},{"key":"B","text":"YES, ONLY IF AUTO WAS SELECTED ON THE AC ESS FEED PUSH BUTTON."},{"key":"C","text":"NO, THIS MUST BE DONE BY THE CREW."}],"answer":"C","confidence":"h","explanation":"No: AC ESS FEED debe cambiarse manualmente a ALTN.","fcomRef":"DSC-24"},{"id":"elec-28","n":28,"q":"IN CRUISE, YOU HAVE SUDDENLY A MASTER WARNING AND CAUTION COMES ON WITH ELEC EMER CONFIG AND APP OFF. YOU NOTICE A RED FAULT LIGHT ON THE RAT & EMER GEN PUSHBUTTON. WHAT DO YOU THINK OF THIS INDICATION?","options":[{"key":"A","text":"THE EMER GEN IS NOT YET SUPPLYING THE SYSTEM."},{"key":"B","text":"THE RAT HAS FAILED. YOU WILL HAVE TO TURN THE BATTERIES TO OFF."},{"key":"C","text":"THE FAULT LIGHT IS ALWAYS ON WHEN ARE IN SLEC EMER CONFIG."},{"key":"D","text":"THE RAT HAS FAILED. YOU HAVE TO TRY TO RECONNECT BOTH IDC/S."}],"answer":"A","confidence":"h","explanation":"FAULT rojo: el EMER GEN todavía no está alimentando.","fcomRef":"DSC-24"},{"id":"elec-29","n":29,"q":"IS IT POSIBLE TO DETERMINE THE SOURCE OF POWER FOR AIRCRAFT BUSSES?","options":[{"key":"A","text":"IT IS INDICATED ON THE ELECTRICAL SCHEMATIC OVERHEAD."},{"key":"B","text":"NO."},{"key":"C","text":"ONLY WHEN OPERATING IN THE EMERGENCY ELECTRICAL CONFIGURATION."},{"key":"D","text":"YES, PRESS THE ECAM ELEC PUSH BUTTON AND VIEW THE ELECTRICAL SHEMATIC ON THE ECAM."}],"answer":"D","confidence":"h","explanation":"Página ELEC del ECAM.","fcomRef":"DSC-24"},{"id":"elec-30","n":30,"q":"IS IT POSSIBLE TO PARALLEL GENERATORS?","options":[{"key":"A","text":"OF COURSE YES."},{"key":"B","text":"ONLY WITH THE RAT DEPLOYED."},{"key":"C","text":"THE ELECTRICAL SYSTEM WILL NOT ALLOW \"PARALLELING\" OF GENERATORS."},{"key":"D","text":"ONLY ONE ENGINE GENERATOR MAY BE PARALLELED WITH THE APU."}],"answer":"C","confidence":"h","explanation":"Los generadores nunca se conectan en paralelo.","fcomRef":"DSC-24"},{"id":"elec-31","n":31,"q":"ON THE COCKPIT OVERHEAD PANEL, THERE IS A THREE POSITIONS EMERGENCY EXIT LIGHT SWITCH. WHAT LIGHTS ARE ASSOCIATED WITH THIS SWITCH.","options":[{"key":"A","text":"EXIT SIGNS, EMERGENCY LIGTHS, AND ESCAPE PATH LIGHTING."},{"key":"B","text":"EXIT SIGNS, EMERGENCY LIGHTS, MAIN PANEL FLOOD LIGHTS, AND ESCAPE PATH LIGHTING."},{"key":"C","text":"EXIT SIGNS, EMERGENCY LIGHTS, DOME LIGHTS, MAIN PANEL FLOOD LIGHTS, AND THE STANDBY COMPASS LIGHTS."}],"answer":"A","confidence":"h","explanation":"EMER EXIT LT: exit signs, luces de emergencia y escape path.","fcomRef":"DSC-33"},{"id":"elec-32","n":32,"q":"THE A-320 HAS _______ BATTERIES IN ITS MAIN ELECTRICAL SYSTEM.","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"}],"answer":"B","confidence":"h","explanation":"Dos baterías.","fcomRef":"DSC-24"},{"id":"elec-33","n":33,"q":"THE AC ESSENTIAL BUS IS POWERED BY THE BATTERY AT SPEED ABOVE 50 KT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Verdadero: sobre 50 kt (sólo baterías) el static inverter alimenta AC ESS.","fcomRef":"DSC-24"},{"id":"elec-34","n":34,"q":"THE BAT FAULT LIGHT WILL ILLUMINATE WHEN:","options":[{"key":"A","text":"BATTERY VOLTAGE IS LOW."},{"key":"B","text":"CHARGING CURRENT INCREASES AT AN ABNORMAL RATE."},{"key":"C","text":"CHARGING CURRENT DECREASES AT AN ABNORMAL RAT."}],"answer":"B","confidence":"h","explanation":"BAT FAULT: corriente de carga anormalmente creciente.","fcomRef":"DSC-24"},{"id":"elec-35","n":35,"q":"THE BATTERY BUS IS NORMALLY POWERED BY:","options":[{"key":"A","text":"DC BUS 2"},{"key":"B","text":"DC BUS 1 AND DC BUS 2"},{"key":"C","text":"DC BUS 1 THROUGH A DC THE CONTROL RELAY."},{"key":"D","text":"DC BUS 2 THROUGH A DC THE CONTROL RELAY."}],"answer":"C","confidence":"h","explanation":"DC BAT BUS normalmente desde DC BUS 1 a través del contactor de unión DC.","fcomRef":"DSC-24"},{"id":"elec-36","n":36,"q":"THE DC BAT BUS IS NORMALLY POWERED BY:","options":[{"key":"A","text":"THE A-320 HAS ______ BATTERIES IN ITS MAIN ELECTRICAL SYSTEM."},{"key":"B","text":"DC BUS 2."},{"key":"C","text":"BATTERIES."},{"key":"D","text":"DC BUS 1"}],"answer":"D","confidence":"h","explanation":"DC BAT BUS normalmente desde DC BUS 1.","fcomRef":"DSC-24"},{"id":"elec-37","n":37,"q":"THE ENGINE GENERATORS AND APU GENERATOR ARE RATED AT _______ KVA.","options":[{"key":"A","text":"50"},{"key":"B","text":"90"},{"key":"C","text":"45"}],"answer":"B","confidence":"h","explanation":"90 kVA.","fcomRef":"DSC-24"},{"id":"elec-38","n":38,"q":"THE GALLEY FAULT LIGHT ILLUMINATES WHEN ANY GENERATOR IS EXCEEDING 80% OF ITS RATED OUTPUT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: GALLEY FAULT con carga > 100% del generador.","fcomRef":"DSC-24"},{"id":"elec-39","n":39,"q":"THE IDG FAULT LIGHT INDICATES:","options":[{"key":"A","text":"AN IDG OIL OVERHEATS."},{"key":"B","text":"IDG LOW OIL PRESSURE."},{"key":"C","text":"IDG HAS BEEN DISCONNECTED."},{"key":"D","text":"EITHER A OR B."}],"answer":"D","confidence":"h","explanation":"IDG FAULT: sobretemperatura de aceite o baja presión de aceite.","fcomRef":"DSC-24"},{"id":"elec-40","n":40,"q":"THE NORMAL PRIORITY FOR SUPPLYING ELECTRICAL POWER TO THE AC BUSSES IS:","options":[{"key":"A","text":"EXTERNAL POWER, ENGINE GENERATORS, APU."},{"key":"B","text":"APU, EXTERNAL POWER, ENGINE GENERATORS."},{"key":"C","text":"ENGINE GENERATORS, EXTERNAL POWER, APU."}],"answer":"C","confidence":"h","explanation":"Prioridad: generadores de motor, potencia externa, APU.","fcomRef":"DSC-24"},{"id":"elec-41","n":41,"q":"THE NUMBER 1 AC BUS CHANNEL NORMALLY SUPPLIES POWER TO ____ AND TO THE _____ BUS","options":[{"key":"A","text":"TR2/AC ESS SHED/DC ESS SHED."},{"key":"B","text":"TR1/AC ESS SHED / DC ESS."},{"key":"C","text":"TR1/AC ESS / AC ESS SHED."},{"key":"D","text":"TR1 /AC ESS / DC ESS SHED."}],"answer":"C","confidence":"h","explanation":"AC1 alimenta TR1, AC ESS y AC ESS SHED.","fcomRef":"DSC-24"},{"id":"elec-42","n":42,"q":"THE NUMBER 1 AC BUS CHANNEL NORMALLY SUPPLIES POWER TO __________, AND TO THE __________ BUS.","options":[{"key":"A","text":"TR1, DC 1"},{"key":"B","text":"TR1, AC ESS."},{"key":"C","text":"NONE OF ABOVE."}],"answer":"B","confidence":"h","explanation":"AC1 alimenta TR1 y AC ESS.","fcomRef":"DSC-24"},{"id":"elec-43","n":43,"q":"THE PURPOSE OF THE AUTO BUS TIE IS TO ALLOW EITHER ENGINE-DRIVEN IDG TO AUTOMATICALLY POWER BOTH MAIN AC BUSES IN THE EVENT OF A GENERATOR LOSS UNTIL EITHER GROUND POWER OR THE APU GENERATOR IS ACTIVATED.","options":[{"key":"A","text":"TRUE"},{"key":"B","text":"FALSE"}],"answer":"A","confidence":"h","explanation":"Verdadero.","fcomRef":"DSC-24"},{"id":"elec-44","n":44,"q":"THE RAT IS CONNECTED DIRECTLY (MECHANICALLY) TO THE EMERGENCY GENERATOR.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: la RAT mueve una bomba hidráulica (azul) que acciona el emergency generator.","fcomRef":"DSC-24"},{"id":"elec-45","n":45,"q":"WHAT COCKPIT LIGHTING IS AVAILABLE DURING AN EMERGENCY ELECTRICAL SITUATION?","options":[{"key":"A","text":"EMERGENCY PATH LIGHTING ONLY."},{"key":"B","text":"RIGHT SIDE DOME LIGHT, MAIN PANEL FLOOD LIGHTS (LEFT TWO COLUMNS ONLY), AND THE STANDBY COMPASS LIGHT."},{"key":"C","text":"LOCATED ON NORMAL CIRCUIT BREAKER PANELS."},{"key":"D","text":"RIGHT SIDE DOME LIGHT, MAIN PANEL FLOOD LIGHTS, AND THE STANDBY COMPASS LIGHT."}],"answer":"B","confidence":"m","explanation":"Emergencia: dome light derecho, flood del panel principal (lado izq.) y luz de la brújula standby.","fcomRef":"DSC-33"},{"id":"elec-46","n":46,"q":"WHAT DOES THE BLUE EXT PWR ON LIGHT MEAN?","options":[{"key":"A","text":"EXTERNAL POWER IS PLUGGED IN AND PARAMETERS ARE NORMAL."},{"key":"B","text":"EXTERNAL POWER IS SUPPLYING THE AIRCRAFT S ELECTRICAL SYSTEM."},{"key":"C","text":"THERE IS A FAULT WITH THE EXTERNAL POWER."}],"answer":"B","confidence":"h","explanation":"EXT PWR ON azul: la potencia externa alimenta la red del avión.","fcomRef":"DSC-24"},{"id":"elec-47","n":47,"q":"WHAT IS THE FUNCTION OF APU GEN PUSH BUTTON LOCATED ON THE OVERHEAD ELECTRICAL PANEL?","options":[{"key":"A","text":"PUSH THIS BUTTON TO AUTOMATICALLY START THE APU"},{"key":"B","text":"WHEN SELECTED TO OFF THE APU GENERATOR FIELD IS DE-ENERGIZED."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"APU GEN OFF: se desenergiza el campo del generador.","fcomRef":"DSC-24"},{"id":"elec-48","n":48,"q":"WHAT IS THE FUNCTION OF THE GEN 1 LINE PUSH BUTTON?","options":[{"key":"A","text":"WHEN SELECTED OFF THE AVIONICS COMPARTMENT ISOLATION VALVES CLOSE."},{"key":"B","text":"WHEN SELECTED OFF THE #1 GENERATOR POWERS ALL AC BUSES."},{"key":"C","text":"WHEN SELECTED OFF GENERATOR #1 IS REMOVED FROM ALL BUSSES BUT CONTINUES TO POWER ONE FUEL PUMP IN EACH WING."}],"answer":"C","confidence":"h","explanation":"GEN1 LINE OFF: el GEN1 se desconecta de las barras pero sigue alimentando una bomba de combustible por ala.","fcomRef":"DSC-24"},{"id":"elec-49","n":49,"q":"WHAT IS THE MEANING OF THE GREEN AVAIL LIGHT?","options":[{"key":"A","text":"EXTERNAL POWER IS PLUGGED IN AND PARAMETERS ARE NORMAL. YOU MUST PUSH THE EXTERNAL POWER TO CONNECT IT."},{"key":"B","text":"EXTERNAL POWER IS AVAILABLE TO THE BATTERIES ONLY."},{"key":"C","text":"THE EXTERNAL POWER PANEL DOOR HAS BEEN OPENED."},{"key":"D","text":"EXTERNAL POWER IS SUPPLYING THE AIRCRAFT SYSTEMS."}],"answer":"A","confidence":"h","explanation":"AVAIL verde: potencia externa conectada y en parámetros; hay que presionar el pb.","fcomRef":"DSC-24"},{"id":"elec-50","n":50,"q":"WHAT IS THE MINIMUM VOLTAGE WHEN CONSULTING A BATTERY CHECK?","options":[{"key":"A","text":"28 VOLTS."},{"key":"B","text":"LESS THAN 60 AMPS IN 10 SECONDS."},{"key":"C","text":"GREATER THAN 25 VOLTS."}],"answer":"C","confidence":"h","explanation":"Voltaje mínimo mayor a 25 V (25,5 V).","fcomRef":"PRO-NOR"},{"id":"elec-51","n":51,"q":"WHAT IS THE PRIORITY OF ELECTRICAL SOURCES?","options":[{"key":"A","text":"EXTERNAL POWER, GEN #1 AND #2, APU."},{"key":"B","text":"APU, EXTERNAL POWER (IF SELECTED), GEN #1 AND #2."},{"key":"C","text":"APU, GEN #2 OR #2 OR #1, EXTERNAL POWER (IF SELECTED)."},{"key":"D","text":"GEN #1 OR #2, EXTERNAL POWER (IF SELECTED), APU."}],"answer":"D","confidence":"h","explanation":"GEN1/2, EXT PWR (si está seleccionada), APU.","fcomRef":"DSC-24"},{"id":"elec-52","n":52,"q":"WHAT IS THE SIGNIFICANCE OF THE CIRCUIT BREAKERS ON THE OVERHEAD PANEL?","options":[{"key":"A","text":"THEY ARE NOT MONITORED BY ECAM."},{"key":"B","text":"CANNOT BE RESET."},{"key":"C","text":"THEY MAY BE OPERATIONAL IN THE EMERGENCY ELECTRICAL CONFIGURATION."}],"answer":"C","confidence":"h","explanation":"Los CB del overhead son los que pueden quedar operativos en la configuración de emergencia.","fcomRef":"DSC-24"},{"id":"elec-53","n":53,"q":"WHAT IS THE SIGNIFICANCE OF THE CIRCUIT BREAKERS ON THE OVERHEAD PANEL?","options":[{"key":"A","text":"THEY ARE NOT MONITORED BY ECAM."},{"key":"B","text":"CANNOT BE RESET."},{"key":"C","text":"THEY MAY BE OPERATIONAL IN THE EMERGENCY ELECTRICAL CONFIGURATION"}],"answer":"C","confidence":"h","explanation":"Los CB del overhead pueden quedar operativos en emergencia.","fcomRef":"DSC-24"},{"id":"elec-54","n":54,"q":"WHAT WOULD CAUSE THE GALLEY FAULT LIGHT TO ILLUMINATE?","options":[{"key":"A","text":"THE FLIGHT ATTENDANTS HAVE ALL THE COFFEE MAKERS AND OVENS ON AT ONCE."},{"key":"B","text":"THE MAIN GALLEY HAS SHED."},{"key":"C","text":"THE LOAD ON ANY GENERATOR IS ABOVE 100% OF ITS RATED OUTPUT."},{"key":"D","text":"THE AFT GALLEY HAS SHED."}],"answer":"C","confidence":"h","explanation":"GALLEY FAULT: carga de algún generador > 100%.","fcomRef":"DSC-24"},{"id":"elec-55","n":55,"q":"WHEN ARE THE ESSENTIAL SHEED BUSES POWERED BY HIS BATTERY?","options":[{"key":"A","text":"NEVER. THE PURPOSE OF THE SHED BUSES IS TO REDUCE THE LOAD ON THE BATTERIES."},{"key":"B","text":"IN CASE OF DOUBLE GENERATOR FAILURE."},{"key":"C","text":"AFTER EVERY IDG CONNECTION."}],"answer":"A","confidence":"h","explanation":"Nunca: las shed buses se deslastran para reducir la carga sobre las baterías.","fcomRef":"DSC-24"},{"id":"elec-56","n":56,"q":"WHEN DOES THE RAT AUTOMATICALLY DEPLOY?","options":[{"key":"A","text":"WITH THE LOSS OF TWO HYDRAULIC SYSTEMS"},{"key":"B","text":". LLCSTRICAL POWER TO BOTH AC BUS #L & #2 IS LOST AND THE AIRCRAFT SPEED IS ABOVE 100 KNOTS."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"La RAT sale automáticamente con pérdida de AC1 y AC2 y velocidad > 100 kt.","fcomRef":"DSC-24"},{"id":"elec-57","n":57,"q":"WHEN DOES THE RAT AUTOMATICALLY DEPLOY?","options":[{"key":"A","text":"WITH THE LOSS OF TWO HYDRAULIC SYSTEMS."},{"key":"B","text":"ELECTRICAL POWER TO BOTH AC BUS #1 & #2 IS LOST AND THE AIRCRAFT SPEED IS ABOVE 100 KNOTS."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"La RAT sale automáticamente con pérdida de AC1 y AC2 y velocidad > 100 kt.","fcomRef":"DSC-24"},{"id":"elec-58","n":58,"q":"WHEN NO OTHER POWER IS AVAILABLE IN FLIGHT, THE STATIC INVERTER CONVERTS POWER TO AC POWER FOR THE ____ BUS, AND _____ POWERS THE _____ BUS.","options":[{"key":"A","text":"BAT1 DC /AC ESS BUS /BAT2 /DC ESS."},{"key":"B","text":"BAT1 DC / AC ESS SHED /BAT2 /DC ESS SHED."},{"key":"C","text":"BAT1 DC / AC ESS BUS /BAT2 /DC ESS SHED."}],"answer":"A","confidence":"h","explanation":"BAT1 → static inverter → AC ESS; BAT2 → DC ESS.","fcomRef":"DSC-24"},{"id":"elec-59","n":59,"q":"WHEN WILL THE RAT & EMER GEN RED FAULT LIGHT MOMENTARY ILLUMINATES?","options":[{"key":"A","text":"WHEN THE EMER CEN IS NOT SUPPLYING ELECTRICAL POWER, AC BUSSES # I &. #2 ARE UNPOWERED AND THE NOSE GEAR IS UP."},{"key":"B","text":"WHEN THE RAT IS DEPLOYED USING HYDRAULIC RAT MAN ON PUSH BUTTON."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"A","confidence":"h","explanation":"FAULT: EMER GEN sin alimentar, AC1 y AC2 sin energía y tren de nariz arriba.","fcomRef":"DSC-24"},{"id":"elec-60","n":60,"q":"WHICH BUSSES WILL BE POWERED AFTER THE RAT IS EXTENDED AND THE EMER GEN BEGINS PRODUCING POWER?","options":[{"key":"A","text":"BATT HOT BUSSES, ESS DC, ESS DC SHED, ESS AC AND 3SS AC SHED."},{"key":"B","text":"THE STATIC INVERTER WOULD POWER BOTH HOT THE STATIC INVERTER WOULD POWER BOTH HOT BATT BUSSES, ESS DC AND ESS AC THROUGH THE ESS AC SHED BUSSES."},{"key":"C","text":"THE BATTERIES WOULD POWER BOTH HOT BATT BUSSES, ESS DC AND ESS AC THROUGH THE STATIC INVERTER."},{"key":"D","text":"ESS DC, ESS DC SHED, ESS AC AND ESS AC SXED."}],"answer":"A","confidence":"h","explanation":"Con EMER GEN: hot buses, DC ESS, DC ESS SHED, AC ESS y AC ESS SHED.","fcomRef":"DSC-24"},{"id":"elec-61","n":61,"q":"WHICH COMMUNICATION AND NAVIGATION RADIOS ARE OPERATIONAL IN THE EMERGENCY ELECTRICAL CONFIGURATION WITH THE EMER GEN POWERING THE SYSTEM?","options":[{"key":"A","text":"ACP L AND 2, VHF 1, HF, RMP L, VOR L, AND LLS L."},{"key":"B","text":"VHF L, RMP L, VOR L."},{"key":"C","text":"RMP #T &. #2, VHF #1, HF (IF EQUIPPED), ACP #1, VOR#1 AND ILS #:."},{"key":"D","text":"ALL RADIOS ARE LOST."}],"answer":"C","confidence":"h","explanation":"Con EMER GEN: RMP1 y 2, VHF1, HF1, ACP1, VOR1 e ILS1.","fcomRef":"DSC-24"},{"id":"elec-62","n":62,"q":"WHICH FLIGHT CONTROL COMPUTERS ARE OPERATIONAL IN THE EMERGENCY ELECTRICAL POWER CONFIGURATION (GEAR DOWN AND BATTERIES POWERING THE SYSTEM)?","options":[{"key":"A","text":"ALL ARE OPERATIONAL."},{"key":"B","text":"ELAC 1, SEC 1 AND FAC 1."},{"key":"C","text":"ELAC 1 AND 2, SEC 1 AND 2 FAC 1."},{"key":"D","text":"ELAC 1 AND SEC 1."}],"answer":"D","confidence":"h","explanation":"Sólo baterías con tren abajo: ELAC1 y SEC1.","fcomRef":"DSC-24"},{"id":"elec-63","n":63,"q":"WHICH FLIGHT CONTROL COMPUTERS ARE OPERATIONAL IN THE EMERGENCY ELECTRICAL POWER CONFIGURATION (GEAR DOWN AND BATTERIES POWERING THE SYSTEM)?","options":[{"key":"A","text":"ALL ARE OPERATIONAL"},{"key":"B","text":"ELAC 1, SEC 1 AND FAC 1"},{"key":"C","text":"ELAC 1 AND 2, SEC 1 AND 2 FAC 1"},{"key":"D","text":"ELAC 1 AND SEC 1"}],"answer":"D","confidence":"h","explanation":"Sólo baterías con tren abajo: ELAC1 y SEC1.","fcomRef":"DSC-24"},{"id":"elec-64","n":64,"q":"WHICH FLIGHT CONTROL COMPUTER WILL BE INOPERATIVE WITH GEAR EXTENSION WHILE IN THE EMERGENCY ELECTRICAL CONFIGURATION?","options":[{"key":"A","text":"FAC 1 AND ELAC 1"},{"key":"B","text":"SEC 1"},{"key":"C","text":"SEC 1 AND ELAC 1"},{"key":"D","text":"FAC 1"}],"answer":"D","confidence":"h","explanation":"Al bajar el tren en emergencia se pierde FAC1.","fcomRef":"DSC-24"},{"id":"elec-65","n":65,"q":"WHICH OF THE FOLLOWING AC BUSSES CAN BE POWERED BY THE EMERGENCY GENERATOR?","options":[{"key":"A","text":"AC BUS 1."},{"key":"B","text":"AC BUS 2."},{"key":"C","text":"AC ESS BUS / AC ESS SHED BUS."}],"answer":"C","confidence":"h","explanation":"El EMER GEN alimenta AC ESS y AC ESS SHED.","fcomRef":"DSC-24"},{"id":"elec-66","n":66,"q":"WHICH OF THE FOLLOWING AC BUSSES THE EMERGENCY GENERATOR CAN POWER?","options":[{"key":"A","text":"AC BUS 1."},{"key":"B","text":"AC BUS 2."},{"key":"C","text":"AC ESS BUS."}],"answer":"C","confidence":"h","explanation":"El EMER GEN alimenta AC ESS.","fcomRef":"DSC-24"},{"id":"elec-67","n":67,"q":"WHICH RADIOS ARE INOPERATIVE WITH GEAR EXTENSION WHILE IN THE EMERGENCY ELECTRICAL CONFIGURATION?","options":[{"key":"A","text":"DME 1 AND TRANSPONDER 1."},{"key":"B","text":"DME 1, DDRM1, AND TRANSPONDER 1."},{"key":"C","text":"DME, AND TRANSPONDER."},{"key":"D","text":"ILS 2 DME, AND ADF."}],"answer":"A","confidence":"m","explanation":"Con tren abajo (sólo baterías) se pierden DME1 y transponder 1. Verificar en FCOM.","fcomRef":"DSC-24"},{"id":"elec-68","n":68,"q":"WHICH VOLTAGE REQUIRES RECHARGING OR REPLACING THE BATTERIES?","options":[{"key":"A","text":"20 VOLTS."},{"key":"B","text":"24 VOLTS OR LESS."},{"key":"C","text":"25 VOLTS OR LESS."},{"key":"D","text":"26 VOLTS OR LESS."}],"answer":"C","confidence":"m","explanation":"Si el voltaje es ≤ 25,5 V hay que cargar las baterías.","fcomRef":"PRO-NOR"},{"id":"elec-69","n":69,"q":"WHILE OPERATIG ON EMERGENCY ELECTRICAL POWER WITH THE LANDING GEAR LOWERED WICH OF THE FLLOWING CONTROL LAWS IS IN EFFECT?","options":[{"key":"A","text":"BACKUP"},{"key":"B","text":"DIRECT"},{"key":"C","text":"ALTERNATE"},{"key":"D","text":"BACKUP OR ALTERNATE"}],"answer":"B","confidence":"h","explanation":"Con tren abajo, alternate law pasa a direct law.","fcomRef":"DSC-27"},{"id":"elec-70","n":70,"q":"WHILE OPERATING ON EMERGENCY ELECTRICAL POWER (EMER CEN POWERING THE SYSTEM) WHAT SHOULD THE CREW ACCOMPLISH PRIOR TO LOWERING THE LANDING GEAR?","options":[{"key":"A","text":"CHECK TO SEE THAT THE FMGC HAS AUTO TUNED THE APPROPRIATE NAV FACILITY FOR THE APPROACH TO BE ACCOMPLISHED."},{"key":"B","text":"DEPRESS THE GUARDED RMP NAV PUSH BUTTON AND TUNE THE APPROPRIATE NAV FACILITY AND COURSE FOR THE APPROACH TO BE ACCOMPLISHED."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"B","confidence":"h","explanation":"Presionar NAV en el RMP y sintonizar manualmente la radioayuda de la aproximación.","fcomRef":"PRO-ABN-24"},{"id":"elec-71","n":71,"q":"WHILE OPERATING ON EMERGENCY ELECTRICAL POWER (EMER GEN POWERING THE SYSTEM, FAC #L RESET) WHICH OF THE FOLLOWING CONTROL LAWS ARE IN EFFECT?","options":[{"key":"A","text":"MANUAL"},{"key":"B","text":"ALTERNATE."},{"key":"C","text":"BACKUP"},{"key":"D","text":"MANUAL AND BACKUP."}],"answer":"B","confidence":"h","explanation":"Ley alternate.","fcomRef":"DSC-27"},{"id":"elec-72","n":72,"q":"WHILE OPERATING ON EMERGENCY ELECTRICAL POWER (EMIR GEN POWERING THE SYSTEM) HOW IS IT POSSIBLE TO PROPERLY COMPLETE THE ECAM CHECKLIST WITH ONLY AN UPPER DISPLAY?","options":[{"key":"A","text":"DEPRESS AND HOLD THE SPECIFIC ECAM PAGE PUSH BUTTON ON THE ECAM CONTROL PANEL."},{"key":"B","text":"TRANSFER OCCURS AUTOMATICALLY."},{"key":"C","text":"THIS IS NOT POSSIBLE. USE THE COCKPIT OPERATING MANUAL"}],"answer":"A","confidence":"h","explanation":"Mantener presionado el pb de la página en el ECP para verla en la pantalla superior.","fcomRef":"DSC-31"},{"id":"elec-73","n":73,"q":"WHILE OPERATING ON EMERGENCY ELECTRICAL POWER WITH THE LANDING GEAR LOWERED WITCH OF THE FOLLOWING CONTROL LAWS IS IN EFFECT?","options":[{"key":"A","text":"BACKUP."},{"key":"B","text":"DIRECT."},{"key":"C","text":"ALTERNATE."},{"key":"D","text":"MANUAL AND BACKUP."}],"answer":"B","confidence":"h","explanation":"Con tren abajo: direct law.","fcomRef":"DSC-27"},{"id":"elec-74","n":74,"q":"WHILE OPERATING ON EMERGENCY ELECTRICAL POWER WITH THE LANDING GEAR LOWERED WITCH OF THE FOLLOWING STATEMENTS IS CORRECT?","options":[{"key":"A","text":"IF THE APU IS NOT OPERATING IT SHOULD BE STARTED AT THIS TIME."},{"key":"B","text":"THE APU WILL NOT START UNTIL THE AIRCRAFT HAS COME TO A COMPLETE STOP AND ALL POWER HAS BEEN REMOVED FOR 15 SECONDS."},{"key":"C","text":"ON THE GROUND AT 100 KNOTS, THE DC BATTERY BUS AUTOMATICALLY RECONNECTS TO THE BATTERIES ALLOWING APU START."},{"key":"D","text":"AT 70 KNOTS ESS AC IS DISCONNECTED FROM THE BATTERIES."}],"answer":"C","confidence":"h","explanation":"En tierra bajo 100 kt el DC BAT BUS se reconecta a las baterías, permitiendo arrancar el APU.","fcomRef":"DSC-24"},{"id":"elec-75","n":75,"q":"YOU ENTER A DARK COCKPIT, WHAT ACTION IS NECESSARY BEFORE CHECKING THE BATTERY VOLTAGES?","options":[{"key":"A","text":"YOU HAVE TO CHECK THAT THE EXTERNAL POWER IS ON."},{"key":"B","text":"YOU HAVE TO ENSURE THAT AT LEAST ONE BATTERY IS ON."},{"key":"C","text":"YOU HAVE TO ENSURE THAT BOTH BATTERIES ARE ON."},{"key":"D","text":"YOU HAVE TO VERIFY THAT BOTH BATTERIES ARE OFF."}],"answer":"D","confidence":"m","explanation":"Para el chequeo de voltaje, los pb BAT deben estar en OFF.","fcomRef":"PRO-NOR"}]},{"id":"fire","name":"FIRE PROTECTION","nameEs":"Protección contra incendio","questions":[{"id":"fire-1","n":1,"q":"A DISH LIGHT ON EITHER THE ENGINE OR APU FIRE AGENT WITCHES INDICATES:","options":[{"key":"A","text":"THE APU OR ENGINE FIRE SWITCH HAS BEEN PUSHED."},{"key":"B","text":"THE EXTINGUISHER BOTTLE HAS BEEN DISCHARGED."},{"key":"C","text":"A FAULT HAS OCCURRED IN THE RESPECTIVE FIRE BOTTLE."}],"answer":"B","confidence":"h","explanation":"DISCH en los pb AGENT: la botella fue descargada.","fcomRef":"DSC-26"},{"id":"fire-2","n":2,"q":"AFTER AN APU FIRE HAS BEEN DETECTED HOW LONG WILL THE CHIME CONTINUE TO SOUND?","options":[{"key":"A","text":"UNTIL THE CREW PUSHES THE RED MASTER WARN PUSH BUTTON."},{"key":"B","text":"UNTIL THE CREW PUSHES AND RELEASES THE GUARDED RED APU FIRE PUSH BUTTON."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"La campanilla del APU FIRE suena hasta presionar MASTER WARN o el pb APU FIRE.","fcomRef":"DSC-26"},{"id":"fire-3","n":3,"q":"APU FIRE DETECTION IS ACCOMPLISHED BY:","options":[{"key":"A","text":"A TWO CHANNEL SDCU LOCATED IN THE APU COMPARTMENT."},{"key":"B","text":"TWO PARALLEL FIRE DETECTION LOOPS."},{"key":"C","text":"ONE FIRE DETECTION LOOP."},{"key":"D","text":"A THREE CHANNEL SDCU LOCATED IN THE APU COMPARTMENT."}],"answer":"B","confidence":"h","explanation":"Detección APU: dos loops en paralelo (A y B).","fcomRef":"DSC-26"},{"id":"fire-4","n":4,"q":"ARE THERE ANY WARNINGS TO ALERT GROUND PERSONNEL WHEN THERE IS A FIRE IN THE APU COMPARTMENT?","options":[{"key":"A","text":"YES, BUT ONLY IF PREVIOUSLY SELECTED TO AUTOMATIC BY THE GROUND PERSONNEL."},{"key":"B","text":"NO, APU FIRE INDICATIONS ARE ONLY PRESENT IN THE COCKPIT."},{"key":"C","text":"YES, THE FLAMES."},{"key":"D","text":"YES, THE EXTERNAL FIRE WARNING HORN WILL SOUND AND THE APU RED FIRE LIGHT WILL ILLUMINATE."}],"answer":"D","confidence":"h","explanation":"Sí: en tierra suena la bocina externa del tren de nariz y se ilumina la luz roja APU FIRE en el panel externo.","fcomRef":"DSC-26"},{"id":"fire-5","n":5,"q":"CAN THE APU FIRE TEST BE PERFORME DURING BETTERY POWER ONLY?","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."}],"answer":"A","confidence":"h","explanation":"Sí: el test de fuego del APU puede hacerse con baterías.","fcomRef":"DSC-26"},{"id":"fire-6","n":6,"q":"EACH ENGINE NACELLE AND PYLON AREA IS EQUIPPED WITH:","options":[{"key":"A","text":"TWO FIRE DETECTION LOOPS."},{"key":"B","text":"A SINGLE FIRE DETECTION LOOP."},{"key":"C","text":"TWO SMOKE DETECTORS AND TWO FIRE DETECTION LOOPS."},{"key":"D","text":"A SINGLE FIRE DETECTION LOOP AND A SINGLE SMOKE DETECTOR."}],"answer":"A","confidence":"h","explanation":"Cada motor (nacelle y pylon): dos loops de detección.","fcomRef":"DSC-26"},{"id":"fire-7","n":7,"q":"EACH LAVATORY IS EQUIPPED WITH:","options":[{"key":"A","text":"TWO SMOKE DETECTORS AND ONE SMOKE DETECTION CONTROL UNIT."},{"key":"B","text":"ONE SMOKE DETECTOR AND ONE SMOKE DETECTION CONTROL UNIT."},{"key":"C","text":"ONE SMOKE DETECTOR, AND FOR LAVATORY WASTE BINS, AN AUTOMATICALLY DISCHARGING FIRE EXTINGUISHER."},{"key":"D","text":"TWO SMOKE DETECTORS AND TWO AUTOMATICALLY DISCHARGING FIRE EXTINGUISHERS."}],"answer":"C","confidence":"h","explanation":"Cada lavatorio: un detector de humo y un extintor automático en el waste bin.","fcomRef":"DSC-26"},{"id":"fire-8","n":8,"q":"ENGINE FIRE LOOPS ARE INSTALLED IN THE:","options":[{"key":"A","text":"PYLON NACELLE."},{"key":"B","text":"CORE."},{"key":"C","text":"FAN."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"D","confidence":"h","explanation":"Loops en pylon nacelle, core y fan.","fcomRef":"DSC-26"},{"id":"fire-9","n":9,"q":"HOW DOES THE APU FIRE TEST ON BATTERY POWER DIFFER FROM THE APU FIRE TEST WITH ALL BUSSES POWERED?","options":[{"key":"A","text":"THERE IS NO DIFFERENCE."},{"key":"B","text":"WHILE ON BATTERY POWER, ONLY THE RED APU FIRE AND AGENT/DISC PUSH BUTTON WILL ILLUMINATE."},{"key":"C","text":"IT IS NOT POSSIBLE TO TEST THE APU FIRE PROTECTION WHILE ON BATTERY POWER."}],"answer":"B","confidence":"h","explanation":"Con baterías sólo se encienden el pb APU FIRE y las luces SQUIB/DISC del agente.","fcomRef":"DSC-26"},{"id":"fire-10","n":10,"q":"HOW LONG WILL THE RED APU FIRE PB ON THE OVERHEAD BE ILLUMINATED?","options":[{"key":"A","text":"UNTIL THE CREW PUSHES AND RELEASES THE GUARDED RED APU FIRE PUSH BUTTON."},{"key":"B","text":"FOR AS LONG AS THE FIRE WARNING IS PRESENT."},{"key":"C","text":"UNTIL THE CREW PUSHES THE RED MASTER WARN PUSH BUTTON."}],"answer":"B","confidence":"h","explanation":"El pb APU FIRE queda iluminado mientras haya alerta de fuego.","fcomRef":"DSC-26"},{"id":"fire-11","n":11,"q":"HOW MANY FIRE EXTINGUISHING BOTTLES ARE AVAILABLE FOR FIGHTING AN APU FIRE?","options":[{"key":"A","text":"ONE."},{"key":"B","text":"TWO."},{"key":"C","text":"ONE CYLINDER SHARED WITH THE AFT CARGO COMPARTMENT."},{"key":"D","text":"TWO CYLINDERS SHARED WITH THE AFT CARGO COMPARTMENT."}],"answer":"A","confidence":"h","explanation":"Una botella para el APU.","fcomRef":"DSC-26"},{"id":"fire-12","n":12,"q":"HOW MANY HALON FIRE EXTINGUISHING CYLINDERS ARE PER ENGINE?","options":[{"key":"A","text":"EACH ENGINE HAS TWO FIRE EXTINGUISHERS."},{"key":"B","text":"EACH ENGINE HAS IT\\'S OWN DEDICATED FIRE EXTINGUISHER AND HAS THE CAPABILITY TO SHARE THE OTHER ENGINE\\'S CYLINDER."},{"key":"C","text":"EACH ENGINE HAS IT'S OWN DEDICATED FIRE EXTINGUISHER AND HAS THE CAPABILITY TO SHARE ONE CENTRALLY LOCATED HALON CYLINDER."},{"key":"D","text":"EACH ENGINE HAS ONE FIRE EXTINGUISHER."}],"answer":"A","confidence":"h","explanation":"Dos botellas por motor.","fcomRef":"DSC-26"},{"id":"fire-13","n":13,"q":"IF A BREAK IN BOTH ENGINE FIRE LOOPS OCCURS WITHIN __________ SECONDS OF EACH OTHER A __________ WILL OCCUR.","options":[{"key":"A","text":"10 SEC. A FIRE WARNING."},{"key":"B","text":"5 SEC. A FIRE DET FAULT MESSAGE ON ECAM."},{"key":"C","text":"5 SEC. A FIRE WARNING."}],"answer":"C","confidence":"h","explanation":"Si ambos loops fallan dentro de 5 s (por llama), se genera FIRE warning.","fcomRef":"DSC-26"},{"id":"fire-14","n":14,"q":"IF AN APU FIRE IS DETECTED ON THE GROUND, THE APU SHUTS DOWN AUTOMATICALLY AND THE AGENT IS DISCHARGED _____ AFTER THE WARNING IS ACTIVATED.","options":[{"key":"A","text":"IMMEDIATELY."},{"key":"B","text":"1 SECONDS."},{"key":"C","text":"3 SECONDS."},{"key":"D","text":"6 SECONDS."}],"answer":"C","confidence":"h","explanation":"En tierra: el APU se apaga y el agente se descarga automáticamente 3 s después.","fcomRef":"DSC-26"},{"id":"fire-15","n":15,"q":"IF AN ENGINE FIRE IS DETECTED, WHEN WILL THE GUARDED RED ENG FIRE PUSH BUTTON LIGHT EXTINGUISH?","options":[{"key":"A","text":"ONLY AFTER THE FIRE WARNING NO LONGER EXISTS."},{"key":"B","text":"WHEN THE CREW PUSHES AND RELEASES THE GUARDED RED ENGINE FIRE PUSHBUTTON."},{"key":"C","text":"WHEN THE CREW PUSHES THE RED MASTER WARN PUSHBUTTON."},{"key":"D","text":"WHEN THE CREW PUSHES THE RED MASTER WARN PUSHBUTTON AND THEN RELEASES THE GUARDED ENGINE FIRE PUSHBUTTON."}],"answer":"A","confidence":"h","explanation":"El pb ENG FIRE se apaga sólo cuando desaparece la condición de fuego.","fcomRef":"DSC-26"},{"id":"fire-16","n":16,"q":"IF THERE IS AN APU FIRE IN FLIGHT THE APU:","options":[{"key":"A","text":"WILL AUTOMATICALLY SHUT DOWN AND THE FIRE BOTTLE WILL DISCHARGE."},{"key":"B","text":"MUST BE SHUT DOWN MANUALLY AND THE AGENT MANUALLY DESCHARGED."},{"key":"C","text":"MUST BE SHUT DOWN MANUALLY BUT THE FIRE BOTTLE WILL DISCHARGE AUTOMATICALLY."}],"answer":"B","confidence":"h","explanation":"En vuelo el APU se apaga y se descarga manualmente.","fcomRef":"DSC-26"},{"id":"fire-17","n":17,"q":"IF YOU PERFORM THE APU FIRE TEST WITH ONLY DC POWER AVAILABLE, YOU GET THE MASTER WARN ON THE ECAM.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"m","explanation":"Falso: con sólo DC (baterías) el ECAM no está disponible; sólo se encienden las luces del panel APU FIRE.","fcomRef":"DSC-26"},{"id":"fire-18","n":18,"q":"IN ADDITION TO THE CRC AND RED MASTER WARN LIGHT, A GOOD ENGINE FIRE TEST WILL DISPLAY WHICH OF THE FOLLOWING (AC POWER AVAILABLE)?","options":[{"key":"A","text":"THE CRC AND RED MASTER WARN LIGHT INDICATE A POSITIVE ENGINE FIRE TEST."},{"key":"B","text":"LOWER ECAM ENGINE PAGE, PEDESTAL MOUNTED RED FIRE ANNUNCIATOR, RED ENG FIRE PUSH BUTTON AND THE AGENT SWUIB/DISC LIGHTS ILLUMINATE."},{"key":"C","text":"E/WD RED 1 (2) ENG FIRE WARNING, LOWER ECAM ENGINE PAGE, RED FIRE ANNUNCIATOR, RED ENG FIRE PUSH BUTTON, AND AGENT SQUIB/DISC."}],"answer":"C","confidence":"h","explanation":"Test bueno: E/WD ENG FIRE, página ENG, luces FIRE del pedestal, pb ENG FIRE y SQUIB/DISC.","fcomRef":"DSC-26"},{"id":"fire-19","n":19,"q":"IN THE EVENT A LAVATORY SMOKE DETECTOR DETECTS SMOKE:","options":[{"key":"A","text":"WARNINGS WILL BE GENERATED ONLY IN THE COCKPIT."},{"key":"B","text":"WARNINGS WILL BE GENERATED ONLY ON THE FLIGHT DECK."},{"key":"C","text":"WARNINGS WILL BE GENERATED IN THE COCKPIT AND IN THE CABIN."}],"answer":"C","confidence":"h","explanation":"Humo en lavatorio: alertas en la cabina de mando y en la cabina de pasajeros.","fcomRef":"DSC-26"},{"id":"fire-20","n":20,"q":"IN THE EVENT AND AFT CARGO COMPARTMENT SMOKE DETECTOR DETECTS SMOKE:","options":[{"key":"A","text":"EXTINGUISHING IS AUTOMATIC."},{"key":"B","text":"EXTINGUISHING IS AUTOMATIC ONLY WHILE ON THE GROUND."},{"key":"C","text":"THE CREW MUST DEPRESS THE APPROPRIATE DISCH SWITCH."}],"answer":"C","confidence":"h","explanation":"Cargo: la descarga es manual (pb DISCH).","fcomRef":"DSC-26"},{"id":"fire-21","n":21,"q":"IN THE EVENT THAT THE AFT CARGO COMPARTMENT SMOKE DETECTOR, DETECTS SMOKE:","options":[{"key":"A","text":"ONLY AN ECAM MESSAGE WILL BE GENERATED."},{"key":"B","text":"ONLY A MASTER WARN AND A CRC WILL BE GENERATED."},{"key":"C","text":"A MASTER WARN, CRC AND AN ECAM MESSAGE WILL BE GENERATED."},{"key":"D","text":"A CRC AND AN ECAM MESSAGE WILL BE GENERATED."}],"answer":"C","confidence":"h","explanation":"Humo en cargo: MASTER WARN, CRC y mensaje ECAM.","fcomRef":"DSC-26"},{"id":"fire-22","n":22,"q":"STATUS PAGE: INOP SYS INDICATES ENG 1 LOOP B.","options":[{"key":"A","text":"ONE FIRE DETECTION LOOP HAS FAILED. FIRE DETECTION FOR BOTH ENGINES IS NOT AVAILABLE."},{"key":"B","text":"ONE DETECTION LOOP FOR ENGINE 1 HAS FAILED. FIRE DETECTION FOR BOTH ENGINES IS STILL AVAILABLE."},{"key":"C","text":"ONE FIRE DETECTION LOOP OF ENGINE 1 HAS FAILED. FIRE DETECTION FOR ENGINE 1 IS INOPERATIVE."},{"key":"D","text":"BOTH FIRE DETECTION LOOPS OF ENGINE 1 HAVE FAILED. FIRE DETECTION FOR ENGINE 1 IS INOPERATIVE."}],"answer":"B","confidence":"h","explanation":"Falló un loop del motor 1; la detección sigue disponible en ambos motores.","fcomRef":"DSC-26"},{"id":"fire-23","n":23,"q":"THE A-320 HAS DUAL FIRE DETECTOR LOOPS TO ENSURE THAT A FAULT IN ONE FIRE LOOP WILL NOT AFFECT FIRE DETECTION CAPABILITIES.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: lógica de doble loop.","fcomRef":"DSC-26"},{"id":"fire-24","n":24,"q":"THE AFT CARGO COMPARTMENT SMOKE DETECTION SYSTEM CONSISTS OF:","options":[{"key":"A","text":"A DUAL LOOP SMOKE DETECTOR."},{"key":"B","text":"FOUR SMOKE DETECTORS AND A TWO CHANNEL SMOKE DETECTION CONTROL UNIT."},{"key":"C","text":"ONE SMOKE DETECTOR, ONE SMOKE DETECTION CONTROL UNIT AND TWO AUTOMATICALLY DISCHARGING FIRE EXTINGUISHERS."},{"key":"D","text":"THREE SMOKE DETECTORS, ONE SMOKE DETECTION CONTROL UNIT AND TWO AUTOMATICALLY DISCHARGING FIRE EXTINGUISHERS."}],"answer":"B","confidence":"m","explanation":"Cargo AFT: varios detectores (4 en A320) y SDCU de dos canales.","fcomRef":"DSC-26"},{"id":"fire-25","n":25,"q":"THE APU PROVIDES FOR AUTOMATIC FIRE EXTINGUISHING:","options":[{"key":"A","text":"ON THE GROUND ONLY."},{"key":"B","text":"ON THE GROUND AND IN FLIGHT."},{"key":"C","text":"ONLY WHEN SELECTED TO AUTOMATIC BY GROUND PERSONNEL."}],"answer":"A","confidence":"h","explanation":"Extinción automática del APU sólo en tierra.","fcomRef":"DSC-26"},{"id":"fire-26","n":26,"q":"THE AVIONICS COMPARTMENT IS THE ONLY AREA WHERE THERE IS NO FIRE EXTINGUISHING SYSTEM INSTALLED.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"m","explanation":"Verdadero: la aviónica sólo tiene detección de humo, sin extinción fija.","fcomRef":"DSC-26"},{"id":"fire-27","n":27,"q":"THE ENGINE EXTINGUISHING AGENT SWITCH IS ARMED WHEN:","options":[{"key":"A","text":"THE DISCH LIGHT IS ON."},{"key":"B","text":"THE ENGINE FIRE SWITCH ILLUMINATES."},{"key":"C","text":"THE ENGINE FIRE SWITCH IS RELEASED OUT."}],"answer":"C","confidence":"h","explanation":"El agente se arma al soltar (sacar) el pb ENG FIRE.","fcomRef":"DSC-26"},{"id":"fire-28","n":28,"q":"WHAT SYSTEMS ARE AFFECTED WHEN THE GUARDED RED ENGINE FIRE PUSH BUTTON IS PUSHED AND RELEASED?","options":[{"key":"A","text":"THE MASTER WARNING AND THE CHIME WILL BE CANCELED AND THE AGENT PB'S WILL BE ARMED."},{"key":"B","text":"ALL FLUIDS, PNEUMATICS AND ELECTRICS RELATING TO THAT ENGINE ARE SHUT OFF."},{"key":"C","text":"BOTH ARE CORRECT."}],"answer":"C","confidence":"h","explanation":"Se cancela la alarma, se arman los agentes y se cortan fluidos, aire y electricidad del motor.","fcomRef":"DSC-26"},{"id":"fire-29","n":29,"q":"WHEN THE AIRCRAFT IS ON THE GROUND AND THE APU IS STARTED ON BETTERY POWER ONLY, IS FIRE PROTECTION AVAILABLE?","options":[{"key":"A","text":"YES, THE APU WILL INITIATE AN AUTO SHUTDOWN AND DISCHARGE THE EXTINGUISHING AGENT."},{"key":"B","text":"NO, BUT THE APU WILL INITIATE AN AUTO SHUTDOWN."},{"key":"C","text":"NO, AUTOMATIC FIRE PROTECTION IS ONLY AVAILABLE IF AC POWER IS AVAILABLE."}],"answer":"A","confidence":"h","explanation":"Sí: con baterías hay auto shutdown y descarga automática en tierra.","fcomRef":"DSC-26"},{"id":"fire-30","n":30,"q":"WHEN THE APU FIRE SWITCH IS RELEASED OUT:","options":[{"key":"A","text":"SHUTS DOWN THE APU."},{"key":"B","text":"ARMS THE SQUIB ON THE APU FIRE EXTINGUISHER."},{"key":"C","text":"THE APU BLEED AND CROSS BLEED VALVES ARE CLOSED."},{"key":"D","text":"ALL THE ABOVE."}],"answer":"D","confidence":"h","explanation":"APU FIRE pb: apaga el APU, arma el squib y cierra APU bleed y crossbleed.","fcomRef":"DSC-26"},{"id":"fire-31","n":31,"q":"WHICH OF THE FOLLOWING HAVE AUTOMATIC FIRE EXTINGUISHING SYSTEMS?","options":[{"key":"A","text":"APU ON GROUND AND LAVATORY WASTE BINS."},{"key":"B","text":"APU ON GROUND, LAVATORY WASTE BINS AND AVIONICS BAY."},{"key":"C","text":"APU ON GROUND, AFT CARGO, FORWARD CARGO, LAVATORY WASTE BINS AND AVIONICS BAY."},{"key":"D","text":"LAVATORY WASTE BINS."}],"answer":"A","confidence":"h","explanation":"Extinción automática: APU en tierra y waste bins de lavatorios.","fcomRef":"DSC-26"},{"id":"fire-32","n":32,"q":"WILL AN APU FIRE TEST SHUT SOWN THE APU?","options":[{"key":"A","text":"YES."},{"key":"B","text":"NO."}],"answer":"B","confidence":"h","explanation":"No: el test no apaga el APU.","fcomRef":"DSC-26"},{"id":"fire-33","n":33,"q":"WITH REFERENCE TO CARGO COMPARTMENT FIRE EXTINGUISHING, WHICH STATEMENT IS TRUE?","options":[{"key":"A","text":"THERE ARE TWO FIRE BOTTLES, ONE FR THE FWD COMPARTMENT AND ONE FOR THE AFT."},{"key":"B","text":"THERE IS ONLY ONE FIRE BOTTLE, PRESSING EITHER DISCH PUSH BUTTON DISCHARGES IT INTO BOTH COMPARTEMENTS."},{"key":"C","text":"THERE IS ONLY ONE FIRE BOTTLE, WHEN IT IS DISCHARGED BOTH AMBER DISCH LIGHTS COME ON."},{"key":"D","text":"THERE ARE TWO FIRE BOTTLES, WHEN THE DISCH PUSHBUTTON IS PRESSED, THEY ARE BOTH DISCHARGED INTO THE APPROPRIATE COMPARTMENT."}],"answer":"C","confidence":"m","explanation":"Una sola botella para cargo FWD/AFT; al descargarse se encienden ambas luces DISCH.","fcomRef":"DSC-26"}]},{"id":"fuelhyd","name":"FUEL SYSTEM & HYDRAULICS","nameEs":"Combustible e hidráulico","questions":[{"id":"fuelhyd-1","n":1,"q":"AFTER ENGINE SHUTDOWN, WHAT ARE YOUR ACTIONS TO CLOSE THE FUEL TRANSFER VALVES?","options":[{"key":"A","text":"YOU HAVE TO SWITCH THE INNER TANK PUMPS OFF."},{"key":"B","text":"YOU HAVE TO CALL MAINTENANCE TO CLOSE THE VALVES."},{"key":"C","text":"NO ACTION IS REQUIRED. THE VALVES WILL CLOSE AUTOMATICALLY DURING THE NEXT REFUELLING."}],"answer":"C","confidence":"h","explanation":"Las transfer valves se cierran automáticamente en la siguiente recarga.","fcomRef":"DSC-28"},{"id":"fuelhyd-2","n":2,"q":"AFTER ENGINE START, CENTER TANK FUEL PUMPS RUN FOR _______ MINUTES REGARDLESS OF SLAT POSITION.","options":[{"key":"A","text":"1 MINUTE."},{"key":"B","text":"2 MINUTES."},{"key":"C","text":"3 MINUTES."},{"key":"D","text":"5 MINUTES."}],"answer":"B","confidence":"h","explanation":"Las bombas del tanque central funcionan 2 min tras el arranque (test), sin importar los slats.","fcomRef":"DSC-28"},{"id":"fuelhyd-3","n":3,"q":"AFTER EXTENDING THE RAT, IS IT POSSIBLE TO CHECK IT'S POSITION AND STATUS?","options":[{"key":"A","text":"CHECK TO SEE IF THE BLUE SYSTEM ELEC PUMP FAULT LIGHT IS NOT ILLUMINATED."},{"key":"B","text":"YES, SELECT THE ECAM ELEC PAGE."},{"key":"C","text":"NO."},{"key":"D","text":"YES, SELECT THE ECAM HYD PAGE."}],"answer":"D","confidence":"h","explanation":"La página HYD del ECAM muestra la RAT.","fcomRef":"DSC-29"},{"id":"fuelhyd-4","n":4,"q":"AN AMBER LINE APPEARS ACROSS THE LAST TWO DIGITS OF THE ECAM FOB INDICATION WHEN:","options":[{"key":"A","text":"FUEL QUANTITY IS UNRELIABLE."},{"key":"B","text":"THE CENTER TANK PUMPS ARE SWITCHED OFF."},{"key":"C","text":"THE CENTER TANK PUMPS HAVE FAILED."}],"answer":"A","confidence":"h","explanation":"Línea ámbar en los últimos dígitos del FOB: cantidad de combustible no confiable.","fcomRef":"DSC-28"},{"id":"fuelhyd-5","n":5,"q":"AS LONG AS THE LANDING GEAR LEVER IS UP A HYDRAULIC SAFETY VALVE CLOSES TO CUT OFF THE HYDRAULIC SUPPLY TO THE GEAR WHEN THE AIRSPEED IS:","options":[{"key":"A","text":"GREATER THAN 260 KIAS."},{"key":"B","text":"GREATER THAN 230 KIAS."},{"key":"C","text":"LESS THAN 260 KIAS."},{"key":"D","text":"LESS THAN 230 KIAS."}],"answer":"A","confidence":"h","explanation":"Con gear lever UP, la safety valve corta el hidráulico del tren a más de 260 kt.","fcomRef":"DSC-32"},{"id":"fuelhyd-6","n":6,"q":"AUTO BRAKING IS INITIATED BY:","options":[{"key":"A","text":"STRUT COMPRESSION."},{"key":"B","text":"REVERSER ACTION."},{"key":"C","text":"GROUND SPOILER EXTENSION COMMAND."}],"answer":"C","confidence":"h","explanation":"El autobrake se inicia con la orden de extensión de ground spoilers.","fcomRef":"DSC-32"},{"id":"fuelhyd-7","n":7,"q":"CAN THE POSITION OF THE WING FUEL TRANSFER VALVES BE CHECKED?","options":[{"key":"A","text":"YES, ONLY ON THE REFUELING PANEL."},{"key":"B","text":"IT IS NOT POSSIBLE TO DETERMINE THEIR POSITION."},{"key":"C","text":"ONLY ON THE ECAM FUEL PAGE."},{"key":"D","text":"NONE OF THE ABOVE."}],"answer":"C","confidence":"m","explanation":"La posición de las transfer valves se ve en la página FUEL del ECAM.","fcomRef":"DSC-28"},{"id":"fuelhyd-8","n":8,"q":"CENTER TANK PUMPS DO NOT STOP 5 MIN AFTER CENTER TANK LOW LEVEL REACHED. WHERE WE CAN SEE THAT.","options":[{"key":"A","text":"YES, ONLY ON THE REFUELING PANEL."},{"key":"B","text":"IT IS NOT POSSIBLE TO DETERMINE THEIR POSITION."},{"key":"C","text":"ONLY ON THE ECAM FUEL PAGE."}],"answer":"C","confidence":"m","explanation":"Se ve en la página FUEL del ECAM.","fcomRef":"DSC-28"},{"id":"fuelhyd-9","n":9,"q":"DURING NORMAL OPERATIONS WHEN SHOULD THE FUEL TRANSFER VALVES OPEN?","options":[{"key":"A","text":"WHEN A LOW LEVEL IS SENSED IN THE CENTER TANK."},{"key":"B","text":"WHEN A LOW LEVEL IS SENSED IN EITHER OUTER WING CELL."},{"key":"C","text":"WHEN LOW LEVEL IS SENSED IN EITHER INNER WING CELL."}],"answer":"C","confidence":"h","explanation":"Abren cuando se detecta low level en una celda interior del ala.","fcomRef":"DSC-28"},{"id":"fuelhyd-10","n":10,"q":"FLUID CAN BE TRANSFERRED BETWEEN HYDRAULIC SYSTEMS.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: no hay transferencia de fluido entre sistemas (la PTU transmite potencia, no fluido).","fcomRef":"DSC-29"},{"id":"fuelhyd-11","n":11,"q":"FOR HYDRAULIC SYSTEM MALFUNCTIONS, WHEN WILL THE RAT DEPLOY?","options":[{"key":"A","text":"AUTOMATICALLY WITH THE FAILURE OF BOTH THE GREEN AND BLUE HYDRAULIC SYSTEMS."},{"key":"B","text":"AUTOMATICALLY WITH THE FAILURE OF BOTH THE GREEN AND YELLOW HYDRAULIC SYSTEMS."},{"key":"C","text":"ONLY WHEN THE GUARDED RAT MAN ON PUSH BUTTON IS SELECTED BY THE CREW."},{"key":"D","text":"WHEN AIRSPEED DROPS BELOW 100 KNOTS WITH THE GEAR UP."}],"answer":"C","confidence":"h","explanation":"Por fallas hidráulicas la RAT sólo se despliega manualmente (RAT MAN ON).","fcomRef":"DSC-29"},{"id":"fuelhyd-12","n":12,"q":"FROM WHICH TANKS WILL FUEL GRAVITY FEED?","options":[{"key":"A","text":"OUTER CELL OF THE WING TANKS, INNER CELL OF THE WING TANKS, AND/OR CENTER TANK."},{"key":"B","text":"INNER CELL OF THE WING TANKS, AND CENTER TANK."},{"key":"C","text":"OUTER CELL OF THE WING TANKS, AND INNER CELL OF THE WING TANKS."},{"key":"D","text":"THE CENTER TANK ONLY."}],"answer":"C","confidence":"h","explanation":"Por gravedad alimentan sólo los tanques de ala (outer e inner).","fcomRef":"DSC-28"},{"id":"fuelhyd-13","n":13,"q":"FUEL CAN BE TRANSFERRED FROM TANK TO TANK:","options":[{"key":"A","text":"ONLY ON THE GROUND."},{"key":"B","text":"IN FLIGHT IF THE FUEL X FEED PUSH BUTTON IS SELECTED OPEN."},{"key":"C","text":"IN FLIGHT IF THE FUEL X FEED PUSH BUTTON IS SELECTED OPEN AND CENTER TANK MODE SEL PUSH BUTTON IS SELECTED TO MAN."},{"key":"D","text":"FUEL CAN NEVER BE TRANSFERRED."}],"answer":"A","confidence":"h","explanation":"La transferencia entre tanques sólo en tierra (refuel/defuel).","fcomRef":"DSC-28"},{"id":"fuelhyd-14","n":14,"q":"FUEL TRANSFER FROM THE OUTER COMPARTMENT TO THE INNER COMPARTMENT OF THE WING TANKS OCCURS WHEN THE INNER COMPARTMENT QUANTITY DECREASES TO:","options":[{"key":"A","text":"250 KILOGRAMS."},{"key":"B","text":"450 KILOGRAMS."},{"key":"C","text":"750 KILOGRAMS."},{"key":"D","text":"5000 KILOGRAMS."}],"answer":"C","confidence":"h","explanation":"Outer → inner cuando el inner baja a ~750 kg.","fcomRef":"DSC-28"},{"id":"fuelhyd-15","n":15,"q":"FUEL TRANSFER FROM THE OUTER COMPARTMENT TO THE INNER COMPARTMENT OF THE WING TANKS OCCURS WHEN THE INNER COMPARTMENT QUANTITY DECREASES TO:","options":[{"key":"A","text":"250 KILOGRAMS."},{"key":"B","text":"450 KILOGRAMS."},{"key":"C","text":"750 KILOGRAMS."},{"key":"D","text":"5000 KILOGRAMS."}],"answer":"C","confidence":"h","explanation":"Outer → inner cuando el inner baja a ~750 kg.","fcomRef":"DSC-28"},{"id":"fuelhyd-16","n":16,"q":"GRAVITY FEED TO THE ENGINES IS ENABLED FROM:","options":[{"key":"A","text":"THE WING AND CENTER TANKS."},{"key":"B","text":"THE CENTER TANK ONLY."},{"key":"C","text":"THE WING TANKS ONLY."}],"answer":"C","confidence":"h","explanation":"Gravedad sólo desde los tanques de ala.","fcomRef":"DSC-28"},{"id":"fuelhyd-17","n":17,"q":"HOW HAS THE FUEL BEEN TRANSFERRED FROM THE OUTER TO THE INNER TANKS?","options":[{"key":"A","text":"BY SETTING THE MODE SEL PUSHBUTTON TO MAN."},{"key":"B","text":"THE TRANSFER VALVE HAS BEEN OPENED AUTOMATICALLY BY THE LOW LEVER SENSOR IN THE CENTER TANKS."},{"key":"C","text":"BY SETTING THE MODE SEL PB TO AUTO."},{"key":"D","text":"THE TRANSFER VALVE HAS BEEN OPENED AUTOMATICALLY BE THE LOW LEVEL SENSOR IN THE INNER TANK."}],"answer":"D","confidence":"h","explanation":"La transfer valve se abrió por el sensor de low level del inner tank.","fcomRef":"DSC-28"},{"id":"fuelhyd-18","n":18,"q":"HOW MANY PUMPS HAVE THE YELLOW SYSTEM TO PROVIDE PRESSURE (NOT COUNTING THE PTU)?","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"B","confidence":"m","explanation":"Sistema amarillo: bomba del motor + bomba eléctrica (la manual sólo UT ARE SHOWN IN ____ ON THE ECAM E/WD.","options":[{"key":"A","text":"BLUE."},{"key":"B","text":"AMBER."},{"key":"C","text":"RED."}],"answer":"A","confidence":"h","explanation":"Las acciones a realizar se muestran en azul.","fcomRef":"DSC-31"},{"id":"indicating-2","n":2,"q":"AN \"STS\" MESSAGE WILL FLASH ON THE ENGINE/WARNING DISPLAY AFTER ENGINE SHUTDOWN TO:","options":[{"key":"A","text":"ALERT MAINTENANCE."},{"key":"B","text":"ALERT THE CREW."},{"key":"C","text":"REMIND THE CREW TO TURN OFF THE ECAM."}],"answer":"A","confidence":"m","explanation":"STS intermitente tras apagar motores: alerta para mantenimiento de que existen ítems de estado.","fcomRef":"DSC-31"},{"id":"indicating-3","n":3,"q":"A \"TO INHIBIT\" OR \"LDG INHIBIT\" MEMO IS DISPLAYED IN MAGENTA TO REMIND THE CREW:","options":[{"key":"A","text":"THE TAKEOFF OR LANDING IS INHIBITED."},{"key":"B","text":"MOST OF THE FAILURE TITLES AND ASSOCIATED CHECKLISTS ARE SUPPRESSED."},{"key":"C","text":"ALL OF THE FAILURE TITLES AND ASSOCIATED CHECKLISTS ARE SUPPRESSED."}],"answer":"B","confidence":"h","explanation":"T.O/LDG INHIBIT: se suprime la mayoría de las alertas.","fcomRef":"DSC-31"},{"id":"indicating-4","n":4,"q":"FOLLOWING A FAILURE OF THE ECAM CONTROL PANEL:","options":[{"key":"A","text":"THE ECAM IS LOST."},{"key":"B","text":"SYSTEM PAGES CAN BE DISPLAYED BY PRESSING THE ALL SIWITCH."},{"key":"C","text":"THE ECAM PAGES AUTOMATICALLY TRANSFER TO THE ND."}],"answer":"B","confidence":"h","explanation":"Con falla del ECP, las páginas pueden verse con el pb ALL (cableado directo).","fcomRef":"DSC-31"},{"id":"indicating-5","n":5,"q":"IF A PFD FAILS, DOES ANYTHING HAPPEN AUTOMATICALLY?","options":[{"key":"A","text":"THE ATT HDG SWITCH MUST BE USED ON THE SWITCHING PANEL IN ORDER TO RECOVER PFD INFORMATION."},{"key":"B","text":"YES, THE IMAGE AUTOMATICALLY TRANSFERS TO THE DISPLAY FORMERLY OCCUPIED BY THE ND."},{"key":"C","text":"YES, THE IMAGE AUTOMATICALLY TRANSFERS TO THE UPPER ECAM."},{"key":"D","text":"NO."}],"answer":"B","confidence":"h","explanation":"Falla de PFD: la imagen pasa automáticamente al DU del ND.","fcomRef":"DSC-31"},{"id":"indicating-6","n":6,"q":"IF BOTH ECAM SCREENS FAIL OR ARE SWITCHED OFF, THE E/WD INFORMATION IS:","options":[{"key":"A","text":"AUTOMATICALLY TRANSFERRED TO THE CAPT.'S PFD."},{"key":"B","text":"LOST FOR THE REST OF THE FLIGHT."},{"key":"C","text":"DISPLAYED ON AN ND USING THE ECAM/ND XFR SWITCH."}],"answer":"C","confidence":"h","explanation":"Con ambas pantallas ECAM fuera: E/WD en un ND con ECAM/ND XFR.","fcomRef":"DSC-31"},{"id":"indicating-7","n":7,"q":"IF THE UPPER ECAM SECREEN FAILS, THE E/WD DATA IS:","options":[{"key":"A","text":"LOST FOR THE REST OF THE FLIGHT."},{"key":"B","text":"AUTOMATICALLY TRANSFERRED TO THE LOWER SCREEN."},{"key":"C","text":"MANUALLY TRANSFERRED TO THE MCDU."}],"answer":"B","confidence":"h","explanation":"Falla de la pantalla superior: E/WD pasa automáticamente a la inferior.","fcomRef":"DSC-31"},{"id":"indicating-8","n":8,"q":"MEMO DISPLAY IS LOCATED ON THE:","options":[{"key":"A","text":"MCDU."},{"key":"B","text":"SD MEMO SECTION."},{"key":"C","text":"E/WD MEMO SECTION."}],"answer":"C","confidence":"h","explanation":"MEMO en la sección memo del E/WD.","fcomRef":"DSC-31"},{"id":"indicating-9","n":9,"q":"THE A-320 ELECTRONIC FLIGHT INSTRUMENT SYSTEM (EFIS) CONSISTS OF ________ IDENTICAL DISPLAY UNITS.","options":[{"key":"A","text":"4"},{"key":"B","text":"6"},{"key":"C","text":"8"}],"answer":"B","confidence":"h","explanation":"Seis DU idénticas.","fcomRef":"DSC-31"},{"id":"indicating-10","n":10,"q":"THE ELECTRONIC CENTRALIZED AIRPLANE MONITORING (ECAM) SYSTEM PRESENTS DATA ON TWO IDENTICAL CRT DISPLAYS, THEY ARE:","options":[{"key":"A","text":"THE PFD AND THE ND."},{"key":"B","text":"THE ND AND THE E/WD."},{"key":"C","text":"THE E/WD AND THE SD."}],"answer":"C","confidence":"h","explanation":"ECAM: E/WD y SD.","fcomRef":"DSC-31"},{"id":"indicating-11","n":11,"q":"THE SPEED TREND ARROW ON THE PFD AIRSP
