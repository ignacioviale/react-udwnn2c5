RGENCY OVERWING EXIT WILL:","options":[{"key":"A","text":"INFLATE THE SLIDE AT THE LEADING EDGE OF THE WING."},{"key":"B","text":"AUTOMATICALLY INFLATE THE DOUBLE LANE SLIDE OFF THE TRAILING EDGE OF THE WING."},{"key":"C","text":"ONLY ARM THE OVERWING SLIDE."}],"answer":"B","confidence":"h","explanation":"Al abrir la salida sobre ala se infla el tobogán por el borde de fuga.","fcomRef":"DSC-52"},{"id":"gear-32","n":32,"q":"THE A-320 CARGO DOORS CAN BE OPERATED BY EITHER AN ___ OR A ____TO PRESSURIZE THE _____ HYDRAULIC SYSTEM.","options":[{"key":"A","text":"ELECTRIC PUMP, HAND PUMP, GREEN."},{"key":"B","text":"MECHANICAL PUMP, HAND PUMP, YELLOW."},{"key":"C","text":"ELECTRIC PUMP, HAND PUMP, YELLOW."}],"answer":"C","confidence":"h","explanation":"Puertas de carga: bomba eléctrica o bomba manual del sistema amarillo.","fcomRef":"DSC-52"},{"id":"gear-33","n":33,"q":"THE ALTERNATE BRAKE SYSTEM HAS THE SAME CAPABILITIES AS NORMAL BRAKES EXCEPT:","options":[{"key":"A","text":"ANTI-SKID IS INOPERATIVE."},{"key":"B","text":"AUTOBRAKES ARE INOPERATIVE."},{"key":"C","text":"BOTH A AND B."}],"answer":"B","confidence":"h","explanation":"Alternate brakes: sin autobrake (con antiskid si hay presión amarilla).","fcomRef":"DSC-32"},{"id":"gear-34","n":34,"q":"THE ANTISKID DEACTIVATES WHEN GROUND SPEED IS LESS THAN _____.","options":[{"key":"A","text":"10 KTS."},{"key":"B","text":"20 KTS."},{"key":"C","text":"25 KTS."},{"key":"D","text":"30 KTS."}],"answer":"B","confidence":"h","explanation":"El antiskid se desactiva bajo 20 kt.","fcomRef":"DSC-32"},{"id":"gear-35","n":35,"q":"THE AUTOBRAKE WILL ARM IF AT LEAST ONE ADIRS IS FUNCTIONNING.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: se requieren al menos dos ADIRS.","fcomRef":"DSC-32"},{"id":"gear-36","n":36,"q":"THE BRAKES PRESSURE INDICATION ON TRIPLE PRESSURE INDICATOR READS WHICH SYSTEM PRESSURE?","options":[{"key":"A","text":"YELLOW."},{"key":"B","text":"BLUE."},{"key":"C","text":"GREEN."}],"answer":"A","confidence":"h","explanation":"El triple indicador lee el sistema amarillo.","fcomRef":"DSC-32"},{"id":"gear-37","n":37,"q":"THE CARGO DOORS ARE POWERED BY:","options":[{"key":"A","text":"THE BLUE ELECTRIC PUMP."},{"key":"B","text":"THE YELLOW HYDRAULIC SYSTEM BEFORE ENGINE START AND THE GREEN HYDRAULIC SYSTEM AFTER ENGINE START."},{"key":"C","text":"THE YELLOW HYDRAULIC SYSTEM."},{"key":"D","text":"THE BLUE HYDRAULIC SYSTEM BEFORE ENGINE START AND THE GREEN HYDRAULIC SYSTEM AFTER ENGINE START."}],"answer":"C","confidence":"h","explanation":"Puertas de carga: sistema amarillo.","fcomRef":"DSC-52"},{"id":"gear-38","n":38,"q":"THE COCKPIT DOOR:","options":[{"key":"A","text":"CAN ONLY BE OPEN INTO THE COCKPIT."},{"key":"B","text":"CAN ONLY OPEN INTO THE CABIN."},{"key":"C","text":"NORMALLY OPENS INTO THE COCKPIT BUT CAN BE FORCED IN EITHER DIRECTION."},{"key":"D","text":"SLIDES IN EITHER DIRECTION."}],"answer":"C","confidence":"m","explanation":"Normalmente abre hacia la cabina de mando; puede forzarse en caso de descompresión.","fcomRef":"DSC-52"},{"id":"gear-39","n":39,"q":"THE COCKPIT WINDOWS CAN BE OPENED BOTH FROM INSIDE AND OUTSIDE.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."},{"key":"C","text":"FROM INSIDE ONLY."}],"answer":"A","confidence":"h","explanation":"Verdadero: pueden abrirse desde adentro y desde afuera.","fcomRef":"DSC-52"},{"id":"gear-40","n":40,"q":"THE ECAM WILL DISPLAY A DOOR NOT LOCKED IN:","options":[{"key":"A","text":"AMBER."},{"key":"B","text":"RED."},{"key":"C","text":"GREEN."}],"answer":"A","confidence":"h","explanation":"Puerta no trabada en ámbar.","fcomRef":"DSC-52"},{"id":"gear-41","n":41,"q":"THE FORWARD AND AFT CARGO DOORS CAN BE OPENED FROM:","options":[{"key":"A","text":"THE INSIDE AND THE OUTSIDE."},{"key":"B","text":"THE OUTSIDE ONLY."}],"answer":"B","confidence":"h","explanation":"Las puertas de carga se abren sólo desde afuera.","fcomRef":"DSC-52"},{"id":"gear-42","n":42,"q":"THE GEAR DOORS REMAIN OPEN AFTER A MANUAL EXTENSION.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"A","confidence":"h","explanation":"Verdadero: tras la extensión manual las compuertas quedan abiertas.","fcomRef":"DSC-32"},{"id":"gear-43","n":43,"q":"THE GREEN DECEL LIGHT ON THE AUTOBRAKE SWITCH ILLUMINATES WHEN THE ACTUAL AIRPLANE DECELERATION CORRESPONDS TO ________% OF THE SELECTED RATE.","options":[{"key":"A","text":"80"},{"key":"B","text":"95"},{"key":"C","text":"100"}],"answer":"A","confidence":"h","explanation":"DECEL a 80% de la tasa seleccionada.","fcomRef":"DSC-32"},{"id":"gear-44","n":44,"q":"THE HALON FIRE EXTINGUISHER SHOULD BE USED ON WHAT TYPE FIRES?","options":[{"key":"A","text":"ELECTRICAL FIRES ONLY."},{"key":"B","text":"ELECTRICAL AND BURNING METALS."},{"key":"C","text":"ELECTRICAL AND FLAMMABLE LIQUID FIRES."},{"key":"D","text":"ELECTRICAL AND ORDINARY COMBUSTIBLES."}],"answer":"C","confidence":"h","explanation":"Halón: fuegos eléctricos y de líquidos inflamables.","fcomRef":"DSC-26"},{"id":"gear-45","n":45,"q":"THE.............. HYDRAULIC SYSTEM PROVIDES POWER FOR GEAR EXTENSION/RETRACTION.","options":[{"key":"A","text":"YELLOW."},{"key":"B","text":"BLUE."},{"key":"C","text":"GREEN."}],"answer":"C","confidence":"h","explanation":"Tren: sistema verde.","fcomRef":"DSC-32"},{"id":"gear-46","n":46,"q":"THE MAXIMUN DEGREE OF NOSE WHEEL STEERING AVAILABLE WHEN USING THE STEERING HANDWHEEL IS ________.","options":[{"key":"A","text":"+/- 60"},{"key":"B","text":"+/- 75"},{"key":"C","text":"+/- 95"}],"answer":"B","confidence":"h","explanation":"Handwheel: ±75°.","fcomRef":"DSC-32"},{"id":"gear-47","n":47,"q":"THE NORMAL BRAKE SYSTEM USES ________ HYDRAULIC PRESSURE AND THE ALTERNATE BRAKES USE_______ SYSTEM PRESSURE, WITH_____ BACKUP.","options":[{"key":"A","text":"GREEN, BLUE, AN ELECTRICAL."},{"key":"B","text":"GREEN, YELLOW, AN ACCUMULATOR."},{"key":"C","text":"GREEN, YELLOW, AN ELECTRICAL."}],"answer":"B","confidence":"h","explanation":"Normal: verde; alternate: amarillo con acumulador.","fcomRef":"DSC-32"},{"id":"gear-48","n":48,"q":"THE PARKING BRAKE ACCUMULATOR IS DESIGNED TO MAINTAIN THE PARKING PRESSURE FOR AT LEAST _____.","options":[{"key":"A","text":"6 HOURS."},{"key":"B","text":"12 HOURS."},{"key":"C","text":"18 HOURS."},{"key":"D","text":"24 HOURS."}],"answer":"B","confidence":"h","explanation":"El acumulador mantiene el freno de parqueo al menos 12 h.","fcomRef":"DSC-32"},{"id":"gear-49","n":49,"q":"THE PBE PROVIDES A BREATHABLE ATMOSPHERE FOR APPROXIMATELY ____ MINUTES.","options":[{"key":"A","text":"10"},{"key":"B","text":"15"},{"key":"C","text":"16"},{"key":"D","text":"18"}],"answer":"B","confidence":"h","explanation":"PBE: ~15 min.","fcomRef":"DSC-35"},{"id":"gear-50","n":50,"q":"THERE ARE TWO TRIANGLES FOR EACH GEAR ON THE ECAM WHEEL PAGE. WHAT DO THEY REPRESENT?","options":[{"key":"A","text":"EACH TRIANGLE REPRESENTS ONE WHEEL ON THE GEAR."},{"key":"B","text":"EACH TRIANGLE REPRESENTS THE POSITION DETECTED BY ONE OF THE TWO COMPUTERS SYSTEMS."},{"key":"C","text":"EACH TRIANGLE REPRESENTS ONE OF THE BRAKING SYSTEMS AVAILABLE FOR THAT GEAR."},{"key":"D","text":"THE FRONT TRIANGLE INDICATES THE POSITION OF THAT GEAR AND THE BACK TRIANGLE INDICATES THE STATUS OF THE BRAKES FOR THAT GEAR."}],"answer":"B","confidence":"h","explanation":"Cada triángulo representa la posición detectada por uno de los dos LGCIU.","fcomRef":"DSC-32"},{"id":"gear-51","n":51,"q":"THERE IS NO OTHER WAY OF DEPLOYING THE OVERWING ESCAPE SLIDE IF IT FAILS TO DEPLOY AUTOMATICALLY ON OPENING THE EMERGENCY EXIT.","options":[{"key":"A","text":"TRUE."},{"key":"B","text":"FALSE."}],"answer":"B","confidence":"h","explanation":"Falso: hay una manija de inflado manual.","fcomRef":"DSC-52"},{"id":"gear-52","n":52,"q":"THE SLIDE ARMED LIGHT ILLUMINATES WHITE ON THE PASSENGER CABIN ENTRY DOORS WHEN:","options":[{"key":"A","text":"THE DOOR IS NOT ARMED."},{"key":"B","text":"THE DOOR IS ARMED."},{"key":"C","text":"THE CONTROL HANDLE IS OPERATED WITH THE SLIDE ARMED."}],"answer":"C","confidence":"h","explanation":"SLIDE ARMED blanca: al operar la manija con el tobogán armado.","fcomRef":"DSC-52"},{"id":"gear-53","n":53,"q":"THE STEERING HANDWHEELS, WHICH ARE INTERCONNECTED, CAN STEER THE NOSE WHEEL UP TO:_____ IN EITHER DIRECTION.","options":[{"key":"A","text":"55º"},{"key":"B","text":"65º"},{"key":"C","text":"75º"},{"key":"D","text":"90º"}],"answer":"C","confidence":"h","explanation":"Handwheels interconectados: ±75°.","fcomRef":"DSC-32"},{"id":"gear-54","n":54,"q":"THE STROBE LIGHT SELECTOR IS SET TO AUTO. IN THIS POSITION, WHEN DO THE STROBE LIGHTS STOP FLASHING?","options":[{"key":"A","text":"WHEN THE AIRCRAFT TOUCHES DOWN."},{"key":"B","text":"WHEN THE FIRST REVERSER IS DEPLOYED."},{"key":"C","text":"WHEN THE LANDING LIGHTS ARE SWITCHED OFF."},{"key":"D","text":"WHEN THE LAST ENGINE HAS BEEN SHUT DOWN."}],"answer":"A","confidence":"h","explanation":"STROBE en AUTO: se apaga al tocar tierra (shock absorber comprimido).","fcomRef":"DSC-33"},{"id":"gear-55","n":55,"q":"WHAT ARE THE INDICATIONS THAT THE PBE OXYGEN SUPPLY HAS DEPLETED?","options":[{"key":"A","text":"THE HOOD COLLAPSES TO THE POINT THAT IT TOUCHES YOUR FACE OR BY A FLASHING RED LIGHT IN ADDITION TO THE FLASHING GREEN LIGHT."},{"key":"B","text":"THE SOUND OF THE OXYEN FLOW STOPS AND FLASHING RED AND GREEN LIGHTS APPEAR."},{"key":"C","text":"NO 02 SUPPLY INDICATIONS & LIGHTS ONLY INDICATE TIME."},{"key":"D","text":"ALL OF THE ABOVE."}],"answer":"A","confidence":"m","explanation":"Agotamiento del PBE: la capucha colapsa sobre la cara (según modelo, también indicadores luminosos).","fcomRef":"DSC-35"},{"id":"gear-56","n":56,"q":"WHAT COCKPIT LIGHTING IS AVAILABLE DURING AN EMERGENCY ELECTRICAL CONFIGURATION (EEC)?","options":[{"key":"A","text":"ALL LIGHTS ARE FULLY FUNCTIONAL."},{"key":"B","text":"DOME LIGHTS, MAIN PANEL FLOOD LIGHTS, AND THE STANDBY COMPASS LIGHT."},{"key":"C","text":"DOME (function () {
  const STORE_KEY = "a320-dgac-qbank:v1";
  const CONF = { h: ["ALTA", "Confianza alta"], m: ["VERIFICAR", "Verificar con FCOM"], l: ["DUDOSA", "Dudosa: verificar en FCOM"] };
  const groups = BANK.groups;
  const byId = {};
  groups.forEach(g => g.questions.forEach(q => { byId[q.id] = Object.assign({ gid: g.id }, q); }));

  let saved = {};
  let storageOk = true;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { storageOk = false; saved = {}; }
  const answers = saved.answers || {};
  const ui = Object.assign({ group: groups[0].id, mode: "all", shuffle: false }, saved.ui || {});
  let order = [], idx = 0, confirmReset = false;

  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers, ui: { group: ui.group, mode: ui.mode, shuffle: ui.shuffle } })); }
    catch (e) { storageOk = false; }
  }
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function stats(list) {
    let ok = 0, bad = 0;
    list.forEach(q => { const a = answers[q.id]; if (a) (a === q.answer ? ok++ : bad++); });
    return { ok, bad, total: list.length };
  }
  function groupQs(gid) { return gid === "__all" ? Object.values(byId) : (groups.find(g => g.id === gid) || groups[0]).questions.map(q => byId[q.id]); }
  function buildOrder(keepId) {
    let list = groupQs(ui.group);
    if (ui.mode === "wrong") list = list.filter(q => answers[q.id] && answers[q.id] !== q.answer);
    if (ui.mode === "pending") list = list.filter(q => !answers[q.id]);
    if (ui.mode === "verify") list = list.filter(q => q.confidence !== "h");
    order = list.map(q => q.id);
    if (ui.shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    idx = keepId && order.includes(keepId) ? order.indexOf(keepId) : 0;
    if (!keepId && ui.mode === "all") { const first = order.findIndex(id => !answers[id]); if (first > 0) idx = first; }
  }

  function renderGlobal() {
    const s = stats(Object.values(byId));
    const done = s.ok + s.bad;
    const pct = done ? Math.round(100 * s.ok / done) : 0;
    $("global").innerHTML =
      `<span>Respondidas <b>${done}</b>/${s.total}</span><span class="ok">Correctas <b>${s.ok}</b></span><span class="bad">Incorrectas <b>${s.bad}</b></span><span>Acierto <b>${pct}%</b></span>`;
  }
  function renderGroups() {
    const all = [{ id: "__all", nameEs: "Todas las materias", name: "ALL SYSTEMS", questions: Object.values(byId) }].concat(groups);
    $("groups").innerHTML = all.map(g => {
      const s = stats(g.questions.map(q => byId[q.id]));
      const o = 100 * s.ok / s.total, x = 100 * s.bad / s.total;
      return `<button class="g" data-g="${g.id}" aria-current="${g.id === ui.group}">
        <span class="nm">${esc(g.nameEs)}</span><span class="ct">${s.ok + s.bad}/${s.total}</span>
        <span class="en">${esc(g.name)}</span>
        <span class="bar"><i class="o" style="width:${o}%"></i><i class="x" style="width:${x}%"></i></span></button>`;
    }).join("");
  }
  function renderFilters() {
    const list = groupQs(ui.group);
    const nWrong = list.filter(q => answers[q.id] && answers[q.id] !== q.answer).length;
    const nPend = list.filter(q => !answers[q.id]).length;
    const nVer = list.filter(q => q.confidence !== "h").length;
    const modes = [["all", "Todas"], ["pending", `Sin responder · ${nPend}`], ["wrong", `Falladas · ${nWrong}`], ["verify", `Para verificar · ${nVer}`]];
    $("filters").innerHTML = modes.map(([m, l]) => `<button class="chip" data-m="${m}" aria-pressed="${ui.mode === m}">${l}</button>`).join("")
      + `<button class="chip" data-shuffle aria-pressed="${ui.shuffle}">Mezclar</button>`;
  }

  function renderDU() {
    const du = $("du");
    if (!order.length) {
      const msg = ui.mode === "wrong" ? "No tenés preguntas falladas en esta materia." : ui.mode === "pending" ? "Respondiste todas las preguntas de esta materia." : "No hay preguntas para este filtro.";
      du.innerHTML = `<div class="empty">${msg}</div><div class="nav"><button class="btn" data-m="all">Ver todas</button></div>`;
      return;
    }
    const q = byId[order[idx]];
    const g = groups.find(x => x.id === q.gid);
    const chosen = answers[q.id];
    const answered = !!chosen;
    const conf = CONF[q.confidence] || CONF.h;
    const opts = q.options.map(o => {
      let cls = "";
      if (answered) cls = o.key === q.answer ? "correct" : (o.key === chosen ? "wrong" : "dim");
      return `<li><button class="opt ${cls}" data-k="${o.key}" ${answered ? "disabled" : ""}><span class="k">${o.key}</span><span class="t">${esc(o.text)}</span></button></li>`;
    }).join("");
    let verdict = "";
    if (answered) {
      const ok = chosen === q.answer;
      verdict = `<div class="verdict ${ok ? "ok" : "bad"}">
        <div class="v">${ok ? "Correcto" : "Incorrecto"}${ok ? "" : ` · respuesta ${q.answer}`}</div>
        <p>${esc(q.explanation)}</p>
        <div class="ref"><span>FCOM <b>${esc(q.fcomRef)}</b></span><span>${conf[1]}</span></div>
        ${q.confidence !== "h" ? `<div class="note">Esta respuesta no tiene confirmación plena: chequeala en el FCOM antes del examen.</div>` : ""}
      </div>`;
    }
    const dots = order.length <= 120 ? `<div class="dots">${order.map((id, i) => {
      const a = answers[id]; const c = a ? (a === byId[id].answer ? "o" : "x") : "";
      return `<button class="${c} ${i === idx ? "cur" : ""}" data-i="${i}" aria-label="Pregunta ${i + 1}"></button>`;
    }).join("")}</div>` : "";
    du.innerHTML = `
      <div class="du-head"><span class="pos">${idx + 1} / ${order.length}</span><span>${esc(g.nameEs)} · Nº ${q.n}</span><span class="spacer"></span><span class="conf ${q.confidence}" title="${conf[1]}">${conf[0]}</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <ul class="opts">${opts}</ul>
      ${verdict}
      <div class="nav">
        <button class="btn" data-nav="-1" ${idx === 0 ? "disabled" : ""}>Anterior</button>
        <button class="btn primary" data-nav="1" ${idx >= order.length - 1 ? "disabled" : ""}>Siguiente</button>
        <span class="kbd">Teclas A–F · ← →</span>
        <span class="spacer"></span>
        ${confirmReset
          ? `<span class="confirm">¿Borrar las respuestas de esta materia? <button class="btn" data-reset="yes">Borrar</button><button class="btn ghost" data-reset="no">Cancelar</button></span>`
          : `${answered ? `<button class="btn ghost" data-retry>Reintentar</button>` : ""}<button class="btn ghost" data-reset="ask">Reiniciar materia</button>`}
      </div>
      ${dots}`;
  }
  function renderAll() {
    renderGlobal(); renderGroups(); renderFilters(); renderDU();
    $("storeNote").textContent = storageOk ? "Tu progreso se guarda en este navegador." : "Este navegador no permite guardar el progreso; se perderá al cerrar la página.";
  }

  function answer(k) {
    const id = order[idx]; if (!id || answers[id]) return;
    if (!byId[id].options.some(o => o.key === k)) return;
    answers[id] = k; persist(); renderAll();
  }
  function go(d) { const n = idx + d; if (n < 0 || n >= order.length) return; idx = n; confirmReset = false; renderDU(); window.scrollTo({ top: 0 }); }
  function setGroup(gid) { ui.group = gid; confirmReset = false; buildOrder(); persist(); renderAll(); if (location.hash !== "#" + gid) history.replaceState(null, "", "#" + gid); }

  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.g) return setGroup(t.dataset.g);
    if (t.dataset.m) { ui.mode = t.dataset.m; buildOrder(); persist(); return renderAll(); }
    if ("shuffle" in t.dataset) { ui.shuffle = !ui.shuffle; buildOrder(order[idx]); persist(); return renderAll(); }
    if (t.dataset.k) return answer(t.dataset.k);
    if (t.dataset.nav) return go(+t.dataset.nav);
    if (t.dataset.i) { idx = +t.dataset.i; return renderDU(); }
    if ("retry" in t.dataset) { delete answers[order[idx]]; persist(); return renderAll(); }
    if (t.dataset.reset === "ask") { confirmReset = true; return renderDU(); }
    if (t.dataset.reset === "no") { confirmReset = false; return renderDU(); }
    if (t.dataset.reset === "yes") { groupQs(ui.group).forEach(q => delete answers[q.id]); confirmReset = false; persist(); buildOrder(); return renderAll(); }
  });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (/^[A-F]$/.test(k)) answer(k);
    else if (e.key === "ArrowRight" || e.key === "Enter") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });
  function fromHash() {
    const h = location.hash.slice(1);
    if (h && (h === "__all" || groups.some(g => g.id === h)) && h !== ui.group) { ui.group = h; buildOrder(); renderAll(); }
  }
  window.addEventListener("hashchange", fromHash);

  const h = location.hash.slice(1);
  if (h && (h === "__all" || groups.some(g => g.id === h))) ui.group = h;
  buildOrder(); renderAll();
})();
</script>

</body>
</html>
